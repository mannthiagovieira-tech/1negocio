<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Termo de Confidencialidade · 1Negócio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#f7f8f6; --surface:#ffffff; --surface-2:#f2f4f0;
    --ink:#0d1a13; --ink-2:#38463e; --ink-3:#6b7a71; --ink-4:#9aa79f;
    --line:#e4e8e2; --line-2:#d4dccf;
    --accent:#0a9d55; --accent-2:#0c7842; --accent-soft:rgba(10,157,85,.08); --accent-ring:rgba(10,157,85,.20);
    --amber:#c48b04; --amber-soft:rgba(196,139,4,.08); --danger:#c22b3f;
    --sans:'Geist',system-ui,-apple-system,sans-serif;
    --serif:'Syne',serif;
    --mono:'JetBrains Mono',ui-monospace,monospace;
    --r:13px; --r-xl:22px;
    --sh:0 4px 14px rgba(11,44,25,.06);
    --sh-lg:0 20px 40px -12px rgba(11,44,25,.10);
    --sh-accent:0 6px 18px -4px rgba(10,157,85,.35);
    --ease:cubic-bezier(.22,.9,.28,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;min-height:100vh;-webkit-tap-highlight-color:transparent}
  body{
    background: radial-gradient(1000px 600px at 50% -200px, rgba(10,157,85,.10), transparent 60%), #f7f8f6;
    background-attachment:fixed;
    padding:24px 16px 60px;
  }
  header{max-width:720px;margin:0 auto 20px;display:flex;align-items:center;gap:10px}
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-weight:800;font-size:17px;color:var(--ink);letter-spacing:-.02em}
  .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
  main{max-width:720px;margin:0 auto}
  .card{background:var(--surface);border-radius:var(--r-xl);box-shadow:var(--sh-lg);border:1px solid var(--line);padding:28px 26px}
  @media(max-width:540px){.card{padding:22px 18px;border-radius:16px}}
  .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:6px}
  h1{font-family:var(--serif);font-weight:800;font-size:24px;color:var(--ink);letter-spacing:-.015em;margin-bottom:6px;line-height:1.2}
  .sub{color:var(--ink-3);font-size:13.5px;margin-bottom:22px}
  .corpo{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:20px 22px;white-space:pre-wrap;font-size:13.5px;line-height:1.7;color:var(--ink-2);max-height:420px;overflow-y:auto;font-family:var(--sans)}
  @media(max-width:540px){.corpo{padding:16px 14px;font-size:13px;max-height:360px}}
  .fld{display:flex;flex-direction:column;gap:6px;margin-top:14px}
  .fld > label{font-family:var(--mono);font-size:10.5px;letter-spacing:.10em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
  input,textarea{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;width:100%;outline:none;transition:all .22s var(--ease)}
  input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
  .checkbox{display:flex;gap:10px;align-items:flex-start;cursor:pointer;margin-top:16px;padding:12px 14px;background:var(--surface-2);border-radius:12px;border:1px solid var(--line)}
  .checkbox input{width:20px;height:20px;accent-color:var(--accent);cursor:pointer;padding:0;margin:0;flex-shrink:0}
  .checkbox span{font-size:13px;color:var(--ink-2);line-height:1.5}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 22px;border-radius:var(--r);font-family:var(--sans);font-weight:700;font-size:15px;transition:all .22s var(--ease);border:none;cursor:pointer;white-space:nowrap;width:100%;margin-top:18px}
  .btn-primary{background:linear-gradient(180deg,var(--accent),var(--accent-2));color:#fff;box-shadow:var(--sh-accent)}
  .btn-primary:hover{transform:translateY(-1px)}
  .btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}
  .msg{padding:14px 16px;border-radius:12px;font-size:13.5px;line-height:1.55;margin-top:14px}
  .msg.err{background:rgba(194,43,63,.08);color:var(--danger);border:1px solid rgba(194,43,63,.20)}
  .msg.ok{background:var(--accent-soft);color:var(--accent-2);border:1px solid var(--accent-ring)}
  .msg.info{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
  .ok-box{text-align:center;padding:40px 20px}
  .ok-box .ico{width:64px;height:64px;border-radius:50%;background:var(--accent-soft);color:var(--accent-2);display:inline-flex;align-items:center;justify-content:center;font-size:32px;font-weight:700;margin-bottom:14px}
</style>
</head>
<body>

<header>
  <div class="brand"><span class="dot"></span>1Negócio</div>
</header>

<main id="app">
  <div class="card">
    <div class="lbl">carregando…</div>
    <h1>Buscando termo</h1>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
<script>
'use strict';

const SB_URL = 'https://dbijmgqlcrgjlcfrastg.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRiaWptZ3FsY3JnamxjZnJhc3RnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMwNzYxNjMsImV4cCI6MjA4ODY1MjE2M30.mV2rANZ8Nb_AbifTmkEvdfX_nsm8zeT6Al_bPrCzNAA';
const sb = window.supabase.createClient(SB_URL, SB_KEY);
const app = document.getElementById('app');

const esc = s => (s ?? '').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function paramToken(){
  const m = new URL(location.href).searchParams.get('t');
  return (m || '').trim();
}

function tela(html){ app.innerHTML = `<div class="card">${html}</div>`; }

function telaErro(msg){
  tela(`
    <div class="lbl">indisponível</div>
    <h1>${esc(msg)}</h1>
    <p class="sub">Verifique o link. Se persistir, fale com quem te enviou.</p>
  `);
}

function telaJaAssinado(nda){
  const dt = nda.assinado_em ? new Date(nda.assinado_em).toLocaleString('pt-BR', {dateStyle:'medium', timeStyle:'short'}) : '—';
  tela(`
    <div class="ok-box">
      <div class="ico">✓</div>
      <div class="lbl">já assinado</div>
      <h1 style="margin-top:6px">Este termo já foi assinado</h1>
      <p class="sub" style="margin-top:6px">Assinado por <strong style="color:var(--ink)">${esc(nda.assinado_nome||'—')}</strong> em ${esc(dt)}.</p>
    </div>
  `);
}

function telaTermo(nda){
  tela(`
    <div class="lbl">termo de confidencialidade</div>
    <h1>${esc(nda.projeto_titulo || 'Negócio confidencial')}</h1>
    <p class="sub">Leia com atenção. Ao assinar, você concorda com todos os termos abaixo.</p>
    <div class="corpo">${esc(nda.corpo_gerado || '')}</div>

    <form id="f">
      <div class="fld">
        <label for="nome">nome completo</label>
        <input id="nome" required autocomplete="name" placeholder="ex. Roberto Alves">
      </div>
      <div class="fld">
        <label for="doc">CPF ou CNPJ</label>
        <input id="doc" required autocomplete="off" inputmode="text" placeholder="ex. 123.456.789-00">
      </div>
      <label class="checkbox">
        <input type="checkbox" id="aceite" required>
        <span>Li o termo acima na íntegra e concordo com todas as obrigações e prazos descritos. Reconheço que a assinatura eletrônica tem validade legal.</span>
      </label>
      <div id="msg" class="msg" style="display:none"></div>
      <button class="btn btn-primary" type="submit" id="btn">Assinar termo</button>
    </form>
  `);
  document.getElementById('f').onsubmit = onSubmit;
}

async function onSubmit(ev){
  ev.preventDefault();
  const nome = document.getElementById('nome').value.trim();
  const doc  = document.getElementById('doc').value.trim();
  const aceite = document.getElementById('aceite').checked;
  const msg = document.getElementById('msg');
  const btn = document.getElementById('btn');
  msg.style.display = 'none';
  if (!aceite) { msg.className='msg err'; msg.textContent = 'Marque o aceite pra prosseguir.'; msg.style.display='block'; return; }
  if (!nome || !doc) { msg.className='msg err'; msg.textContent = 'Preencha nome e documento.'; msg.style.display='block'; return; }
  btn.disabled = true; btn.textContent = 'Assinando…';
  const t = paramToken();
  const { data, error } = await sb.rpc('va_registrar_assinatura_nda', {
    p_token: t, p_nome: nome, p_documento: doc, p_ip: null,
  });
  if (error) {
    btn.disabled = false; btn.textContent = 'Assinar termo';
    msg.className='msg err'; msg.textContent = 'Não foi possível assinar: ' + error.message; msg.style.display='block';
    return;
  }
  // sucesso
  tela(`
    <div class="ok-box">
      <div class="ico">✓</div>
      <div class="lbl">assinado</div>
      <h1 style="margin-top:6px">Termo assinado</h1>
      <p class="sub" style="margin-top:6px">A 1Negócio recebeu sua assinatura. Nós entraremos em contato pelos próximos passos.</p>
    </div>
  `);
}

(async function boot(){
  const t = paramToken();
  if (!t) { telaErro('Link inválido'); return; }
  const { data, error } = await sb.rpc('va_nda_por_token', { p_token: t });
  if (error) { telaErro('Erro ao buscar termo'); console.warn(error); return; }
  const nda = Array.isArray(data) ? data[0] : data;
  if (!nda) { telaErro('Termo não encontrado ou expirado'); return; }
  if (nda.status === 'assinado') { telaJaAssinado(nda); return; }
  if (nda.status === 'recusado' || nda.status === 'expirado') { telaErro('Este termo não está mais disponível'); return; }
  telaTermo(nda);
})();
</script>
</body>
</html>
