<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Meu projeto · 1NEGÓCIO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#f7f8f6; --surface:#ffffff; --surface-2:#f2f4f0;
    --ink:#0d1a13; --ink-2:#38463e; --ink-3:#6b7a71; --ink-4:#9aa79f;
    --line:#e4e8e2; --line-2:#d4dccf;
    --accent:#0a9d55; --accent-2:#0c7842; --accent-soft:rgba(10,157,85,.08); --accent-ring:rgba(10,157,85,.20);
    --amber:#c48b04; --amber-soft:rgba(196,139,4,.08); --danger:#c22b3f;
    --sans:'Geist',system-ui,-apple-system,sans-serif;
    --serif:'Syne',serif;
    --mono:'JetBrains Mono',ui-monospace,monospace;
    --r:13px; --r-lg:20px; --r-xl:22px;
    --sh-sm:0 1px 2px rgba(11,44,25,.04);
    --sh:0 4px 14px rgba(11,44,25,.06);
    --sh-lg:0 20px 40px -12px rgba(11,44,25,.10);
    --sh-accent:0 6px 18px -4px rgba(10,157,85,.35);
    --ease:cubic-bezier(.22,.9,.28,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.5;min-height:100vh;-webkit-tap-highlight-color:transparent}
  body{
    background:
      radial-gradient(1000px 600px at 50% -200px, rgba(10,157,85,.10), transparent 60%),
      #f7f8f6;
    background-attachment:fixed;
    padding-bottom:80px;
  }
  a{color:var(--accent-2);text-decoration:none}
  button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
  input,textarea{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;width:100%;outline:none;transition:all .22s var(--ease)}
  input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
  textarea{resize:vertical;min-height:88px;line-height:1.55}
  .mono{font-family:var(--mono);letter-spacing:.02em}
  .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
  .h1{font-family:var(--serif);font-weight:800;font-size:28px;line-height:1.1;letter-spacing:-.02em;color:var(--ink)}
  .h2{font-family:var(--serif);font-weight:700;font-size:20px;line-height:1.2;letter-spacing:-.01em;color:var(--ink)}
  .h3{font-family:var(--serif);font-weight:700;font-size:16px;color:var(--ink)}
  .muted{color:var(--ink-3)}
  .row{display:flex;gap:12px;align-items:center}
  .col{display:flex;flex-direction:column;gap:12px}
  .hidden{display:none!important}

  /* HEADER */
  header.top{position:sticky;top:0;z-index:20;backdrop-filter:blur(14px);background:rgba(247,248,246,.82);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:14px}
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-weight:800;font-size:16px;letter-spacing:-.02em;color:var(--ink)}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
  .brand small{font-family:var(--mono);font-weight:500;font-size:10px;color:var(--ink-3);letter-spacing:.10em;text-transform:uppercase}
  @media(max-width:520px){.brand small{display:none}}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:var(--r);font-family:var(--sans);font-weight:600;font-size:14px;transition:all .22s var(--ease);border:1px solid transparent;white-space:nowrap}
  .btn-primary{background:linear-gradient(180deg,var(--accent),var(--accent-2));color:#fff;box-shadow:var(--sh-accent)}
  .btn-primary:hover{transform:translateY(-1px)}
  .btn-ghost{background:var(--surface);color:var(--ink);border-color:var(--line);box-shadow:var(--sh-sm)}
  .btn-sm{height:34px;padding:0 14px;font-size:12.5px;border-radius:10px}
  .btn:disabled{opacity:.5;cursor:not-allowed}

  main{max-width:960px;margin:0 auto;padding:24px 20px}

  /* AUTH */
  .auth-wrap{min-height:calc(100vh - 200px);display:flex;align-items:center;justify-content:center;padding:20px}
  .auth-card{width:100%;max-width:400px;background:var(--surface);border-radius:var(--r-xl);padding:32px 26px;box-shadow:var(--sh-lg);border:1px solid var(--line)}
  .auth-card h2{font-family:var(--serif);font-weight:700;font-size:22px;margin-bottom:6px;color:var(--ink);letter-spacing:-.01em}
  .auth-card p{color:var(--ink-3);font-size:13.5px;margin-bottom:20px;line-height:1.5}
  .auth-card .fld{margin-bottom:14px}
  .auth-card .lbl{display:block;margin-bottom:6px}
  .code-input{font-family:var(--mono);font-size:22px;letter-spacing:.4em;text-align:center;padding:16px}
  .auth-msg{font-size:12.5px;margin-top:10px;padding:10px 14px;border-radius:10px;line-height:1.5}
  .auth-msg.err{background:rgba(194,43,63,.08);color:var(--danger);border:1px solid rgba(194,43,63,.20)}
  .auth-msg.info{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
  .countdown{font-family:var(--mono);font-size:12px;color:var(--ink-3);text-align:center;margin-top:10px}

  /* SELETOR DE PROJETO */
  .sel-projetos{display:flex;flex-direction:column;gap:10px}
  .sel-projeto{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 20px;cursor:pointer;box-shadow:var(--sh-sm);transition:all .22s var(--ease);text-align:left}
  .sel-projeto:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:var(--sh)}

  /* TABS */
  .tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px;margin-bottom:20px;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{flex-shrink:0;padding:9px 18px;border-radius:99px;font-family:var(--sans);font-size:13.5px;font-weight:600;color:var(--ink-3);cursor:pointer;transition:all .22s var(--ease);border:none;background:none;white-space:nowrap}
  .tabs button.on{background:var(--ink);color:#fff}
  .tabs button:hover:not(.on){background:var(--surface-2);color:var(--ink)}

  /* CARDS */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);padding:22px;box-shadow:var(--sh);margin-bottom:14px}
  .card-tight{padding:16px 18px}

  /* PAINEL · saudação */
  .saud{padding:20px 22px;background:linear-gradient(135deg, var(--surface) 0%, var(--accent-soft) 100%);border:1px solid var(--accent-ring);border-radius:var(--r-xl);margin-bottom:14px}
  .saud h1{font-family:var(--serif);font-weight:800;font-size:24px;letter-spacing:-.015em;color:var(--ink);margin-bottom:4px}
  .saud .sub{font-family:var(--mono);font-size:11.5px;color:var(--accent-2);letter-spacing:.05em}

  /* KPIs */
  .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
  @media(max-width:640px){.kpi-grid{grid-template-columns:repeat(2,1fr)}}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px;box-shadow:var(--sh-sm)}
  .kpi .k{font-family:var(--mono);font-size:10px;letter-spacing:.10em;text-transform:uppercase;color:var(--ink-3)}
  .kpi .v{font-family:var(--serif);font-weight:800;font-size:26px;color:var(--ink);letter-spacing:-.01em;margin-top:2px}
  .kpi.destaque .v{color:var(--accent-2)}

  /* FUNIL */
  .funil-linha{display:grid;grid-template-columns:170px 1fr 40px;gap:10px;align-items:center;padding:8px 12px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;font-size:13px;margin-bottom:6px}
  @media(max-width:520px){.funil-linha{grid-template-columns:1fr auto}}
  .funil-nome{font-family:var(--serif);font-weight:600;color:var(--ink)}
  .funil-barra{height:20px;background:var(--surface);border:1px solid var(--line);border-radius:99px;overflow:hidden}
  @media(max-width:520px){.funil-barra{display:none}}
  .funil-barra span{display:block;height:100%;background:linear-gradient(90deg,var(--accent) 0%,#12c26b 100%);border-radius:99px;min-width:4px;transition:width .5s var(--ease)}
  .funil-total{font-family:var(--serif);font-weight:700;font-size:15px;color:var(--ink);text-align:right;letter-spacing:-.005em}

  /* AGUARDANDO VOCÊ */
  .aguar{background:linear-gradient(135deg,var(--amber-soft),rgba(196,139,4,.02));border:1px solid rgba(196,139,4,.22);border-radius:var(--r-lg);padding:16px 18px;margin-bottom:14px}
  .aguar .titulo{font-family:var(--serif);font-weight:700;font-size:15px;color:var(--amber);margin-bottom:8px}
  .aguar-item{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed rgba(196,139,4,.20);font-size:13px}
  .aguar-item:last-child{border-bottom:none}
  .aguar-item .prev{font-family:var(--mono);font-size:11px;color:var(--amber)}
  .aguar-vazio{padding:6px 0;color:var(--ink-2);font-size:13px;line-height:1.5}
  .aguar-vazio strong{color:var(--accent-2)}

  /* ANDAMENTO cronograma */
  .cron{position:relative;padding-left:26px}
  .cron::before{content:'';position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:linear-gradient(180deg,var(--line-2),var(--line));border-radius:99px}
  .cron-item{position:relative;padding:12px 4px 12px 4px;margin-left:-6px;border-radius:8px;transition:background .18s var(--ease)}
  .cron-item:hover{background:var(--surface-2)}
  .cron-item::before{content:'';position:absolute;left:-25px;top:16px;width:18px;height:18px;border-radius:50%;background:var(--surface);border:2px solid var(--line-2);z-index:2}
  .cron-item.ok::before{background:var(--accent);border-color:var(--accent)}
  .cron-item.ok::after{content:'✓';position:absolute;left:-21px;top:14px;color:#fff;font-size:11px;font-weight:700;z-index:3}
  .cron-item.now::before{border-color:var(--accent);box-shadow:0 0 0 5px var(--accent-soft);animation:pulse 2s var(--ease) infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 5px var(--accent-soft)}50%{box-shadow:0 0 0 8px var(--accent-soft)}}
  .cron-titulo{font-family:var(--sans);font-weight:600;font-size:14px;color:var(--ink);line-height:1.35;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .cron-item.ok .cron-titulo{color:var(--ink-3)}
  .cron-meta{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);letter-spacing:.05em;margin-top:4px}
  .cron-resp{padding:2px 8px;border-radius:99px;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;background:var(--surface-2);color:var(--ink-3);border:1px solid var(--line);white-space:nowrap}
  .cron-resp.voce{background:var(--amber-soft);color:var(--amber);border-color:rgba(196,139,4,.20)}

  /* INTERESSADOS */
  .int-item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px;margin-bottom:8px;transition:background .18s var(--ease);cursor:pointer;box-shadow:var(--sh-sm)}
  .int-item:hover{background:var(--surface-2)}
  .int-head{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
  .int-ref{font-family:var(--mono);font-weight:700;font-size:14px;color:var(--accent-2);letter-spacing:.02em}
  .int-arq{font-family:var(--serif);font-weight:700;font-size:15px;color:var(--ink);letter-spacing:-.005em}
  .int-cid{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);margin-top:3px}
  .int-est{display:inline-block;margin-top:6px;padding:3px 10px;border-radius:99px;font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;background:var(--accent-soft);color:var(--accent-2);border:1px solid var(--accent-ring)}
  .int-nota-area{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);display:none}
  .int-item.aberto .int-nota-area{display:block}

  /* INVESTIMENTO */
  .inv-item{display:grid;grid-template-columns:1fr auto;gap:12px;padding:14px 16px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;align-items:center}
  .inv-nome{font-family:var(--serif);font-weight:700;font-size:15px;color:var(--ink);letter-spacing:-.005em}
  .inv-vol{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);margin-top:2px}
  .inv-valor{font-family:var(--serif);font-weight:700;font-size:18px;color:var(--ink);text-align:right;letter-spacing:-.01em}
  .inv-valor.sem-custo{color:var(--accent-2);font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}

  /* CONTRATO */
  .parc{display:grid;grid-template-columns:auto 1fr auto auto;gap:14px;padding:12px 16px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;margin-bottom:6px;align-items:center;font-size:13px}
  .parc-num{font-family:var(--mono);font-weight:700;color:var(--ink);font-size:14px}
  .parc-dt{font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
  .parc-val{font-family:var(--serif);font-weight:700;color:var(--ink);letter-spacing:-.005em}
  .parc-st{padding:3px 10px;border-radius:99px;font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
  .parc-st.pago{background:var(--accent-soft);color:var(--accent-2);border:1px solid var(--accent-ring)}
  .parc-st.pendente{background:var(--surface);color:var(--ink-3);border:1px solid var(--line)}
  .parc-st.atrasado{background:rgba(194,43,63,.08);color:var(--danger);border:1px solid rgba(194,43,63,.20)}

  /* aviso */
  .aviso{background:var(--amber-soft);border:1px solid rgba(196,139,4,.22);color:var(--amber);border-radius:var(--r);padding:12px 16px;font-size:13px;line-height:1.55;margin-top:12px}
  .aviso strong{font-weight:700}

  /* TOAST */
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 20px;border-radius:99px;font-size:13px;font-weight:500;box-shadow:0 12px 28px -8px rgba(11,44,25,.35);opacity:0;transition:all .28s var(--ease);pointer-events:none;z-index:100}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.ok{background:var(--accent-2)}
  .toast.err{background:var(--danger)}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <span class="dot"></span>
    <span>1NEGÓCIO <small>· Seu projeto</small></span>
  </div>
  <button id="logout-btn" class="btn btn-ghost btn-sm hidden" onclick="logout()">sair</button>
</header>

<main id="app"><div class="auth-wrap"><div class="auth-card"><h2>Carregando…</h2></div></div></main>

<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
<script>
'use strict';

const SB_URL = 'https://dbijmgqlcrgjlcfrastg.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRiaWptZ3FsY3JnamxjZnJhc3RnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMwNzYxNjMsImV4cCI6MjA4ODY1MjE2M30.mV2rANZ8Nb_AbifTmkEvdfX_nsm8zeT6Al_bPrCzNAA';
const sb = window.supabase.createClient(SB_URL, SB_KEY);
const app = document.getElementById('app');
const logoutBtn = document.getElementById('logout-btn');

// ─── util ──────────────────────────────────────────────────────────
const esc = s => (s ?? '').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl = n => 'R$ ' + (Number(n)||0).toLocaleString('pt-BR', {maximumFractionDigits:0});
const dataBR = d => { if(!d) return '—'; const dt = new Date(d+'T00:00:00'); return dt.toLocaleDateString('pt-BR', {day:'2-digit', month:'short'}).replace('.',''); };
function toast(msg, kind){ const t = document.getElementById('toast'); t.className = 'toast show ' + (kind||''); t.textContent = msg; clearTimeout(toast._t); toast._t = setTimeout(()=>{ t.className='toast'; }, 2500); }
function normTel(t){ const d=(t||'').replace(/\D/g,''); if(!d) return null; if(d.length===10||d.length===11) return '55'+d; if(d.length>=12&&d.length<=13&&d.startsWith('55')) return d; return d; }

// ─── estado ────────────────────────────────────────────────────────
let _session = null;
let _projeto = null;
let _projetos = [];
let _abaAtiva = 'painel';
let _dados = null;

// ─── auth ──────────────────────────────────────────────────────────
async function initAuth(){
  const { data: { session } } = await sb.auth.getSession();
  _session = session;
  sb.auth.onAuthStateChange((_e, s) => { _session = s; router(); });
  return session;
}

async function logout(){
  await sb.auth.signOut();
  _projeto = null; _projetos = []; _dados = null;
  location.hash = '';
  router();
}

async function router(){
  if (!_session) { renderLogin(); return; }
  logoutBtn.classList.remove('hidden');
  if (!_projeto) { await carregarProjetos(); return; }
  renderProjeto();
}

// ─── LOGIN por OTP ─────────────────────────────────────────────────
let _otpFluxo = { fase:'telefone', wpp:null, cooldown:0 };
let _cdTimer = null;

function renderLogin(errMsg){
  logoutBtn.classList.add('hidden');
  if (_otpFluxo.fase === 'telefone') renderTelefone(errMsg);
  else renderCodigo(errMsg);
}

function renderTelefone(errMsg){
  app.innerHTML = `
    <div class="auth-wrap">
      <div class="auth-card">
        <div class="lbl" style="margin-bottom:6px">acesso do cliente</div>
        <h2>Entre no seu projeto</h2>
        <p>Informe o WhatsApp que você usou no cadastro. Vamos enviar um código pra confirmar que é você.</p>
        <form id="lg-form">
          <div class="fld">
            <label class="lbl" for="lg-wpp">WhatsApp com DDD</label>
            <input id="lg-wpp" inputmode="tel" placeholder="ex. 48 99999-0000" autocomplete="tel" required>
          </div>
          ${errMsg ? `<div class="auth-msg ${errMsg.tipo||'err'}">${esc(errMsg.msg)}</div>` : ''}
          <button class="btn btn-primary" type="submit" style="width:100%;margin-top:14px">Receber código</button>
        </form>
      </div>
    </div>`;
  document.getElementById('lg-form').onsubmit = async (ev) => {
    ev.preventDefault();
    const btn = ev.target.querySelector('button');
    const wpp = normTel(document.getElementById('lg-wpp').value);
    if (!wpp) { renderTelefone({tipo:'err', msg:'Formato inválido. Use DDD + número.'}); return; }
    btn.disabled = true; btn.textContent = 'Verificando…';
    // Pré-check: existe acesso? (RPC anônima, boolean)
    const { data: temAcesso, error: eCheck } = await sb.rpc('va_cli_tem_acesso', { p_telefone: wpp });
    if (eCheck) { renderTelefone({tipo:'err', msg:'Não conseguimos verificar agora. Tente de novo em alguns segundos.'}); return; }
    if (!temAcesso) {
      // mensagem neutra — não revela se número existe ou não
      renderTelefone({tipo:'info', msg:'Não localizamos um projeto para este número. Confira se digitou certo, ou fale com quem gerencia seu contrato.'});
      return;
    }
    // envia OTP
    const { data: sendResp, error: eSend } = await sb.functions.invoke('otp-send', { body: { whatsapp: wpp } });
    if (eSend) { renderTelefone({tipo:'err', msg:'Não conseguimos enviar o código. Tente novamente em alguns instantes.'}); return; }
    if (sendResp && sendResp.ok === false) { renderTelefone({tipo:'err', msg: sendResp.error || 'Falha ao enviar código.'}); return; }
    _otpFluxo = { fase:'codigo', wpp, cooldown: 60 };
    renderLogin();
  };
}

function renderCodigo(errMsg){
  app.innerHTML = `
    <div class="auth-wrap">
      <div class="auth-card">
        <div class="lbl" style="margin-bottom:6px">confirmação</div>
        <h2>Digite o código</h2>
        <p>Enviamos por SMS/WhatsApp para <strong style="color:var(--ink)">${esc(formatarWpp(_otpFluxo.wpp))}</strong>.</p>
        <form id="cd-form">
          <div class="fld">
            <label class="lbl" for="cd-in">código de 6 dígitos</label>
            <input id="cd-in" class="code-input" inputmode="numeric" pattern="\\d{6}" maxlength="6" placeholder="000000" required autocomplete="one-time-code">
          </div>
          ${errMsg ? `<div class="auth-msg ${errMsg.tipo||'err'}">${esc(errMsg.msg)}</div>` : ''}
          <button class="btn btn-primary" type="submit" style="width:100%;margin-top:14px">Confirmar</button>
        </form>
        <div class="countdown" id="cd-count"></div>
        <div style="text-align:center;margin-top:14px">
          <button class="btn btn-ghost btn-sm" id="cd-back">← trocar número</button>
        </div>
      </div>
    </div>`;
  document.getElementById('cd-back').onclick = () => { _otpFluxo = {fase:'telefone', wpp:null, cooldown:0}; if (_cdTimer) clearInterval(_cdTimer); renderLogin(); };

  // countdown
  function tickCd(){
    const el = document.getElementById('cd-count');
    if (!el) return;
    if (_otpFluxo.cooldown <= 0) {
      el.innerHTML = '<a href="#" onclick="reenviarCodigo();return false" style="color:var(--accent-2)">reenviar código</a>';
      if (_cdTimer) { clearInterval(_cdTimer); _cdTimer = null; }
    } else {
      el.textContent = `Reenviar em ${_otpFluxo.cooldown}s`;
      _otpFluxo.cooldown--;
    }
  }
  tickCd();
  if (_cdTimer) clearInterval(_cdTimer);
  _cdTimer = setInterval(tickCd, 1000);

  document.getElementById('cd-form').onsubmit = async (ev) => {
    ev.preventDefault();
    const btn = ev.target.querySelector('button');
    const codigo = document.getElementById('cd-in').value.trim();
    if (!/^\d{6}$/.test(codigo)) { renderCodigo({tipo:'err', msg:'Código deve ter 6 dígitos.'}); return; }
    btn.disabled = true; btn.textContent = 'Confirmando…';
    const { data, error } = await sb.functions.invoke('otp-verify', { body: { whatsapp: _otpFluxo.wpp, codigo } });
    if (error) { renderCodigo({tipo:'err', msg:'Não conseguimos confirmar agora. Tente de novo.'}); return; }
    if (data && data.ok === false) { renderCodigo({tipo:'err', msg: data.error || 'Código incorreto ou expirado.'}); return; }
    // otp-verify retorna { ok:true, access_token, refresh_token, ... }
    if (data && data.access_token) {
      await sb.auth.setSession({ access_token: data.access_token, refresh_token: data.refresh_token });
    }
    // registrar acesso e continuar
    await sb.rpc('va_cli_registrar_acesso');
    _otpFluxo = { fase:'telefone', wpp:null, cooldown:0 };
    if (_cdTimer) clearInterval(_cdTimer);
    router();
  };
}

window.reenviarCodigo = async () => {
  if (!_otpFluxo.wpp || _otpFluxo.cooldown > 0) return;
  const { error } = await sb.functions.invoke('otp-send', { body: { whatsapp: _otpFluxo.wpp } });
  if (error) { toast('Falha ao reenviar', 'err'); return; }
  _otpFluxo.cooldown = 60;
  toast('Código reenviado', 'ok');
  renderLogin();
};

function formatarWpp(t){
  if (!t) return '';
  const digits = t.replace(/\D/g,'');
  const ddi = digits.slice(0,2);
  const ddd = digits.slice(2,4);
  const rest = digits.slice(4);
  const meio = rest.length === 9 ? rest.slice(0,5)+'-'+rest.slice(5) : rest.slice(0, rest.length-4)+'-'+rest.slice(-4);
  return `+${ddi} ${ddd} ${meio}`;
}

async function renderProjeto(){
  const id = _projeto.projeto_id;
  app.innerHTML = `<div style="padding:40px 20px;text-align:center;color:var(--ink-3)">carregando…</div>`;
  const [etapas, funil, interessados, investimento, parcelas, ondas, pausas, aditivos] = await Promise.all([
    sb.rpc('va_cli_etapas',        { p_projeto: id }),
    sb.rpc('va_cli_funil',         { p_projeto: id }),
    sb.rpc('va_cli_interessados',  { p_projeto: id }),
    sb.rpc('va_cli_investimento',  { p_projeto: id }),
    sb.rpc('va_cli_parcelas',      { p_projeto: id }),
    sb.from('va_projeto_ondas').select('numero,tipo,data_inicio,data_fim,meses,valor_mensal,dias_pausados,status').eq('projeto_id', id).order('numero'),
    sb.from('va_projeto_pausas').select('motivo,pausado_em,retomado_em,solicitado_por').eq('projeto_id', id).order('pausado_em', {ascending:false}),
    sb.from('va_projeto_aditivos').select('valor,motivo,vencimento,status').eq('projeto_id', id).order('criado_em', {ascending:false}),
  ]);
  _dados = {
    etapas: etapas.data || [],
    funil: funil.data || [],
    interessados: interessados.data || [],
    investimento: investimento.data || [],
    ondas: ondas?.data || [],
    pausas: pausas?.data || [],
    aditivos: aditivos?.data || [],

function desenharProjeto(){
  const p = _projeto;

    ['investimento', 'Investimento'],

function desenharAba(){
  const el = document.getElementById('aba-body');
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.textContent === {painel:'Painel',andamento:'Andamento',interessados:'Interessados',investimento:'Investimento',contrato:'Contrato'}[_abaAtiva]));

  else if (_abaAtiva === 'andamento')   el.innerHTML = abaAndamento();
  else if (_abaAtiva === 'interessados'){ el.innerHTML = abaInteressados(); vincularInteressados(); }

function abaPainel(){
  const p = _projeto;

  const diasOnda = Number(p.dias_onda)||1;
  const statusTxt = p.status === 'ativo' ? 'Mandato ativo' : (p.status === 'setup' ? 'Fase de setup' : 'Mandato ' + p.status);

  // KPIs a partir do funil
  const funilMap = Object.fromEntries((_dados.funil||[]).map(f => [f.rotulo, f.total]));

  const comInteresse = funilMap['Com interesse'] || 0;
  const negociando = funilMap['Em negociação'] || 0;
  const propostas = funilMap['Proposta recebida'] || 0;

  // Aguardando você = etapas responsavel='Você' e status != 'concluida'
  const aguardando = (_dados.etapas||[]).filter(e => e.responsavel === 'Você' && e.status !== 'concluida');

  // Funil sempre com os 5 rótulos (mesmo zerados)
  const RÓTULOS = ['Empresas alcançadas','Sem interesse','Com interesse','Em negociação','Proposta recebida'];
  const totalMax = Math.max(1, ...Object.values(funilMap));
  const funilHtml = RÓTULOS.map(r => {

    return `<div class="funil-linha">
      <div class="funil-nome">${esc(r)}</div>
      <div class="funil-barra"><span style="width:${v>0?pct:0}%"></span></div>

  return `

      <div class="kpi ${comInteresse>0?'destaque':''}"><div class="k">com interesse</div><div class="v">${comInteresse}</div></div>
      <div class="kpi ${negociando>0?'destaque':''}"><div class="k">em negociação</div><div class="v">${negociando}</div></div>
      <div class="kpi ${propostas>0?'destaque':''}"><div class="k">propostas</div><div class="v">${propostas}</div></div>
    </div>

    <div class="aguar">
      <div class="titulo">${aguardando.length?'Aguardando você · '+aguardando.length:'Aguardando você'}</div>
      ${aguarHtml}
    </div>

    <div class="card">
      <div class="lbl" style="margin-bottom:12px">funil</div>
      ${funilHtml}
      ${alcancadas+comInteresse+negociando+propostas === 0
        ? `<div class="aviso" style="margin-top:14px"><strong>Você chegou no dia 1.</strong> O funil está desenhado; os números aparecem conforme começamos a mapear e abordar potenciais compradores. Nossa primeira onda leva cerca de 15 dias pra atingir volume.</div>`

function vincularInteressados(){
  document.querySelectorAll('.int-item').forEach(el => {
    el.addEventListener('click', (ev) => {
      if (ev.target.closest('button, textarea, input')) return;
      el.classList.toggle('aberto');
    });
    const btn = el.querySelector('button');
    if (btn) btn.addEventListener('click', async () => {
      const ta = el.querySelector('textarea');
      const txt = (ta.value||'').trim();
      if (!txt) { toast('Escreva algo antes de enviar', 'err'); return; }
      btn.disabled = true; btn.textContent = 'enviando…';
      const { error } = await sb.rpc('va_cli_gravar_nota', {
        p_projeto: _projeto.projeto_id, p_referencia: el.dataset.ref, p_texto: txt
      });
      btn.disabled = false; btn.textContent = 'enviar';
      if (error) { toast('Falha: ' + error.message, 'err'); return; }
      ta.value = '';
      el.classList.remove('aberto');
      toast('Observação enviada pra nossa equipe', 'ok');
    });
  });
}

      <div class="lbl" style="margin-bottom:6px">contrato</div>
      <div class="kpi-grid" style="margin-top:6px">
        <div class="kpi"><div class="k">valor mensal</div><div class="v">${brl(p.contrato_total/Math.max(p.fidelidade_meses,1))}</div></div>
        <div class="kpi"><div class="k">fidelidade</div><div class="v">${p.fidelidade_meses}<span style="font-family:var(--sans);font-size:14px;color:var(--ink-3);font-weight:500"> meses</span></div></div>
        <div class="kpi"><div class="k">total pago</div><div class="v">${brl(p.total_pago)}</div></div>
        <div class="kpi"><div class="k">total contrato</div><div class="v">${brl(p.contrato_total)}</div></div>
      </div>
    </div>

    <div class="card">
      <div class="lbl" style="margin-bottom:12px">parcelas</div>
      ${linhasParc || '<div class="muted" style="padding:12px;font-style:italic;font-size:13px">sem parcelas geradas</div>'}
    </div>

    ${cardOndas}
    ${cardPausas}
    ${cardAditivos}

    <div class="card">
      <div class="lbl" style="margin-bottom:8px">nível de sigilo</div>
      <div class="h3">${esc(sigiloLbl)}</div>
      <p class="muted" style="margin-top:6px;font-size:13.5px;line-height:1.55">${esc(sigiloDesc)}</p>
    </div>`;
}

(async function boot(){
  await initAuth();
  router();
})();
</script>
