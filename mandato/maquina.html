<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MANDATO · Máquina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/mandato/core/tokens.css">
<link rel="stylesheet" href="/mandato/core/base.css">
<link rel="stylesheet" href="/mandato/captacao.css">
<link rel="stylesheet" href="/mandato/funil.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
<main class="wrap"><section class="page">
  <header class="page__head">
    <div class="page__zone">Zona · Máquina</div>
    <h1 class="page__title">Os motores que trazem comprador</h1>
    <p class="page__sub">Captação faz o dinheiro virar contato. Funil move contato até conversa. Cadência é regra de fundo, não tela.</p>
  </header>

  <nav class="tabs" id="mq-tabs" role="tablist" aria-label="Motores da Máquina">
    <button data-tab="captacao" role="tab" aria-current="true">Captação</button>
    <button data-tab="funil" role="tab" aria-current="false">Funil</button>
  </nav>

  <div id="mq-panel-captacao">
    <!-- populado por /mandato/captacao.js via mountCaptacao(mandato) -->
    <div class="antes-vazia"><p>Carregando captação…</p></div>
  </div>

  <div id="mq-panel-funil" hidden>
    <!-- populado por /mandato/funil.js via mountFunil(mandato) -->
    <div class="antes-vazia"><p>Carregando funil…</p></div>
  </div>
</section></main>

<script type="module">
  import { requireAdmin, getMandatoAtivo, watchAuth } from '/mandato/core/core.js';
  import { mountTopbar, renderSelector } from '/mandato/core/ui.js';
  import { mountCaptacao } from '/mandato/captacao.js';
  import { mountFunil } from '/mandato/funil.js';
  await requireAdmin();
  watchAuth(() => location.reload());
  const mandato = await getMandatoAtivo();
  mountTopbar('maquina', mandato);
  if (!mandato) { await renderSelector('maquina'); }
  else {
    // troca de aba client-side · preserva URL, guarda no hash
    const painelCap = document.getElementById('mq-panel-captacao');
    const painelFun = document.getElementById('mq-panel-funil');
    const btns = document.querySelectorAll('#mq-tabs button');
    let captacaoMontada = false;
    let funilMontado = false;
    function setAba(nome) {
      const ok = nome === 'funil' ? 'funil' : 'captacao';
      painelCap.hidden = ok !== 'captacao';
      painelFun.hidden = ok !== 'funil';
      btns.forEach(b => b.setAttribute('aria-current', b.dataset.tab === ok ? 'true' : 'false'));
      const url = new URL(location.href);
      if (ok === 'funil') url.hash = '#funil'; else url.hash = '';
      history.replaceState(null, '', url);
      if (ok === 'captacao' && !captacaoMontada) {
        captacaoMontada = true;
        mountCaptacao(mandato).catch(err => console.error('captacao', err));
      }
      if (ok === 'funil' && !funilMontado) {
        funilMontado = true;
        mountFunil(mandato).catch(err => console.error('funil', err));
      }
    }
    btns.forEach(b => b.addEventListener('click', () => setAba(b.dataset.tab)));
    setAba(location.hash === '#funil' ? 'funil' : 'captacao');
    // Padrão · módulo sinaliza prontidão. Testes E2E aguardam este atributo
    // antes de interagir · evita corridas com HTML estático.
    document.getElementById('mq-tabs').setAttribute('data-ready', 'true');
  }
</script>
</body>
</html>
