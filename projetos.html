  // recarrega sempre (dados dinâmicos)
  const [pb, fd] = await Promise.all([
    sb.from('va_prospeccao_bruta').select('*').eq('projeto_id', _pj.projeto.id).order('criado_em', {ascending:false}).limit(500),
    sb.from('va_projeto_fonte_desempenho').select('*').eq('projeto_id', _pj.projeto.id),
  ]);
  _pj.prospBruta = pb.data || [];
  _pj.fonteDesemp = fd.data || [];
  stage.innerHTML = desenhaTriagem();
  vincularTriagem();
}

function desenhaTriagem(){
  const list = _pj.prospBruta || [];
  const f = _pj.triFiltros;

  const cont = {};
  for (const b of list) cont[b.status] = (cont[b.status]||0)+1;
  const custoEnriq = (_pj.razao||[])
    .filter(r => ['similares_import','lead_scrapper','lead_maps'].includes(r.tipo))
    .reduce((s,r) => s + Number(r.valor_total||0), 0);

  const filtered = list.filter(b => {
    if (f.status !== 'todos' && b.status !== f.status) return false;
    if (f.fonte !== 'todas' && b.fonte !== f.fonte) return false;
    if (f.arq !== 'todos' && b.arquetipo_codigo !== f.arq) return false;
    if (f.score && (b.score||0) < f.score) return false;
    if (f.busca) {
      const s = (f.busca||'').toLowerCase();
      const hay = ((b.razao_social||'')+' '+(b.nome||'')+' '+(b.cidade||'')+' '+(b.cnpj||'')+' '+(b.telefone||'')).toLowerCase();
      if (!hay.includes(s)) return false;
    }
    return true;
  });

  const kpi = (l, v, cor) => `<div class="orc-kpi"${cor?` style="color:${cor}"`:''}><div class="k">${l}</div><div class="v">${v}</div></div>`;
  const kpis = `
    <div class="orc-resumo">
      ${kpi('bruto', cont.bruto||0)}
      ${kpi('qualificado', cont.qualificado||0, 'green')}
      ${kpi('descartado', cont.descartado||0, '#c60')}
      ${kpi('duplicado', cont.duplicado||0, '#c60')}
      ${kpi('bloqueado', cont.bloqueado||0, '#c00')}
      ${kpi('aprovado', cont.aprovado||0, 'green')}
      ${kpi('custo enriq', 'R$ '+custoEnriq.toFixed(2))}
    </div>`;

  const arqs = [...new Set(list.map(b=>b.arquetipo_codigo).filter(Boolean))];
  const fontes = [...new Set(list.map(b=>b.fonte))];

  const sel = _pj.triSelecionados;
  const rows = filtered.map(b => {
    const on = sel.has(b.id);
    const whats = (b.payload_bruto?.whatsapp === true || b.payload_bruto?.whatsapp === 'true') ? ' 📱' : '';
    const motivos = Array.isArray(b.motivos_falha) ? b.motivos_falha.join(', ') : (b.motivo_descarte||'');
    const scoreCor = b.score >= 70 ? 'green' : b.score >= 50 ? '#c60' : '#c00';
    return `<tr class="tri-row" data-id="${b.id}">
      <td><input type="checkbox" ${on?'checked':''} onchange="triToggleSel('${b.id}',this.checked)"></td>
      <td>${esc(b.razao_social||b.nome||'—')}</td>
      <td>${esc(b.cidade||'')}${b.estado?'/'+esc(b.estado):''}</td>
      <td class="mono" style="font-size:12px">${esc(b.telefone||'')}${whats}</td>
      <td>${b.porte_faturamento ? 'R$ '+Number(b.porte_faturamento).toLocaleString('pt-BR') : '—'}</td>
      <td><span class="chip">${esc(b.fonte)}</span></td>
      <td style="color:${scoreCor};font-weight:600">${b.score ?? '—'}</td>
      <td><span class="pill">${esc(b.status)}</span></td>
      <td style="font-size:11px;color:var(--ink-3)">${esc(motivos)}</td>
    </tr>`;
  }).join('');

  const desemp = (_pj.fonteDesemp||[]);
  let melhor=null, pior=null;
  desemp.forEach(d => {
    if (d.custo_por_aprovado != null) {
      if (!melhor || Number(d.custo_por_aprovado) < Number(melhor.custo_por_aprovado)) melhor = d;
      if (!pior || Number(d.custo_por_aprovado) > Number(pior.custo_por_aprovado)) pior = d;
    }
  });
  const desempHtml = desemp.length ? `
    <table style="width:100%;font-size:13px;margin-top:8px">
      <thead><tr style="text-align:left;color:var(--ink-3)"><th>fonte</th><th>trazidos</th><th>qualif</th><th>aprov</th><th>taxa</th><th>custo total</th><th>custo/aprov</th></tr></thead>
      <tbody>${desemp.map(d=>{
        const cor = d===melhor?'green':(d===pior?'#c60':'inherit');
        return `<tr style="color:${cor}">
          <td><b>${esc(d.fonte)}</b></td><td>${d.trazidos}</td><td>${d.qualificados}</td>
          <td>${d.aprovados}</td><td>${d.taxa_aproveitamento_pct}%</td>
          <td>R$ ${Number(d.custo_total).toFixed(2)}</td>
          <td>${d.custo_por_aprovado!=null?'R$ '+Number(d.custo_por_aprovado).toFixed(2):'—'}</td>
        </tr>`;
      }).join('')}</tbody>
    </table>` : '<div class="muted">Sem dados de fonte ainda.</div>';

  const nSel = sel.size;
  return `
    <div class="stage-head">
      <div>
        <div class="meta">gestão</div>
        <h2>Triagem · antessala da prospecção</h2>
        <div class="muted" style="margin-top:6px;font-size:13.5px">Kipflow, Maps e canais manuais chegam aqui como lead BRUTO. Só o que passa na qualificação e é aprovado vira contato no kanban.</div>
      </div>
    </div>

    <div class="k-card">${kpis}</div>

    <div class="k-card">
      <div class="lbl">filtros</div>
      <div class="form-grid" style="margin-top:8px">
        <div class="fld"><span class="lbl">status</span><select id="tri-status">${['todos','bruto','qualificado','descartado','duplicado','bloqueado','aprovado'].map(s=>`<option value="${s}" ${f.status===s?'selected':''}>${s}</option>`).join('')}</select></div>
        <div class="fld"><span class="lbl">fonte</span><select id="tri-fonte"><option value="todas" ${f.fonte==='todas'?'selected':''}>todas</option>${fontes.map(x=>`<option value="${x}" ${f.fonte===x?'selected':''}>${x}</option>`).join('')}</select></div>
        <div class="fld"><span class="lbl">arquétipo</span><select id="tri-arq"><option value="todos" ${f.arq==='todos'?'selected':''}>todos</option>${arqs.map(x=>`<option value="${x}" ${f.arq===x?'selected':''}>${x}</option>`).join('')}</select></div>
        <div class="fld"><span class="lbl">score mín.</span><input id="tri-score" type="number" min="0" max="100" value="${f.score||0}"></div>
        <div class="fld form-full"><span class="lbl">busca</span><input id="tri-busca" placeholder="nome, cnpj, cidade, tel" value="${esc(f.busca||'')}"></div>
      </div>
    </div>

    ${nSel>0 ? `<div class="k-card" style="background:var(--accent-soft)">
      <div class="row" style="justify-content:space-between;align-items:center">
        <div><strong>${nSel}</strong> selecionado(s)</div>
        <div class="row" style="gap:6px">
          <button class="btn btn-ghost btn-sm" onclick="triQualificar()">re-qualificar</button>
          <button class="btn btn-ghost btn-sm" onclick="triAprovar()">aprovar → kanban</button>
          <button class="btn btn-ghost btn-sm" onclick="triDescartar()">descartar</button>
        </div>
      </div>
    </div>` : ''}

    <div class="k-card" style="overflow-x:auto">
      <div class="lbl" style="margin-bottom:8px">${filtered.length} de ${list.length}</div>
      <table style="width:100%;font-size:13px;border-collapse:collapse">
        <thead><tr style="text-align:left;color:var(--ink-3);border-bottom:1px solid var(--line)">
          <th></th><th>nome/razão</th><th>cidade</th><th>telefone</th><th>porte</th><th>fonte</th><th>score</th><th>status</th><th>motivos</th>
        </tr></thead>
        <tbody>${rows || '<tr><td colspan="9" class="muted" style="text-align:center;padding:20px">Sem registros com esse filtro.</td></tr>'}</tbody>
      </table>
    </div>

    <div class="k-card">
      <div class="lbl">desempenho por fonte</div>
      ${desempHtml}
    </div>`;
}
function vincularTriagem(){
  ['tri-status','tri-fonte','tri-arq','tri-score','tri-busca'].forEach(id => {
    const el = document.getElementById(id); if (!el) return;
    el.addEventListener('change', triAtualizarFiltros);
    if (id==='tri-busca') el.addEventListener('input', triAtualizarFiltros);
  });
}
function triAtualizarFiltros(){
  _pj.triFiltros = {
    status: document.getElementById('tri-status').value,
    fonte:  document.getElementById('tri-fonte').value,
    arq:    document.getElementById('tri-arq').value,
    score:  Number(document.getElementById('tri-score').value)||0,
    busca:  document.getElementById('tri-busca').value,
  };
  const stage = document.getElementById('stage');
  stage.innerHTML = desenhaTriagem();
  vincularTriagem();
}
function triToggleSel(id, on){
  if (on) _pj.triSelecionados.add(id); else _pj.triSelecionados.delete(id);
  const stage = document.getElementById('stage');
  stage.innerHTML = desenhaTriagem();
  vincularTriagem();
}
async function triQualificar(){
  const ids = [..._pj.triSelecionados];
  for (const id of ids) {
    await sb.rpc('va_qualificar_prospeccao', { p_id: id });
  }
  _pj.triSelecionados.clear();
  toast(`${ids.length} re-qualificados`,'ok');
  htmlTriagem();
}
async function triAprovar(){
  const ids = [..._pj.triSelecionados];
  const arq = prompt('Código do arquétipo (existente no catálogo, ex A1):') || null;
  if (!confirm(`Promover ${ids.length} pra kanban como ${arq||'(usa arquétipo do bruto)'}?`)) return;
  let ok=0, err=0;
  for (const id of ids) {
    const { error } = await sb.rpc('va_promover_prospeccao_para_contato', { p_id: id, p_arquetipo: arq });
    if (error) err++; else ok++;
  }
  toast(`${ok} promovidos${err?' · '+err+' erros':''}`, err?'err':'ok');
  _pj.triSelecionados.clear();
  htmlTriagem();
}
async function triDescartar(){
  const ids = [..._pj.triSelecionados];
  const motivo = prompt('Motivo do descarte:'); if (!motivo) return;
  await sb.from('va_prospeccao_bruta').update({ status:'descartado', motivo_descarte: motivo, triado_em: new Date().toISOString() }).in('id', ids);
  toast(`${ids.length} descartados`, 'ok');
  _pj.triSelecionados.clear();
  htmlTriagem();
}

// ═══ SLICE ondas · Banner + Contrato ═══════════════════════════
function bannerOndaEstado(){
  const g = _pj?.gateOnda;
  if (!g || g.operacional) return '';
  const cor = g.status === 'encerrada' ? '#c00' : '#c60';
  const bg  = g.status === 'encerrada' ? '#fee' : '#fff8e1';
  return `<div style="background:${bg};border:1px solid ${cor};border-radius:8px;padding:12px 16px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
    <div style="color:${cor};font-weight:600;font-size:14px">⚠ ${esc(g.mensagem||'Operação bloqueada')}</div>
    <button class="btn btn-primary btn-sm" onclick="trocarAba('gestao_contrato')">Ir para Contrato →</button>
  </div>`;
}

function htmlContrato(){
  const stage = document.getElementById('stage');
  const ondas = _pj.ondas || [];
  const pausas = _pj.pausas || [];
  const aditivos = _pj.aditivos || [];
  const parcelas = _pj.parcelas || [];
  const hoje = new Date().toISOString().slice(0,10);
  const ondaAtual = ondas.slice().reverse()[0]; // última
  const diasRestantes = ondaAtual ? Math.ceil((new Date(ondaAtual.data_fim) - new Date(hoje)) / 86400000) : 0;

  const timeline = ondas.map(o => {
    const pauseIn = pausas.filter(p => p.onda_id === o.id);
    const cor = o.status==='ativa'?'var(--accent)':o.status==='pausada'?'#c60':o.status==='aguardando_pagamento'?'#f0c040':o.status==='encerrada'?'#999':'var(--ink-3)';
    return `<div style="border-left:4px solid ${cor};padding:10px 12px;background:${o.numero===ondaAtual?.numero?'var(--surface-2)':'transparent'};margin-bottom:6px">
      <div class="row" style="justify-content:space-between">
        <strong>Onda ${o.numero} · ${esc(o.tipo)}</strong>
        <span class="pill" style="color:${cor}">${esc(o.status)}</span>
      </div>
      <div class="muted" style="font-size:12px;margin-top:3px">
        ${dataBR(o.data_inicio)} → ${dataBR(o.data_fim)} · ${o.meses}m · R$ ${Number(o.valor_mensal).toLocaleString('pt-BR')}/mês · comissão ${o.comissao_percent}%
        ${o.dias_pausados>0?` · <b>${o.dias_pausados}d pausado</b>`:''}
      </div>
      ${pauseIn.length?`<div style="margin-top:4px;font-size:11px;color:var(--ink-3)">${pauseIn.map(p=>`⏸ ${dataBR(p.pausado_em)}${p.retomado_em?'→'+dataBR(p.retomado_em):' (aberta)'} · ${esc(p.motivo)}`).join(' · ')}</div>`:''}
    </div>`;
  }).join('') || '<div class="bl-empty">Sem ondas registradas.</div>';

  const parcelasOnda = ondaAtual ? parcelas.filter(p => p.onda_id === ondaAtual.id) : [];
  const cardAtual = ondaAtual ? `
    <div class="k-card">
      <div class="lbl">02 · onda atual</div>
      <div class="orc-resumo" style="margin-top:10px">
        <div class="orc-kpi"><div class="k">valor mensal</div><div class="v">R$ ${Number(ondaAtual.valor_mensal).toLocaleString('pt-BR')}</div></div>
        <div class="orc-kpi"><div class="k">comissão</div><div class="v">${ondaAtual.comissao_percent}%</div></div>
        <div class="orc-kpi ${diasRestantes<=15?'destaque':''}"><div class="k">dias restantes</div><div class="v">${diasRestantes>0?diasRestantes:0}</div></div>
        <div class="orc-kpi"><div class="k">dias pausados</div><div class="v">${ondaAtual.dias_pausados||0}</div></div>
      </div>
      ${parcelasOnda.length?`
      <div style="margin-top:14px">
        <div class="lbl" style="margin-bottom:6px">parcelas</div>
        <table style="width:100%;font-size:13px">
          <thead><tr style="text-align:left;color:var(--ink-3)"><th>#</th><th>vencimento</th><th>valor</th><th>status</th><th></th></tr></thead>
          <tbody>${parcelasOnda.map(p => `
            <tr style="border-top:1px solid var(--line)">
              <td>${p.numero}</td><td>${dataBR(p.vencimento)}</td>
              <td>R$ ${Number(p.valor).toLocaleString('pt-BR')}</td>
              <td>${esc(p.status)}</td>
              <td>${p.status!=='pago'?`<button class="btn btn-ghost btn-sm" onclick="parcelaPagar('${p.id}')">marcar paga</button>`:''}</td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>`:''}
    </div>` : '';

  // Card 3 · ações condicionadas
  let acoes = '';
  if (ondaAtual) {
    const s = ondaAtual.status;
    const btns = [];
    if (s === 'aguardando_pagamento') {
      btns.push('<div class="aviso" style="background:#fff8e1">Marque a primeira parcela como paga acima para ativar. A onda se ativa automaticamente.</div>');
    } else if (s === 'pausada') {
      btns.push('<button class="btn btn-primary" onclick="ondaRetomar(\''+ondaAtual.id+'\')">↻ Retomar onda</button>');
    } else if (s === 'ativa') {
      btns.push('<button class="btn btn-ghost" onclick="ondaPausar(\''+ondaAtual.id+'\')">⏸ Pausar</button>');
      btns.push('<button class="btn btn-ghost" onclick="aditivoNovo(\''+ondaAtual.id+'\')">+ Aditivo</button>');
      if (diasRestantes <= 15) {
        btns.push('<button class="btn btn-primary" onclick="ondaRenovar(\''+ondaAtual.id+'\',\'renovacao\')">↻ Renovar</button>');
        btns.push('<button class="btn btn-primary" onclick="ondaRenovar(\''+ondaAtual.id+'\',\'repactuacao\')">↻ Repactuar</button>');
        btns.push('<button class="btn btn-ghost" onclick="ondaEncerrar(\''+ondaAtual.id+'\')">Encerrar</button>');
      }
    }
    acoes = `<div class="k-card">
      <div class="lbl">03 · ações</div>
      <div class="row" style="gap:8px;flex-wrap:wrap;margin-top:10px">${btns.join('')}</div>
    </div>`;
  }

  const cardAditivos = `<div class="k-card">
    <div class="lbl" style="display:flex;justify-content:space-between">
      <span>04 · aditivos</span>
      ${ondaAtual?.status==='ativa'?`<button class="btn btn-ghost btn-sm" onclick="aditivoNovo('${ondaAtual.id}')">+ aditivo</button>`:''}
    </div>
    ${aditivos.length?`
    <table style="width:100%;font-size:13px;margin-top:8px">
      <thead><tr style="text-align:left;color:var(--ink-3)"><th>valor</th><th>motivo</th><th>venc</th><th>status</th><th></th></tr></thead>
      <tbody>${aditivos.map(a => `
        <tr style="border-top:1px solid var(--line)">
          <td>R$ ${Number(a.valor).toLocaleString('pt-BR')}</td><td>${esc(a.motivo)}</td>
          <td>${a.vencimento?dataBR(a.vencimento):'—'}</td><td>${esc(a.status)}</td>
          <td>${a.status==='pendente'?`<button class="btn btn-ghost btn-sm" onclick="aditivoMarcarPago('${a.id}')">marcar pago</button>`:''}</td>
        </tr>`).join('')}</tbody>
    </table>`:'<div class="bl-empty" style="margin-top:8px">Sem aditivos.</div>'}
  </div>`;

  stage.innerHTML = `
    <div class="stage-head">
      <div>
        <div class="meta">gestão</div>
        <h2>Contrato · ondas do mandato</h2>
        <div class="muted" style="margin-top:6px;font-size:13.5px">Cada onda tem seu período, valor e status próprios. Renovação mínima mensal, pausa estende o prazo, aditivo credita sem mexer no prazo.</div>
      </div>
    </div>
    <div class="k-card">
      <div class="lbl">01 · linha do tempo</div>
      <div style="margin-top:10px">${timeline}</div>
    </div>
    ${cardAtual}
    ${acoes}
    ${cardAditivos}
    ${cardConfigNumeros()}
    ${cardRevisoes()}`;
}

// ═══ REVISÃO D+60 · card na aba Contrato ══════════════════════
function cardRevisoes(){
  const revs = _pj.revisoes || [];
  if (!revs.length) return `<div class="k-card">
    <div class="lbl">05 · revisões D+60</div>
    <div class="muted" style="margin-top:8px;font-size:13px">Nenhuma revisão gerada ainda. O cron cria automaticamente quando a onda atingir 60 dias, ou gere agora:</div>
    ${(_pj.ondas||[]).filter(o=>o.status==='ativa').map(o=>`
      <button class="btn btn-ghost btn-sm" style="margin-top:8px" onclick="revisaoGerar('${o.id}')">gerar revisão · onda ${o.numero}</button>`).join('')}
  </div>`;

  return `<div class="k-card">
    <div class="lbl">05 · revisões D+60</div>
    ${revs.map(r => cardUmaRevisao(r)).join('')}
    ${(_pj.ondas||[]).filter(o=>o.status==='ativa' && !revs.some(r=>r.onda_id===o.id)).map(o=>`
      <button class="btn btn-ghost btn-sm" style="margin-top:8px" onclick="revisaoGerar('${o.id}')">+ gerar revisão · onda ${o.numero}</button>`).join('')}
  </div>`;
}

function cardUmaRevisao(r){
  const p = r.payload || {};
  const ondaN = p.ondas?.numero;
  const acima = p.preco?.acima_faixa;
  const eixos = [
    { key:'preco', titulo:'preço', evid: `venda R$ ${Number(p.preco?.valor_venda||0).toLocaleString('pt-BR')} · faixa ${p.preco?.valor_avaliacao_min?'R$ '+Number(p.preco.valor_avaliacao_min).toLocaleString('pt-BR'):'?'} → ${p.preco?.valor_avaliacao_max?'R$ '+Number(p.preco.valor_avaliacao_max).toLocaleString('pt-BR'):'?'} · ${p.preco?.cartas_recebidas||0} cartas`, opts:['manter','ajustar','reavaliar'] },
    { key:'teaser', titulo:'teaser', evid: `${p.teaser?.versoes||0} versões · ${p.teaser?.aprovados||0} aprovada(s)`, opts:['manter','ajustar','refazer'] },
    { key:'arquetipos', titulo:'arquétipos', evid: `${p.arquetipos?.ativos||0} ativos · ${p.arquetipos?.com_query||0} com query calibrada`, opts:['manter','ajustar','refazer'] },
    { key:'campanhas', titulo:'campanhas', evid: `${p.campanhas?.ativas||0} ativa(s)`, opts:['manter','ajustar','encerrar'] },
    { key:'estrategia', titulo:'estratégia', evid: `${p.estrategia?.alcancados||0} alcançados · ${p.estrategia?.interessados||0} interessados · ${p.estrategia?.em_negociacao||0} em negociação · R$ ${Number(p.estrategia?.consumido||0).toLocaleString('pt-BR')} consumido`, opts:['manter','ajustar','repactuar'] },
  ];
  return `<div style="border:1px solid var(--line);border-radius:8px;padding:14px;margin-top:12px;background:${r.status==='realizada'?'#f7fdf7':'var(--surface)'}">
    <div class="row" style="justify-content:space-between;align-items:baseline">
      <strong>Onda ${ondaN||'?'} · revisão prevista ${dataBR(r.data_prevista)}</strong>
      <span class="pill">${esc(r.status)}</span>
    </div>
    ${acima?`<div class="aviso-red" style="margin-top:8px;background:#ffe8e0;border:1px solid #f08060;color:#800;padding:8px;border-radius:6px;font-size:12.5px">⚠ Preço acima da faixa da avaliação. Revise com atenção — cartas recebidas: ${p.preco?.cartas_recebidas||0}</div>`:''}
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:12px">
      ${eixos.map(e => {
        const val = r['decisao_'+e.key];

// ═══ DRE do CLIENTE ═══════════════════════════════════════════════
// "Para onde vai o que ele paga" · fecha em zero. Aparece em proposta
// e no portal do cliente. NUNCA expõe custo real nem margem.
function dreClienteHtml(s) {
  const brl = v => 'R$ '+Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
  const total = Number(s.total_contrato||0);
  const setupsAtivacoes = Number(s.avaliacao||0)+Number(s.setup_arquetipos||0)+Number(s.combo_criativos||0)+Number(s.setup_campanha||0)+Number(s.anuncio_total||0);
  const impPct = Number(s.percent_impulsionamento||0);
  const leadPct = Number(s.percent_lead||0);
  // Sobra calculada localmente pra garantir que a DRE fecha em zero
  const sobraLocal = total - Number(s.impostos||0) - Number(s.gestao||0) - setupsAtivacoes;
  const impVal = sobraLocal * (impPct/100);
  const leadVal = sobraLocal * (leadPct/100);
  const saldo = total - Number(s.impostos||0) - Number(s.gestao||0) - setupsAtivacoes - impVal - leadVal;

  const linha = (label, val, sub) => `<tr>
    <td style="font-family:var(--mono);font-size:11.5px;letter-spacing:.02em;color:var(--ink-2);padding:5px 0">${label}${sub?` <span style="color:var(--ink-3);font-size:10.5px">${sub}</span>`:''}</td>
    <td class="mono" style="text-align:right;padding:5px 0">${val<0 || String(val).startsWith('(')?val:brl(val)}</td>
  </tr>`;
  const paren = v => '('+brl(Math.abs(v))+')';
  const avalRow = s.avaliacao_ja_paga
    ? `<tr><td style="font-family:var(--mono);font-size:11.5px;color:var(--ink-3);padding:5px 0;text-decoration:line-through">Avaliação (já paga)</td><td class="mono" style="text-align:right;padding:5px 0;color:var(--ink-3)">—</td></tr>`
    : null;

  return `
    <table style="width:100%;margin-top:10px;border-collapse:collapse">
      <tr><td style="font-family:var(--mono);font-size:11.5px;letter-spacing:.02em;font-weight:600;color:var(--ink-1);padding:6px 0">Contrato da onda <span style="color:var(--ink-3);font-size:10.5px">${Number(s.entrada?.meses||0)}m × ${brl(s.entrada?.valor_mensal||0)}</span></td>
        <td class="mono" style="text-align:right;padding:6px 0;font-family:var(--syne,inherit);font-weight:700;font-size:16px">${brl(total)}</td></tr>
      <tr><td colspan="2" style="padding:2px 0"><div style="border-top:1px solid var(--line)"></div></td></tr>
      ${linha('Impostos e taxas', paren(s.impostos))}
      ${linha('Gestão e atendimento', paren(s.gestao))}
      ${avalRow ? avalRow : linha('Avaliação e setups', paren(setupsAtivacoes))}
      ${!avalRow ? '' : linha('Setups e ativações', paren(setupsAtivacoes - Number(s.avaliacao||0)))}
      ${linha('Mídia paga', paren(impVal), `${impPct}%`)}
      ${linha('Prospecção ativa', paren(leadVal), `${leadPct}%`)}
      <tr><td colspan="2" style="padding:2px 0"><div style="border-top:1px solid var(--line)"></div></td></tr>
      <tr>
        <td style="font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;font-weight:700;color:${Math.abs(saldo)<1?'#0a7d3d':'#c00'};text-transform:uppercase;padding:8px 0">Saldo</td>
        <td class="mono" style="text-align:right;padding:8px 0;font-family:var(--syne,inherit);font-weight:700;font-size:15px;color:${Math.abs(saldo)<1?'#0a7d3d':'#c00'}">${brl(saldo)}</td>
      </tr>
    </table>
    <div class="muted" style="font-size:11px;margin-top:8px;font-family:var(--mono);letter-spacing:.02em">Tudo o que ele paga é aplicado · a soma fecha em zero.</div>`;
}

// ═══ DRE de MARGEM · SÓ ADMIN ═══════════════════════════════════
// Estrutura: Receita bruta → (−) impostos → (−) custo mídia → (−) custo
// ferramentas → MARGEM. Tudo entra na conta · nada "fora".
// Nunca aparece em views de cliente.
function dreMargemHtml(s) {
  const brl = v => v==null?'—':'R$ '+Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
  const total = Number(s.total_contrato||0);
  const impostos = Number(s.impostos||0);
  const setupsAtiv = Number(s.avaliacao||0) + Number(s.setup_arquetipos||0) + Number(s.combo_criativos||0) + Number(s.setup_campanha||0) + Number(s.anuncio_total||0);
  const impPct = Number(s.percent_impulsionamento||0);
  const leadPct = Number(s.percent_lead||0);
  const sobraLocal = total - impostos - Number(s.gestao||0) - setupsAtiv;
  const impCobrado = sobraLocal * (impPct/100);
  const leadCobrado = sobraLocal * (leadPct/100);
  // Custo externo: mídia repasse × 1,5 (custo = cobrado ÷ 1,5). Lead × 3 (custo = cobrado ÷ 3).
  const custoMidia = impCobrado / 1.5;
  const custoFerramentas = leadCobrado / 3;
  const custoTotal = impostos + custoMidia + custoFerramentas;
  const margem = total - custoTotal;
  const margemPct = total > 0 ? (margem / total * 100) : 0;
  const pct = v => total > 0 ? (v/total*100).toFixed(1)+'%' : '—';

  const linha = (label, val, sinal='(−)', cor='var(--ink-2)') => `<tr>
    <td style="font-family:var(--mono);font-size:11.5px;letter-spacing:.02em;color:${cor};padding:5px 0">${sinal} ${label}</td>
    <td class="mono" style="text-align:right;padding:5px 0">(${brl(val)})</td>
    <td class="mono" style="text-align:right;padding:5px 0;font-size:10.5px;color:var(--ink-3)">${pct(val)}</td>
  </tr>`;

  return `
    <table style="width:100%;margin-top:10px;border-collapse:collapse">
      <tr>
        <td style="font-family:var(--mono);font-size:11.5px;letter-spacing:.02em;font-weight:600;color:var(--ink-1);padding:6px 0">Receita bruta</td>
        <td class="mono" style="text-align:right;padding:6px 0;font-family:var(--syne,inherit);font-weight:700;font-size:16px">${brl(total)}</td>
        <td class="mono" style="text-align:right;padding:6px 0;font-size:10.5px;color:var(--ink-3)">100%</td>
      </tr>
      <tr><td colspan="3" style="padding:2px 0"><div style="border-top:1px solid var(--line)"></div></td></tr>
      ${linha('Impostos', impostos)}
      ${linha('Custo de mídia', custoMidia)}
      ${linha('Custo de ferramentas (leads)', custoFerramentas)}
      <tr><td colspan="3" style="padding:2px 0"><div style="border-top:2px solid var(--ink-2)"></div></td></tr>
      <tr>
        <td style="font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:${margem>0?'#0a7d3d':'#c00'};padding:8px 0">Margem de contribuição</td>
        <td class="mono" style="text-align:right;padding:8px 0;font-family:var(--syne,inherit);font-weight:700;font-size:17px;color:${margem>0?'#0a7d3d':'#c00'}">${brl(margem)}</td>
        <td class="mono" style="text-align:right;padding:8px 0;font-size:11px;color:${margem>0?'#0a7d3d':'#c00'};font-weight:700">${margemPct.toFixed(1)}%</td>
      </tr>
    </table>
    <div class="muted" style="font-size:10.5px;margin-top:8px;font-family:var(--mono);letter-spacing:.02em">Tudo o que sai do caixa entra na conta. Gestão/avaliação/setups não têm custo externo · são serviço próprio.</div>`;
}

// ═══ Comissão projetada · fórmula com conta aberta ═══════════════
// comissão = (expectativa × %) − investido_cliente (total pago pelo cliente)

        <td class="mono" style="text-align:right;padding:6px 0">${brl(bruta)}</td>

      <tr><td colspan="2" style="padding:2px 0"><div style="border-top:2px solid var(--ink-2)"></div></td></tr>

        <td style="font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:${liq>0?'#0a7d3d':'#c00'};padding:8px 0">Comissão líquida</td>

      </tr>
    </table>`;
}

      </div>
    </div>`;
  document.body.insertAdjacentHTML('beforeend', html);
  // Carrega balanço + sugestão de alocação da onda que está fechando

  if (tipo !== 'encerrar') {
    // Simulador reativo aos inputs
    let t;
    const updSim = () => {

      const v = Number(document.getElementById('pr-valor').value)||0;
      const cont = document.getElementById('pr-sim'); if (!cont) return;
      if (!m || !v) { cont.innerHTML = '<div class="muted" style="font-size:12px">preencha valor e meses</div>'; return; }
      if (m < 3) { cont.innerHTML = '<div class="aviso" style="background:#fee;color:#800;padding:10px;border-radius:6px;font-size:12.5px">Prazo mínimo é 3 meses.</div>'; return; }
      t = setTimeout(() => renderSimulador('pr', v, m, _pj.projeto.id, 'pr-sim'), 300);
    };
    document.getElementById('pr-meses').addEventListener('input', updSim);
    document.getElementById('pr-valor').addEventListener('input', updSim);
    updSim();
  }
}
async function carregarBalancoPainel(ondaId){
  const contBal = document.getElementById('pr-balanco');
  const contAloc = document.getElementById('pr-alocacao');
  try {
    const { error: eGen } = await sb.rpc('va_gerar_balanco_onda', { p_onda_id: ondaId });
    if (eGen) throw eGen;
    const { data: bal } = await sb.from('va_onda_balanco').select('payload,alocacao_sugerida').eq('onda_id', ondaId).single();
    if (contBal) contBal.innerHTML = renderBalancoHtml(bal?.payload);
    window._prSug = bal?.alocacao_sugerida || null;
    if (contAloc) contAloc.innerHTML = renderAlocacaoSugeridaHtml(window._prSug, bal?.payload);
  } catch (e) {
    if (contBal) contBal.innerHTML = '<div class="muted" style="font-size:12px">sem dados suficientes pra balanço</div>';
    if (contAloc) contAloc.innerHTML = '';
  }
}
function renderBalancoHtml(p){

  const brl = v => v==null?'—':'R$ '+Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
  const cell = (titulo, obj) => `
    <div style="flex:1;min-width:180px;border:1px solid var(--line);border-radius:8px;padding:10px">
      <div style="font-weight:600;font-size:12px;margin-bottom:4px">${titulo}</div>
      <div style="font-size:12px;line-height:1.6">
        gasto <b>${brl(obj?.gasto)}</b><br>
        ${obj?.interessados||0} interessado(s)<br>
        custo/interessado <b>${brl(obj?.custo_por_interessado)}</b>
      </div>
    </div>`;
  const melhor = p.melhor_pilar && p.melhor_pilar !== 'indefinido'
    ? `<div style="margin-top:8px;font-size:12.5px;color:var(--accent-2)"><b>melhor rendimento neste ciclo:</b> ${p.melhor_pilar==='impulsionamento'?'impulsionamento (mídia paga)':'prospecção ativa'}</div>`
    : '<div style="margin-top:8px;font-size:12px" class="muted">Sem dados suficientes pra apontar o pilar melhor.</div>';
  return `
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      ${cell('mídia paga', p.impulsionamento)}
      ${cell('prospecção ativa', p.prospeccao)}
    </div>
    ${melhor}`;
}
function renderAlocacaoSugeridaHtml(sug, bal){
  if (!sug) return '';
  const imp = Number(sug.percent_impulsionamento||0);
  const lead = Number(sug.percent_lead||0);
  const ev = sug.evidencia || {};
  const brl = v => v==null?'—':'R$ '+Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
  const bar = `
    <div style="display:flex;height:28px;margin-top:6px;border-radius:6px;overflow:hidden">
      ${imp>0?`<div style="flex:${imp};background:linear-gradient(135deg,#3b6fd6,#2450a8);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10.5px;letter-spacing:.02em;font-weight:600">Mídia paga ${imp}%</div>`:''}
      ${lead>0?`<div style="flex:${lead};background:linear-gradient(135deg,#0a9d55,#087a43);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10.5px;letter-spacing:.02em;font-weight:600">Prospecção ativa ${lead}%</div>`:''}
    </div>`;
  const evLine = (ev.cpi_impulsionamento!=null||ev.cpi_lead!=null)
    ? `<div class="muted" style="font-size:11px;margin-top:6px">evidência: CPI mídia paga ${brl(ev.cpi_impulsionamento)} · CPI prospecção ${brl(ev.cpi_lead)}</div>`
    : '';
  return `
    <div class="k-card" style="margin:0;padding:12px;background:#f6faff;border-color:#c8dcf5">
      <div class="lbl">alocação sugerida para a próxima onda</div>
      ${bar}
      <div style="font-size:12.5px;margin-top:8px">${esc(sug.motivo||'')}</div>
      <div style="font-size:11px;margin-top:4px" class="muted">base: ${esc(sug.base||'—')}</div>
      ${evLine}
      <div class="row" style="gap:8px;margin-top:10px">
        <button class="btn btn-primary btn-sm" onclick="aplicarAlocacaoSugerida()">aplicar sugestão na nova onda</button>
        <button class="btn btn-ghost btn-sm" onclick="ajustarAlocacaoManual()">ajustar manual</button>
      </div>
      <div id="pr-aloc-manual" style="margin-top:10px;display:none">
        <div class="form-grid">
          <div class="fld"><span class="lbl">% mídia paga</span><input id="pr-al-imp" type="number" min="0" max="100" step="1" value="${imp}"></div>
          <div class="fld"><span class="lbl">% prospecção ativa</span><input id="pr-al-lead" type="number" min="0" max="100" step="1" value="${lead}"></div>
        </div>
        <div class="muted" style="font-size:11px;margin-top:4px">total deve somar 100</div>
      </div>
    </div>`;
}
function ajustarAlocacaoManual(){
  const el = document.getElementById('pr-aloc-manual'); if (el) el.style.display = el.style.display==='none'?'block':'none';
}
async function aplicarAlocacaoSugerida(){
  // Marca a sugestão como pronta pra ser aplicada no confirmarPainelRen; a aplicação real
  // (INSERT em va_projeto_alocacao com onda_id da NOVA onda) acontece após criar a nova onda.
  const manual = document.getElementById('pr-aloc-manual');
  const usaManual = manual && manual.style.display !== 'none';
  let imp, lead, origem;
  if (usaManual) {
    imp = Number(document.getElementById('pr-al-imp').value);
    lead = Number(document.getElementById('pr-al-lead').value);
    origem = 'manual';
    if (imp + lead !== 100) { toast('imp + lead deve somar 100','err'); return; }
  } else {
    imp = Number(window._prSug?.percent_impulsionamento||0);
    lead = Number(window._prSug?.percent_lead||0);
    origem = 'sugerida';
  }
  window._prAlocPendente = { percent_impulsionamento: imp, percent_lead: lead, origem, base_calculo: window._prSug };
  toast('sugestão marcada · será gravada ao criar a nova onda','ok');
}
function fecharPainelRen(){
  document.getElementById('painel-ren-backdrop')?.remove();
  document.getElementById('painel-ren')?.remove();
}
async function confirmarPainelRen(ondaId, tipo){
  if (tipo === 'encerrar') {
    const motivo = document.getElementById('pr-motivo').value.trim();
    if (!motivo) { toast('motivo obrigatório','err'); return; }
    const rec = document.getElementById('pr-rec').value.trim();
    const { error } = await sb.from('va_projeto_ondas').update({ status:'encerrada', encerrada_em: new Date().toISOString(), observacao: motivo + (rec?' · rec: '+rec:'') }).eq('id', ondaId);
    if (error) { toast(error.message,'err'); return; }
    toast('encerrada','ok');
  } else {
    const meses = Number(document.getElementById('pr-meses').value);
    const valor = Number(document.getElementById('pr-valor').value);
    const com = Number(document.getElementById('pr-com').value);
    if (!meses || meses < 3) { toast('mínimo 3 meses','err'); return; }
    if (tipo === 'repactuacao') {
      const just = document.getElementById('pr-just').value.trim();
      if (!just) { toast('justificativa obrigatória','err'); return; }
    }
    const { data: novaOndaId, error } = await sb.rpc('va_criar_onda_renovacao', {
      p_projeto_id: _pj.projeto.id, p_meses: meses, p_valor_mensal: valor, p_comissao_percent: com, p_tipo: tipo
    });
    if (error) { toast(error.message,'err'); return; }
    // Persiste alocação pendente (se marcada) na nova onda
    if (window._prAlocPendente && novaOndaId) {
      await sb.from('va_projeto_alocacao').insert({
        projeto_id: _pj.projeto.id, onda_id: novaOndaId,
        percent_impulsionamento: window._prAlocPendente.percent_impulsionamento,
        percent_lead: window._prAlocPendente.percent_lead,
        origem: window._prAlocPendente.origem,
        base_calculo: window._prAlocPendente.base_calculo || null,
        aplicada: false,
      });
      window._prAlocPendente = null;
    }
    toast('onda criada · aguardando pagamento','ok');
  }
  fecharPainelRen();
  await renderProjeto(_pj.projeto.id);
}

  });
  document.querySelectorAll('#stage input[data-arqid], #stage textarea[data-arqid]').forEach(el => {
    el.addEventListener('blur', () => salvarCampoArq(el.dataset.arqid, el.dataset.campo, el.value));
  });
  document.querySelectorAll('#stage [data-toggle-arq]').forEach(el => {
    el.addEventListener('click', () => {
      const c = el.dataset.toggleArq;
      if (_arqExpanded.has(c)) _arqExpanded.delete(c); else _arqExpanded.add(c);
      desenhaAba();
    });
  });
}

async function toggleArquetipo(codigo){
  const id = _pj.projeto.id;
  const existente = _pj.arquetipos.find(a => a.codigo === codigo);
  if (existente) {
    const { error } = await sb.from('va_projeto_arquetipos').delete().eq('id', existente.id);
    if (error) { toast('Falhou: ' + error.message, 'err'); return; }
    _pj.arquetipos = _pj.arquetipos.filter(a => a.id !== existente.id);
    toast('Removido', 'ok');
  } else {
    const { data, error } = await sb.from('va_projeto_arquetipos')
      .insert({ projeto_id: id, codigo, ativo: true })
      .select('*').single();
    if (error) { toast('Falhou: ' + error.message, 'err'); return; }
    _pj.arquetipos.push(data);
    toast('Adicionado', 'ok');
  }
  await checarAutoConclusao('arquetipos');
  desenhaAba();
}

async function salvarCampoArq(arqId, campo, raw){
  const a = _pj.arquetipos.find(x => x.id === arqId);
  if (!a) return;
  let val;
  if (campo === 'queries_busca') {
    val = (raw||'').split(',').map(s => s.trim()).filter(Boolean);
    if (val.length === 0) val = null;
  } else if (campo === 'prioridade' || campo === 'meta_contatos_onda') {
    val = raw === '' ? null : Number(raw);
    if (val != null && !isFinite(val)) { toast('Valor inválido', 'err'); return; }
  } else {
    val = (raw||'').trim() || null;
  }
  const atual = a[campo];
  const igual = Array.isArray(atual) && Array.isArray(val)
    ? atual.length === val.length && atual.every((x,i) => x === val[i])
    : atual === val || (atual == null && val == null);
  if (igual) return;
  const patch = {}; patch[campo] = val;
  const { error } = await sb.from('va_projeto_arquetipos').update(patch).eq('id', arqId);
  if (error) { toast('Falhou: ' + error.message, 'err'); return; }
  a[campo] = val;
  toast('Salvo', 'ok');
  await checarAutoConclusao('arquetipos');
  if (campo === 'queries_busca') desenhaAba(); // atualiza aviso vermelho
}

// ─── ETAPA: ANEXOS ────────────────────────────────────────────────
const ANX_CATS = ['financeiro','juridico','operacional','fotos','videos','gerado'];
const VIS_LBL = { interno:'interno', cliente:'cliente', pos_nda:'pós-NDA', publico:'público' };
let _anxTipo = 'arquivo'; // 'arquivo' | 'link'

function visibDefault(){

function htmlAnexos(e){

      <div class="fld"><span class="lbl">nome</span><input type="text" id="anx-nome" placeholder="ex: Tour em vídeo"></div>

      <div class="fld"><span class="lbl">visibilidade</span><select id="anx-vis-l">${visSelOpts}</select></div>
      <button class="btn btn-primary btn-sm" id="anx-add-link">adicionar</button>

  const agrupado = {};
  ANX_CATS.forEach(c => agrupado[c] = anexos.filter(a => a.categoria === c));

  const listaCategorias = ANX_CATS.map(cat => {
    const lista = agrupado[cat];
    if (!lista.length) return '';
    const avisoVideo = cat === 'videos' ? `<div class="aviso" style="margin-bottom:10px">Vídeo consome o Storage rápido. Prefira hospedar fora (YouTube não listado ou Vimeo) e cadastrar como link.</div>` : '';

  return `
    <div class="stage-head">
      <div>
        <div class="meta">Etapa ${e.ordem}/15 · ${esc(e.responsavel||'—')}</div>
        <h2>${esc(e.titulo)}</h2>
        <div class="muted" style="margin-top:6px;font-size:13.5px">Prevista para <strong style="color:var(--ink-2)">${dataBR(e.data_prevista)}</strong>${e.data_real ? ' · concluída em '+dataBR(e.data_real) : ''}</div>
      </div>
      <button class="btn ${ok?'btn-ghost':'btn-primary'}" onclick="toggleEtapa('${e.id}',${ok?'true':'false'})">

function itemAnx(a){
  const tam = a.tipo === 'arquivo' ? fmtTam(a.tamanho_bytes) : '—';
  const link = a.tipo === 'link'
    ? `<a href="${esc(a.url_externa)}" target="_blank" rel="noopener" title="abrir">↗</a>`
    : '';
  const badgeLink = a.tipo === 'link' ? '<span class="badge-link">link</span>' : '';
  const optionsVis = Object.entries(VIS_LBL).map(([v,l]) => `<option value="${v}" ${a.visibilidade===v?'selected':''}>${l}</option>`).join('');
  const aprovAlerta = a.visibilidade === 'publico' && !a.aprovado_admin
    ? '<span class="aprov-alert">aguardando sua aprovação</span>'
    : '';
  const aprovToggle = a.visibilidade === 'publico'
    ? `<label class="aprov-toggle"><input type="checkbox" ${a.aprovado_admin?'checked':''} data-anx-aprov="${esc(a.id)}"> aprovado</label>`
    : '';
  return `
    <div class="anx-item">
      <div class="anx-nome" title="${esc(a.nome)}">${esc(a.nome)}${badgeLink} ${link}</div>
      <div class="anx-tam">${tam}</div>
      <div>
        <select class="anx-vis" data-anx-vis="${esc(a.id)}">${optionsVis}</select>
        ${aprovAlerta} ${aprovToggle}
      </div>
      <button class="btn btn-ghost btn-sm" onclick="removerAnexo('${a.id}')">remover</button>
    </div>`;
}

function fmtTam(bytes){
  if (!bytes) return '—';
  const kb = bytes/1024;
  if (kb < 1024) return kb.toFixed(0)+' KB';
  return (kb/1024).toFixed(1).replace('.',',')+' MB';
}

function vincularAnexos(){
  document.querySelectorAll('#stage .anx-tab button').forEach(el => {
    el.addEventListener('click', () => { _anxTipo = el.dataset.tipo; desenhaAba(); });
  });
  const bf = document.getElementById('anx-add-file');
  if (bf) bf.addEventListener('click', enviarAnexoArquivo);
  const bl = document.getElementById('anx-add-link');
  if (bl) bl.addEventListener('click', adicionarAnexoLink);

  document.querySelectorAll('#stage [data-anx-vis]').forEach(el => {
    el.addEventListener('change', () => atualizarAnexo(el.dataset.anxVis, { visibilidade: el.value, aprovado_admin: false }));
  });
  document.querySelectorAll('#stage [data-anx-aprov]').forEach(el => {
    el.addEventListener('change', () => atualizarAnexo(el.dataset.anxAprov, { aprovado_admin: el.checked }));
  });
}

async function enviarAnexoArquivo(){
  const fileInput = document.getElementById('anx-file');
  const cat = document.getElementById('anx-cat').value;
  const vis = document.getElementById('anx-vis').value;
  if (!fileInput.files.length) { toast('Escolha um arquivo', 'err'); return; }
  const f = fileInput.files[0];
  const id = _pj.projeto.id;
  const uid = (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36));
  const safeName = f.name.replace(/[^\w.-]+/g,'_');
  const path = `${id}/${uid}-${safeName}`;

  const btn = document.getElementById('anx-add-file');
  btn.disabled = true; btn.textContent = 'enviando…';

  const { error: upErr } = await sb.storage.from('projeto-anexos').upload(path, f, { upsert: false });
  if (upErr) { toast('Upload falhou: ' + upErr.message, 'err'); btn.disabled = false; btn.textContent = 'enviar'; return; }

  const { data, error } = await sb.from('va_projeto_anexos').insert({
    projeto_id: id, categoria: cat, nome: f.name, tipo: 'arquivo',
    storage_path: path, visibilidade: vis, tamanho_bytes: f.size,
  }).select('*').single();
  btn.disabled = false; btn.textContent = 'enviar';
  if (error) { toast('Registro falhou: ' + error.message, 'err'); return; }
  _pj.anexos.unshift(data);
  toast('Anexo enviado', 'ok');
  desenhaAba();
}

async function adicionarAnexoLink(){
  const url = document.getElementById('anx-url').value.trim();
  const nome = document.getElementById('anx-nome').value.trim();
  const cat = document.getElementById('anx-cat-l').value;
  const vis = document.getElementById('anx-vis-l').value;
  if (!url || !nome) { toast('URL e nome obrigatórios', 'err'); return; }
  const id = _pj.projeto.id;
  const { data, error } = await sb.from('va_projeto_anexos').insert({
    projeto_id: id, categoria: cat, nome, tipo: 'link',
    url_externa: url, visibilidade: vis,
  }).select('*').single();
  if (error) { toast('Falhou: ' + error.message, 'err'); return; }
  _pj.anexos.unshift(data);
  toast('Link adicionado', 'ok');
  desenhaAba();
}

async function atualizarAnexo(id, patch){
  const { error } = await sb.from('va_projeto_anexos').update(patch).eq('id', id);
  if (error) { toast('Falhou: ' + error.message, 'err'); return; }
  const a = _pj.anexos.find(x => x.id === id);
  if (a) Object.assign(a, patch);
  toast('Salvo', 'ok');
  desenhaAba();
}

async function removerAnexo(id){
  if (!confirm('Remover este anexo?')) return;
  const a = _pj.anexos.find(x => x.id === id);
  if (a && a.tipo === 'arquivo' && a.storage_path) {
    const { error: sErr } = await sb.storage.from('projeto-anexos').remove([a.storage_path]);
    if (sErr) { toast('Storage: ' + sErr.message, 'err'); /* segue mesmo assim */ }
  }
  const { error } = await sb.from('va_projeto_anexos').delete().eq('id', id);
  if (error) { toast('Falhou: ' + error.message, 'err'); return; }
  _pj.anexos = _pj.anexos.filter(x => x.id !== id);
  toast('Removido', 'ok');
  desenhaAba();
}

  const teasers = _pj.teasers || [];

  if (teasers[0]) { _pj.teaserSel = teasers[0].id; return teasers[0]; }

async function portalPublicar(){

  const sess = (await sb.auth.getSession()).data.session;
  const r = await fetch('/api/publicar-portal', {

  if (error) { toast(error.message,'err'); return; }

function vincularTeaser(){
  document.querySelectorAll('#stage [data-ts-sel]').forEach(el => {
    el.addEventListener('click', () => { _pj.teaserSel = el.dataset.tsSel; desenhaAba(); });
  });
  const bn = document.getElementById('ts-nova');
  if (bn) bn.addEventListener('click', novaVersaoTeaser);
  const bs = document.getElementById('ts-salvar');
  if (bs) bs.addEventListener('click', salvarTeaserTexto);
  const bag = document.getElementById('ts-aguardando');
  if (bag) bag.addEventListener('click', () => mudarStatusTeaser('aguardando_aprovacao'));
  const bap = document.getElementById('ts-aprovar');
  if (bap) bap.addEventListener('click', () => mudarStatusTeaser('aprovado'));
  const brc = document.getElementById('ts-recusar');
  if (brc) brc.addEventListener('click', () => mudarStatusTeaser('recusado'));
}

async function novaVersaoTeaser(){
  const id = _pj.projeto.id;
  const teasers = _pj.teasers || [];
  const proximaVersao = teasers.length ? Math.max(...teasers.map(v => v.versao)) + 1 : 1;
  const { data, error } = await sb.from('va_projeto_teaser')
    .insert({ projeto_id: id, versao: proximaVersao, texto: '', status: 'rascunho' })
    .select('*').single();
  if (error) { toast('Falhou: ' + error.message, 'err'); return; }
  _pj.teasers.unshift(data);
  _pj.teaserSel = data.id;
  toast('Versão ' + proximaVersao + ' criada', 'ok');
  desenhaAba();
}

async function salvarTeaserTexto(){
  const sel = _pj.teasers.find(v => v.id === _pj.teaserSel);
  if (!sel) return;
  const el = document.getElementById('ts-texto');
  if (!el) return;
  const novo = el.value;
  if (novo === (sel.texto||'')) { toast('Sem alterações', 'ok'); return; }
  const { error } = await sb.from('va_projeto_teaser').update({ texto: novo }).eq('id', sel.id);
  if (error) { toast('Falhou: ' + error.message, 'err'); return; }
  sel.texto = novo;
  toast('Salvo', 'ok');
}

async function mudarStatusTeaser(novo){
  const sel = _pj.teasers.find(v => v.id === _pj.teaserSel);
  if (!sel) return;
  // salva texto atual junto se mudou
  const el = document.getElementById('ts-texto');
  const textoAtual = el ? el.value : sel.texto;
  const patch = { status: novo, texto: textoAtual };
  if (novo === 'aprovado') patch.aprovado_em = new Date().toISOString();
  const { error } = await sb.from('va_projeto_teaser').update(patch).eq('id', sel.id);
  if (error) { toast('Falhou: ' + error.message, 'err'); return; }
  Object.assign(sel, patch);
  toast('Status: ' + (TS_STATUS_LBL[novo]||novo), 'ok');
  await checarAutoConclusao('teaser');
  desenhaAba();
}

const PARC_STATUS_LBL = { pendente:'pendente', pago:'pago', atrasado:'atrasado', cancelado:'cancelado' };
const NATUREZAS = [{v:'ativacao',l:'ativação'},{v:'recorrente',l:'recorrente (×fidelidade)'}];

function precoInfo(tipo){ return (_pj.precos || []).find(p => p.tipo === tipo); }

// ─── CARD 1 · RESUMO ─────────────────────────────────────────────
function cardResumo(f){

      </div>
    </div>`;

// ─── CARD 2 · RITMO ──────────────────────────────────────────────
function cardRitmo(f){
  const credito = Number(f.credito_liberado) || 0;
  const consumido = Number(f.consumido) || 0;
  const esperado = Number(f.consumo_esperado) || 0;
  const desvio = Number(f.desvio_ritmo) || 0; // positivo = atrasado
  const atrasoPct = credito > 0 ? (desvio / credito) * 100 : 0;
  let cls = 'ok', label = 'no ritmo';
  if (atrasoPct > 30)      { cls = 'at2'; label = 'consumo muito atrasado'; }
  else if (atrasoPct > 15) { cls = 'at';  label = 'consumo atrasado'; }
  const consPct = credito > 0 ? Math.min((consumido/credito)*100, 100) : 0;
  const espPct  = credito > 0 ? Math.min((esperado /credito)*100, 100) : 0;
  return `
    <div class="k-card">
      <div class="lbl">02 · ritmo de consumo</div>
      <h3>Consumir o crédito é obrigação nossa</h3>
      <p class="motivo">Saldo acumulado não é folga — é entrega devendo. Alerta é por sub-consumo.</p>
      <div class="ritmo-bar">
        <div class="ritmo-cons ${cls==='ok'?'':cls}" style="width:${consPct.toFixed(1)}%"></div>
        <div class="ritmo-marker" style="left:${espPct.toFixed(1)}%" title="esperado ${brlNice(esperado)}"></div>
      </div>
      <div class="ritmo-labels">
        <span>consumido ${brlNice(consumido)}</span>
        <span>esperado hoje ${brlNice(esperado)}</span>
        <span>crédito ${brlNice(credito)}</span>
      </div>
      <div class="row" style="justify-content:space-between;margin-top:12px;flex-wrap:wrap;gap:10px">
        <span class="ritmo-status ${cls}">${label} · desvio ${brlNice(Math.abs(desvio))}</span>
        <span class="mono" style="font-size:11.5px;color:var(--ink-3)">ritmo alvo · <strong style="color:var(--ink)">${brlNice(f.ritmo_alvo_diario)}/dia</strong> · ${f.dias_decorridos} de ${f.dias_onda} dias</span>
      </div>
    </div>`;
}

// ─── CARD 3 · PLANO ──────────────────────────────────────────────
function realizadoPorTipo(){
  const m = {};
  (_pj.razao || []).forEach(r => {
    if (!m[r.tipo]) m[r.tipo] = { qtd:0, valor:0 };
    m[r.tipo].qtd += Number(r.quantidade)||0;
    m[r.tipo].valor += Number(r.valor_total)||0;
  });
  return m;
}

function cardPlano(f){
  const plano = _pj.plano || [];
  const precos = (_pj.precos || []).filter(p => p.ativo);
  const p = _pj.projeto;
  const creditoOnda = (Number(p.valor_mensal)||0) * (Number(p.fidelidade_meses)||0) * 0.5;
  const previsto = Number(f.previsto_onda) || 0;
  const realiz = realizadoPorTipo();

  let aviso = '';
  if (creditoOnda > 0) {
    if (previsto > creditoOnda) aviso = '<div class="aviso">Plano excede o crédito da onda · orça mais do que temos pra executar.</div>';
    else if (previsto > 0 && previsto < creditoOnda * 0.9) aviso = '<div class="aviso">Onda com crédito sem destino definido · falta ~' + brlNice(creditoOnda - previsto) + '.</div>';
  }

  const linhasPlano = plano.length ? plano.map(pl => {
    const pi = precoInfo(pl.tipo) || {};
    const r = realiz[pl.tipo] || { qtd:0, valor:0 };
    const meta = Number(pl.meta_quantidade) || 0;
    const pct = meta > 0 ? Math.min((r.qtd/meta)*100, 200) : 0;
    const estourou = meta > 0 && r.qtd > meta;
    return `
      <tr class="${estourou?'tipo-estourado':''}">
        <td>${esc(pi.rotulo || pl.tipo)} <div class="muted mono" style="font-size:10px;margin-top:2px">${esc(pl.natureza)}</div></td>
        <td class="num">${Number(meta).toLocaleString('pt-BR')}</td>
        <td class="num">${brlNice(pl.preco_unitario_previsto)}</td>
        <td class="num">${brlNice(pl.valor_previsto)}</td>
        <td>
          <div class="orc-plano-prog">
            <span class="mono" style="font-size:10.5px;color:var(--ink-2);min-width:70px">${Number(r.qtd).toLocaleString('pt-BR')}${meta>0?' / '+Number(meta).toLocaleString('pt-BR'):''}</span>
            <div class="orc-plano-prog-bar"><span class="${estourou?'stopa':''}" style="width:${Math.min(pct,100).toFixed(0)}%"></span></div>
            <span class="orc-plano-prog-pct">${meta>0?pct.toFixed(0)+'%':'—'}</span>
          </div>
        </td>
        <td><button class="btn btn-ghost btn-sm" onclick="removerLinhaPlano('${pl.id}')">×</button></td>
      </tr>`;
  }).join('') : '<tr><td colspan="6" style="text-align:center;color:var(--ink-3);font-style:italic;padding:16px">Nenhuma linha no plano ainda. Adicione abaixo.</td></tr>';

  const opts = precos.map(pi => `<option value="${esc(pi.tipo)}" data-preco="${pi.preco}">${esc(pi.rotulo)}${Number(pi.preco)===0?' (a definir)':''}</option>`).join('');

  return `
    <div class="k-card">
      <div class="lbl">03 · plano da onda</div>
      <h3>Meta prevista de execução</h3>
      <p class="motivo">Preço é congelado ao adicionar. Recorrente multiplica por ${p.fidelidade_meses} meses.</p>

      <table class="orc-tab">
        <thead><tr>
          <th>tipo</th><th class="num">meta</th><th class="num">preço</th><th class="num">previsto</th><th>realizado</th><th></th>
        </tr></thead>
        <tbody>${linhasPlano}</tbody>
        <tfoot><tr>
          <td colspan="3">Total previsto na onda</td>
          <td class="num">${brlNice(previsto)}</td>
          <td colspan="2" class="num">crédito da onda ${brlNice(creditoOnda)}</td>
        </tr></tfoot>
      </table>

      ${aviso}

      <div class="orc-adicionar-linha">
        <div class="fld"><span class="lbl">tipo</span><select id="pl-tipo">${opts}</select></div>
        <div class="fld"><span class="lbl">natureza</span><select id="pl-natureza">${NATUREZAS.map(n=>`<option value="${n.v}">${esc(n.l)}</option>`).join('')}</select></div>
        <div class="fld"><span class="lbl">meta qtd</span><input type="number" min="0" step="1" id="pl-meta" value="0"></div>
        <div class="fld"><span class="lbl">observação</span><input type="text" id="pl-obs" placeholder="opcional"></div>
        <button class="btn btn-primary btn-sm" id="pl-add">+ linha</button>
      </div>
    </div>`;
}

// ─── CARD 4 · RAZÃO ──────────────────────────────────────────────
function cardRazao(f){
  const razao = _pj.razao || [];
  const ciclos = Array.from(new Set(razao.map(r => r.ciclo_numero).filter(x => x != null))).sort((a,b)=>a-b);
  const filtro = _pj.razaoFiltroCiclo;
  const filtrada = filtro == null ? razao : razao.filter(r => r.ciclo_numero === filtro);

  const cicloAtual = calcularCicloAtual();
  const jaTemGestao = razao.some(r => r.tipo === 'gestao_mensal' && r.ciclo_numero === cicloAtual);

  const chips = ['todos', ...ciclos].map(c => {
    const isTodos = c === 'todos';
    const on = (isTodos && filtro == null) || (!isTodos && filtro === c);
    return `<button class="ts-versao-chip ${on?'on':''}" onclick="filtrarRazao(${isTodos?'null':c})">${isTodos?'todos':'ciclo '+c}</button>`;
  }).join('');

  const rows = filtrada.length ? filtrada.map(r => {
    const pi = precoInfo(r.tipo) || {};
    return `<tr>
      <td class="mono" style="font-size:11.5px;color:var(--ink-3);white-space:nowrap">${dataBR(r.data)}</td>
      <td>${esc(pi.rotulo || r.tipo)}</td>
      <td>${esc(r.referencia || '—')}</td>
      <td class="num">${Number(r.quantidade).toLocaleString('pt-BR')}</td>
      <td class="num">${brlNice(r.preco_unitario_aplicado)}</td>
      <td class="num" style="font-weight:600">${brlNice(r.valor_total)}</td>
      <td class="num mono" style="color:var(--ink-3)">${r.ciclo_numero ?? '—'}</td>
    </tr>`;
  }).join('') : '<tr><td colspan="7" style="text-align:center;color:var(--ink-3);font-style:italic;padding:16px">Nenhum débito registrado neste filtro.</td></tr>';

  const totalFiltro = filtrada.reduce((s,r) => s + Number(r.valor_total||0), 0);

  return `
    <div class="k-card">
      <div class="lbl">04 · razão</div>
      <h3>Histórico de débitos</h3>
      <div class="row" style="justify-content:space-between;margin-top:10px;flex-wrap:wrap;gap:10px">
        <div class="ts-versoes" style="margin:0">${chips}</div>
        <div class="row" style="gap:8px">

// ─── ciclo atual ─────────────────────────────────────────────────
function calcularCicloAtual(){
  const dInicio = _pj.projeto.data_inicio;
  if (!dInicio) return 1;
  const meses = Math.max((new Date() - new Date(dInicio+'T00:00:00')) / (30*86400000), 0);
  return Math.floor(meses) + 1;
}

// ─── PLANO ───────────────────────────────────────────────────────
async function adicionarLinhaPlano(){
  const tipo = document.getElementById('pl-tipo').value;
  const natureza = document.getElementById('pl-natureza').value;
  const meta = Number(document.getElementById('pl-meta').value) || 0;
  const obs = document.getElementById('pl-obs').value.trim() || null;
  const pi = precoInfo(tipo);
  if (!pi) { toast('Tipo inválido', 'err'); return; }
  const fid = Number(_pj.projeto.fidelidade_meses) || 1;
  const precoUnit = Number(pi.preco) || 0;
  const valorPrev = natureza === 'recorrente' ? meta * precoUnit * fid : meta * precoUnit;
  const { error } = await sb.from('va_projeto_plano').insert({
    projeto_id: _pj.projeto.id, tipo, natureza,
    meta_quantidade: meta, preco_unitario_previsto: precoUnit, valor_previsto: valorPrev, observacao: obs,
  });
  if (error) { toast('Falhou: ' + error.message, 'err'); return; }
  toast('Linha adicionada · preço congelado', 'ok');
  await recarregarFinanceiro();
}

async function removerLinhaPlano(id){
  if (!confirm('Remover esta linha do plano?')) return;
  const { error } = await sb.from('va_projeto_plano').delete().eq('id', id);
  if (error) { toast('Falhou: ' + error.message, 'err'); return; }
  toast('Removida', 'ok');
  await recarregarFinanceiro();
}

function fecharModal(ev){
  if (ev && ev.target.id !== 'modal-back') return;
  const mb = document.getElementById('modal-back');
  mb.classList.remove('on');
  mb.innerHTML = '';
}

async function salvarDebito(){
  const tipo = document.getElementById('md-tipo').value;
  const qtd  = Number(document.getElementById('md-qtd').value);
  const ref  = document.getElementById('md-ref').value.trim() || null;
  if (!tipo || !isFinite(qtd) || qtd <= 0) { toast('Preencha tipo e quantidade', 'err'); return; }
  const { error } = await sb.rpc('va_debitar', {
    p_projeto: _pj.projeto.id, p_tipo: tipo, p_qtd: qtd, p_referencia: ref, p_ciclo: null,
  });
  if (error) { toast('Falhou: ' + error.message, 'err'); return; }
  toast('Débito lançado', 'ok');
  fecharModal();
  await recarregarFinanceiro();
}

async function lancarGestaoAtual(ciclo){

  if (error) { toast('Falhou: ' + error.message, 'err'); return; }
  toast('Gestão do ciclo ' + ciclo + ' lançada', 'ok');

async function pagarParcela(id){
  const { error } = await sb.from('va_projeto_parcelas').update({
    status: 'pago', pago_em: new Date().toISOString().slice(0,10),
  }).eq('id', id);
  if (error) { toast('Falhou: ' + error.message, 'err'); return; }
  toast('Parcela marcada como paga · crédito atualizado', 'ok');
  await recarregarFinanceiro();
}

async function voltarParcela(id){
  if (!confirm('Desmarcar pagamento? O crédito liberado será recalculado.')) return;
  const { error } = await sb.from('va_projeto_parcelas').update({
    status: 'pendente', pago_em: null,
  }).eq('id', id);
  if (error) { toast('Falhou: ' + error.message, 'err'); return; }
  toast('Parcela voltou pra pendente', 'ok');

}

async function atualizarParcelaCampo(id, patch){
  const { error } = await sb.from('va_projeto_parcelas').update(patch).eq('id', id);
  if (error) { toast('Falhou: ' + error.message, 'err'); return; }
  const pa = _pj.parcelas.find(x => x.id === id);
  if (pa) Object.assign(pa, patch);
  toast('Salvo', 'ok');
}

// ─── PREÇOS ──────────────────────────────────────────────────────
function togglePrecos(){ _pj.precosAberto = !_pj.precosAberto; desenhaAba(); }

async function atualizarPreco(tipo, campo, raw){
  const val = raw === '' ? 0 : Number(raw);
  if (!isFinite(val)) { toast('Valor inválido', 'err'); return; }
  const p = _pj.precos.find(x => x.tipo === tipo);
  if (!p || Number(p[campo]) === val) return;
  const patch = {}; patch[campo] = val;
  const { error } = await sb.from('va_precos').update(patch).eq('tipo', tipo);
  if (error) { toast('Falhou: ' + error.message, 'err'); return; }
  p[campo] = val;
  toast('Preço salvo · histórico intacto', 'ok');
  desenhaAba();
}

const ESTAGIOS = [
  { chave:'novo',              nome:'novo' },
  { chave:'abordado',          nome:'abordado' },
  { chave:'sem_resposta',      nome:'sem resposta' },
  { chave:'sem_interesse',     nome:'sem interesse' },
  { chave:'interesse_inicial', nome:'interesse inicial' },
  { chave:'apresentado',       nome:'apresentado' },
  { chave:'nda_assinado',      nome:'NDA assinado' },
  { chave:'em_negociacao',     nome:'em negociação' },
  { chave:'proposta',          nome:'proposta' },
  { chave:'fechado',           nome:'fechado' },
  { chave:'perdido',           nome:'perdido' },
];
const ESTAGIO_LBL = Object.fromEntries(ESTAGIOS.map(e => [e.chave, e.nome]));
const ORIGENS = ['prospeccao','manual','anuncio','parceiro','matchmaking','organico'];
const QUALIDADES = [
  { v:'lixo',   l:'lixo' },
  { v:'fraco',  l:'fraco' },
  { v:'bom',    l:'bom' },
  { v:'quente', l:'quente' },
];

// ─── KANBAN ──────────────────────────────────────────────────────
function contatosFiltrados(){
  const t = _pj.kanbanTrilha;
  const q = (_pj.kanbanBusca||'').trim().toLowerCase();
  return (_pj.contatos||[]).filter(c => {
    if (t !== 'todos' && c.trilha !== t) return false;
    if (!q) return true;
    const bag = ((c.nome||'') + ' ' + (c.empresa||'') + ' ' + (c.telefone||'') + ' ' + (c.telefone_normalizado||'')).toLowerCase();
    return bag.includes(q);
  });
}

function htmlKanban(){
  const contatos = contatosFiltrados();
  const totais = { total: contatos.length, negoc:0, prop:0 };
  contatos.forEach(c => {
    if (c.estagio === 'em_negociacao') totais.negoc++;
    if (c.estagio === 'proposta')       totais.prop++;
  });

  const trilha = _pj.kanbanTrilha;
  const tabs = ['todos','fria','quente'].map(t =>
    `<button class="${trilha===t?'on':''}" data-trilha="${t}">${t==='todos'?'todas':t}</button>`
  ).join('');

  // agrupar contatos por estágio uma vez
  const porEstagio = {};
  ESTAGIOS.forEach(e => { porEstagio[e.chave] = []; });
  contatos.forEach(c => { (porEstagio[c.estagio] = porEstagio[c.estagio] || []).push(c); });
  const totalContatos = contatos.length || 1;

  // init do estado de expansão
  if (!_pj.kanbanExpandido) {
    _pj.kanbanExpandido = new Set(ESTAGIO_ABRE_DEFAULT);
  }

  const secoes = ESTAGIOS.map(e => {
    const cs = porEstagio[e.chave] || [];
    const aberta = _pj.kanbanExpandido.has(e.chave);
    const vazia = cs.length === 0;
    const pct = Math.max(2, Math.round((cs.length / totalContatos) * 100));
    const linhas = cs.length
      ? cs.map(linhaHTML).join('')
      : '<div class="kb-secao-empty">nenhum contato neste estágio</div>';
    return `
      <div class="kb-secao ${aberta?'aberta':''} ${vazia?'vazia':''}" data-estagio="${e.chave}">
        <button class="kb-secao-head" onclick="toggleSecao('${e.chave}')" aria-expanded="${aberta}">
          <span class="kb-secao-titulo">
            <span class="kb-secao-nome">${esc(e.nome)}</span>
            <span class="kb-secao-count">${cs.length}</span>
          </span>
          <span class="kb-secao-barra"><span style="width:${vazia?0:pct}%"></span></span>
          <span class="kb-secao-chev">▾</span>
        </button>
        <div class="kb-secao-body">${linhas}</div>
      </div>`;
  }).join('');

  return `
    <div class="stage-head">
      <div>
        <div class="meta">gestão</div>
        <h2>Kanban de contatos</h2>
        <div class="muted" style="margin-top:6px;font-size:13.5px">Origem gravada uma vez na criação. Deduplicação por telefone normalizado. Blacklist bloqueia na entrada.</div>
      </div>
      <button class="btn btn-primary" onclick="abrirModalAddContato()">+ contato</button>
    </div>

    <div class="kb-header">
      <div class="kb-kpis">
        <div class="kb-kpi"><b>${totais.total}</b> contatos</div>
        <div class="kb-kpi"><b>${totais.negoc}</b> em negociação</div>
        <div class="kb-kpi"><b>${totais.prop}</b> propostas</div>
      </div>
      <div class="kb-tools">
        <div class="kb-trilha-tab" id="kb-trilha">${tabs}</div>
        <div class="kb-busca"><input type="text" id="kb-busca" placeholder="buscar nome, empresa, telefone" value="${esc(_pj.kanbanBusca||'')}"></div>
      </div>
    </div>

    <div class="kb-legenda">
      <span class="kb-legenda-item"><span class="kb-legenda-swatch kb-swatch-fria"></span>trilha fria (prospecção)</span>
      <span class="kb-legenda-item"><span class="kb-legenda-swatch kb-swatch-quente"></span>trilha quente (anúncio · orgânico)</span>
      <span class="kb-legenda-item" style="margin-left:auto;color:var(--ink-4)">clique no cabeçalho pra expandir · clique na linha pra ver detalhes</span>
    </div>

    <div class="kb-lista">${secoes}</div>`;
}

const ESTAGIO_ABRE_DEFAULT = ['novo','abordado','interesse_inicial','apresentado','nda_assinado','em_negociacao','proposta'];

function toggleSecao(chave){
  if (!_pj.kanbanExpandido) _pj.kanbanExpandido = new Set(ESTAGIO_ABRE_DEFAULT);
  if (_pj.kanbanExpandido.has(chave)) _pj.kanbanExpandido.delete(chave);
  else _pj.kanbanExpandido.add(chave);
  // toggle DOM direto (evita re-render + perda de foco)
  const el = document.querySelector('#stage .kb-secao[data-estagio="'+chave+'"]');
  if (el) el.classList.toggle('aberta');
}

function linhaHTML(c){
  const nome = c.nome || c.empresa || 'sem nome';
  const empresaExtra = c.empresa && c.nome ? c.empresa : '';
  const ultimo = ultimoFeedback(c.id);
  const hoje = new Date().toISOString().slice(0,10);
  const ppVencido = c.proximo_passo_em && c.proximo_passo_em < hoje;
  const ppHtml = c.proximo_passo || c.proximo_passo_em
    ? `<div class="kb-linha-pp ${ppVencido?'vencido':''}" title="próximo passo">
         ${c.proximo_passo ? `<span class="t">${esc(c.proximo_passo)}</span>` : ''}
         ${c.proximo_passo_em ? `<span class="d">${ppVencido?'⚠ ':''}${dataBR(c.proximo_passo_em)}</span>` : ''}
       </div>`
    : '<div class="kb-linha-pp"></div>';

  const opts = ESTAGIOS.filter(e => e.chave !== c.estagio)
    .map(e => `<option value="${esc(e.chave)}">→ ${esc(e.nome)}</option>`).join('');

  const tags = `
    <div class="kb-linha-tags">
      <span class="kb-tag origem">${esc(c.origem)}</span>
      ${c.arquetipo_codigo ? `<span class="kb-tag arq">${esc(c.arquetipo_codigo)}</span>` : ''}
      ${c.qualidade ? `<span class="kb-tag q-${esc(c.qualidade)}">${esc(c.qualidade)}</span>` : ''}
    </div>`;

  const feed = ultimo
    ? `<div class="kb-linha-feed" title="${esc(ultimo)}">"${esc(ultimo)}"</div>`
    : '<div class="kb-linha-feed"></div>';

  const cidade = `<div class="kb-linha-cidade">${esc(c.cidade || '—')}</div>`;

  return `
    <div class="kb-linha ${esc(c.trilha)}" data-contato="${esc(c.id)}" onclick="abrirDrawerContato('${esc(c.id)}')">
      <div class="kb-linha-trilha"></div>
      <div class="kb-linha-nome">
        <span class="n">${esc(nome)}</span>${empresaExtra?`<span class="e">${esc(empresaExtra)}</span>`:''}
      </div>
      <div class="kb-linha-meta" style="display:contents">
        ${cidade}
        ${tags}
        ${feed}
        ${ppHtml}
      </div>
      <div class="kb-linha-mover" onclick="event.stopPropagation()">
        <select onchange="onMoverSelect(event,'${esc(c.id)}','${esc(c.estagio)}')" title="mover pra outro estágio">
          <option value="">mover pra…</option>
          ${opts}
        </select>
      </div>
    </div>`;
}

// cache leve de últimos feedbacks (recarregado on-demand no drawer)
const _ultimosFeedback = new Map();
function ultimoFeedback(cid){ return _ultimosFeedback.get(cid) || null; }

function onMoverSelect(ev, contatoId, deEstagio){
  const sel = ev.target;
  const para = sel.value;
  if (!para) return;
  abrirModalMoverContato(contatoId, deEstagio, para);
  sel.value = ''; // reset visual — o modal decide o resultado
}

function vincularKanban(){
  // toggle trilha
  document.querySelectorAll('#kb-trilha button').forEach(el =>
    el.addEventListener('click', () => { _pj.kanbanTrilha = el.dataset.trilha; desenhaAba(); }));

  // busca com debounce, mantendo foco
  const busca = document.getElementById('kb-busca');
  if (busca) {
    let tid;
    busca.addEventListener('input', () => {
      clearTimeout(tid);
      tid = setTimeout(() => {
        _pj.kanbanBusca = busca.value;
        desenhaAba();
        const b = document.getElementById('kb-busca');
        if (b) { b.focus(); const v = b.value; b.value = ''; b.value = v; }
      }, 220);
    });
  }
}

async function salvarNovoContato(){
  const nome = document.getElementById('ac-nome').value.trim();
  const tel  = document.getElementById('ac-tel').value.trim();
  const emp  = document.getElementById('ac-emp').value.trim();
  const cid  = document.getElementById('ac-cid').value.trim();
  const orig = document.getElementById('ac-orig').value;
  const arq  = document.getElementById('ac-arq').value || null;
  const obs  = document.getElementById('ac-obs').value.trim();
  if (!tel) { toast('Telefone obrigatório', 'err'); return; }
  const { data, error } = await sb.rpc('va_registrar_contato', {
    p_projeto: _pj.projeto.id, p_nome: nome || null, p_telefone: tel,
    p_empresa: emp || null, p_cidade: cid || null,
    p_origem: orig, p_origem_detalhe: null, p_arquetipo: arq, p_debitar: false,
  });
  if (error) { toast('Falhou: ' + error.message, 'err'); return; }
  const resp = data || {};
  if (resp.status === 'bloqueado') {
    const mb = document.getElementById('modal-back');
    mb.innerHTML = `<div class="modal-card" onclick="event.stopPropagation()">
      <div class="lbl" style="color:var(--danger)">bloqueado</div>
      <h3>Contato na blacklist do projeto</h3>
      <p class="muted" style="margin-top:8px">Motivo: <strong style="color:var(--danger)">${esc(resp.motivo||'—')}</strong>${resp.nome?` · ${esc(resp.nome)}`:''}.</p>
      <div class="aviso-red" style="margin-top:10px">Bloqueio duro. Nenhuma abordagem foi registrada.</div>
      <div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn btn-ghost btn-sm" onclick="fecharModal()">entendi</button></div>
    </div>`;
    return;
  }
  if (resp.status === 'duplicado') {
    const dt = resp.criado_em ? new Date(resp.criado_em).toLocaleDateString('pt-BR') : '—';
    const mb = document.getElementById('modal-back');
    mb.innerHTML = `<div class="modal-card" onclick="event.stopPropagation()">
      <div class="lbl" style="color:var(--amber)">duplicado</div>
      <h3>Contato já no funil</h3>
      <p class="muted" style="margin-top:8px">Está aqui desde <strong>${esc(dt)}</strong>, no estágio <strong>${esc(ESTAGIO_LBL[resp.estagio]||resp.estagio||'—')}</strong>. Foi registrada uma interação de re-captura.</p>
      <div class="row" style="justify-content:flex-end;gap:8px;margin-top:16px">
        <button class="btn btn-ghost btn-sm" onclick="fecharModal()">fechar</button>
        <button class="btn btn-primary btn-sm" onclick="fecharModal();abrirDrawerContato('${esc(resp.contato_id)}')">abrir contato</button>
      </div>
    </div>`;
    await recarregarContatos();
    return;
  }
  if (resp.status === 'criado') {
    // grava observação se fornecida
    if (obs) {
      await sb.from('va_contato_interacoes').insert({
        contato_id: resp.contato_id, projeto_id: _pj.projeto.id,
        tipo: 'nota', conteudo: obs, autor: 'admin',
      });
    }
    toast('Contato adicionado', 'ok');
    fecharModal();
    await recarregarContatos();
    desenhaAba();
    return;
  }
  toast('Retorno inesperado', 'err');
}

async function abrirDrawerContato(id){
  _pj.drawerContatoId = id;
  const drawer = document.getElementById('drawer');

  drawer.innerHTML = '<div class="drawer-body"><div class="empty"><h2>Carregando…</h2></div></div>';
  drawer.classList.add('on');
  back.classList.add('on');

  const [c, inter] = await Promise.all([
    sb.from('va_contatos').select('*').eq('id', id).maybeSingle(),
    sb.from('va_contato_interacoes').select('*').eq('contato_id', id).order('criado_em', {ascending:false}),
  ]);
  if (c.error || !c.data) { drawer.innerHTML = '<div class="drawer-body"><div class="err-box">Contato não encontrado</div></div>'; return; }
  _pj.drawerInteracoes = inter.data || [];
  // atualiza cache de último feedback pro kanban
  const ultFb = (inter.data || []).find(i => (i.tipo==='mudanca_estagio' || i.tipo==='nota') && i.conteudo);
  if (ultFb) _ultimosFeedback.set(id, ultFb.conteudo.slice(0,120));

  drawer.innerHTML = drawerContent(c.data, _pj.drawerInteracoes);
  vincularDrawer(c.data);
}

const ESCAPE_TIPOS = {
  nota:'nota', mudanca_estagio:'mudança de estágio', re_capturado:'re-capturado',
  disparo:'disparo', resposta:'resposta', ligacao:'ligação', reuniao:'reunião',
  nda_enviado:'NDA enviado', nda_assinado:'NDA assinado',
  dossie_liberado:'dossiê liberado', proposta:'proposta',
};

function vincularDrawer(c){
  const patch = (campo, raw) => atualizarCampoContato(c.id, campo, raw);
  const ids = { 'dw-nome':'nome','dw-tel':'telefone','dw-emp':'empresa','dw-cid':'cidade','dw-mail':'email','dw-cnpj':'cnpj','dw-pp':'proximo_passo','dw-pp-dt':'proximo_passo_em' };
  Object.entries(ids).forEach(([id, campo]) => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('blur', () => patch(campo, el.value));
  });
}

async function atualizarCampoContato(id, campo, raw){
  const val = (raw||'').trim() || null;
  const patch = {}; patch[campo] = val;
  const { error } = await sb.from('va_contatos').update(patch).eq('id', id);
  if (error) { toast('Falhou: ' + error.message, 'err'); return; }
  const c = _pj.contatos.find(x => x.id === id);
  if (c) Object.assign(c, patch);
  toast('Salvo', 'ok');
}

async function salvarNota(id){
  const el = document.getElementById('dw-nota');
  const txt = (el.value||'').trim();
  if (!txt) return;
  const { error } = await sb.from('va_contato_interacoes').insert({
    contato_id: id, projeto_id: _pj.projeto.id,
    tipo: 'nota', conteudo: txt, autor: 'admin',
  });
  if (error) { toast('Falhou: ' + error.message, 'err'); return; }
  el.value = '';
  toast('Nota gravada', 'ok');
  await abrirDrawerContato(id); // re-render pra timeline
}

async function mudarEstagioDoDrawer(id, de){
  const sel = document.getElementById('dw-est');
  const para = sel.value;
  if (!para) { toast('Escolha um estágio', 'err'); return; }
  abrirModalMoverContato(id, de, para);
}

function fecharDrawer(ev){
  if (ev && ev.target.id !== 'drawer-back') return;
  document.getElementById('drawer').classList.remove('on');
  document.getElementById('drawer-back').classList.remove('on');
  _pj.drawerContatoId = null;
}

// ─── FUNIL ───────────────────────────────────────────────────────
let _funilTrilha = 'fria';

function htmlFunil(){
  const funil = _pj.funil || [];
  const trilhas = ['fria','quente'];
  const totaisPorEstagio = {};
  ESTAGIOS.forEach(e => { totaisPorEstagio[e.chave] = 0; });
  funil.filter(f => f.trilha === _funilTrilha).forEach(f => { totaisPorEstagio[f.estagio] = (totaisPorEstagio[f.estagio]||0) + f.total; });
  const maxV = Math.max(1, ...Object.values(totaisPorEstagio));

  const tabs = trilhas.map(t =>
    `<button class="${_funilTrilha===t?'on':''}" onclick="_funilTrilha='${t}';desenhaAba()">${t}</button>`
  ).join('');

  let linhas = '';
  let anterior = null;
  ESTAGIOS.forEach(e => {
    const v = totaisPorEstagio[e.chave] || 0;
    const pct = Math.max(2, Math.round((v/maxV)*100));
    const conv = (anterior != null && anterior > 0) ? Math.round((v/anterior)*100) + '%' : '—';
    linhas += `<div class="funil-linha">
      <div class="funil-nome">${esc(e.nome)}</div>
      <div class="funil-barra"><span style="width:${pct}%"></span></div>
      <div class="funil-total">${v}</div>
      <div class="funil-conv" title="conversão vs estágio anterior">${conv}</div>
    </div>`;
    anterior = v;
  });

  // desempenho arquétipo (recarregado sempre — leve)
  const arqRows = htmlFunilArquetipos();

  return `
    <div class="stage-head">
      <div>
        <div class="meta">gestão</div>
        <h2>Funil de conversão</h2>
        <div class="muted" style="margin-top:6px;font-size:13.5px">Contagem por estágio + taxa vs estágio anterior. Trilhas separadas — fria e quente convertem diferente.</div>
      </div>
      <div class="kb-trilha-tab">${tabs}</div>
    </div>

    <div class="k-card">
      <div class="lbl">01 · funil trilha <strong style="color:var(--accent-2)">${esc(_funilTrilha)}</strong></div>
      <div class="funil-linhas">${linhas}</div>
    </div>

    <div class="k-card">
      <div class="lbl">02 · desempenho por arquétipo</div>
      <div id="funil-arqs">${arqRows}</div>
    </div>`;
}

function htmlFunilArquetipos(){
  // agrupa contatos localmente
  const map = new Map();
  (_pj.contatos||[]).forEach(c => {
    if (!c.arquetipo_codigo) return;
    const k = c.arquetipo_codigo;
    if (!map.has(k)) map.set(k, { cod:k, nome:(_pj.catalogo||[]).find(x => x.codigo===k)?.nome || k, captados:0, qualif:0 });
    const row = map.get(k);
    row.captados++;
    if (c.qualidade === 'bom' || c.qualidade === 'quente') row.qualif++;
  });
  const rows = Array.from(map.values()).sort((a,b) => b.captados - a.captados);
  if (!rows.length) return '<div class="muted" style="padding:14px;font-style:italic;font-size:12.5px">Sem contatos vinculados a arquétipos ainda.</div>';
  return `<table class="orc-tab">
    <thead><tr><th>arquétipo</th><th class="num">captados</th><th class="num">qualificados</th><th class="num">taxa</th><th class="num">custo</th></tr></thead>
    <tbody>${rows.map(r => {
      const taxa = r.captados ? Math.round((r.qualif/r.captados)*100)+'%' : '—';
      return `<tr>
        <td><span class="mono" style="font-size:11px;color:var(--ink-3)">${esc(r.cod)}</span> · ${esc(r.nome)}</td>
        <td class="num">${r.captados}</td>
        <td class="num">${r.qualif}</td>
        <td class="num" style="color:${r.qualif>0?'var(--accent-2)':'var(--ink-3)'}">${taxa}</td>
        <td class="num muted" title="custo por arquétipo ainda não é atribuído">—</td>
      </tr>`;
    }).join('')}</tbody>
  </table>
  <div class="orc-nota">Custo por arquétipo ainda não é atribuído — a coluna ficará em branco até o razão ganhar tag por arquétipo.</div>`;
}

  _pj.templates = tpls.data || [];
  _pj.fila = fila.data || [];
  _pj.loteBreakdown = breakdown?.data || null;
  _pj.lotes = lotes.data || [];
  desenharCadencia();
}

  vincularCadencia();
