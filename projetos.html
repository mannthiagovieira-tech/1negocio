<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Projetos · Venda Assessorada · 1Negócio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#f7f8f6; --surface:#ffffff; --surface-2:#f2f4f0;
    --ink:#0d1a13; --ink-2:#38463e; --ink-3:#6b7a71; --ink-4:#9aa79f;
    --line:#e4e8e2; --line-2:#d4dccf;
    --accent:#0a9d55; --accent-2:#0c7842; --accent-soft:rgba(10,157,85,.08); --accent-ring:rgba(10,157,85,.20);
    --amber:#c48b04; --amber-soft:rgba(196,139,4,.08); --danger:#c22b3f;
    --sans:'Geist',system-ui,-apple-system,sans-serif;
    --serif:'Syne',serif;
    --mono:'JetBrains Mono',ui-monospace,monospace;
    --r-sm:9px; --r:13px; --r-lg:20px; --r-xl:22px;
    --sh-sm:0 1px 2px rgba(11,44,25,.04),0 1px 1px rgba(11,44,25,.03);
    --sh:0 4px 14px rgba(11,44,25,.06),0 1px 3px rgba(11,44,25,.04);
    --sh-lg:0 20px 40px -12px rgba(11,44,25,.10),0 8px 20px -8px rgba(11,44,25,.06),0 1px 2px rgba(11,44,25,.04);
    --sh-accent:0 6px 18px -4px rgba(10,157,85,.35),0 3px 8px -2px rgba(10,157,85,.20);
    --ease:cubic-bezier(.22,.9,.28,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;min-height:100vh}
  body{
    background:
      radial-gradient(1200px 700px at 50% -200px, rgba(10,157,85,.10), transparent 60%),
      radial-gradient(800px 500px at 90% -100px, rgba(10,157,85,.06), transparent 70%),
      #f7f8f6;
    background-attachment:fixed;
  }
  a{color:var(--accent);text-decoration:none;transition:opacity .22s var(--ease)}
  a:hover{opacity:.7}
  button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
  input,textarea,select{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 14px;width:100%;outline:none;transition:all .22s var(--ease)}
  input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
  textarea{resize:vertical;min-height:88px;line-height:1.55}
  .mono{font-family:var(--mono);letter-spacing:.02em}
  .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
  .h1{font-family:var(--serif);font-weight:800;font-size:34px;line-height:1.05;letter-spacing:-.02em;color:var(--ink)}
  .h2{font-family:var(--serif);font-weight:700;font-size:22px;line-height:1.2;letter-spacing:-.01em;color:var(--ink)}
  .h3{font-family:var(--serif);font-weight:700;font-size:16px;color:var(--ink)}
  .muted{color:var(--ink-3)}
  .row{display:flex;gap:12px;align-items:center}
  .col{display:flex;flex-direction:column;gap:12px}

  /* HEADER */
  header.top{position:sticky;top:0;z-index:20;backdrop-filter:blur(14px);background:rgba(247,248,246,.78);border-bottom:1px solid var(--line);padding:14px 32px;display:flex;align-items:center;justify-content:space-between;gap:20px}
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-weight:800;font-size:17px;letter-spacing:-.02em;color:var(--ink)}
  .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
  .brand small{font-family:var(--mono);font-weight:500;font-size:10px;color:var(--ink-3);letter-spacing:.12em;text-transform:uppercase}
  .conn{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;color:var(--ink-3);padding:5px 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line)}
  .conn::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--ink-4)}
  .conn.on::before{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .conn.err::before{background:var(--danger)}

  /* BUTTONS */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 18px;border-radius:var(--r);font-family:var(--sans);font-weight:600;font-size:13.5px;letter-spacing:-.005em;transition:all .22s var(--ease);border:1px solid transparent}
  .btn:hover{transform:translateY(-1px)}
  .btn:active{transform:translateY(0)}
  .btn-primary{background:linear-gradient(180deg,var(--accent) 0%,var(--accent-2) 100%);color:#fff;box-shadow:var(--sh-accent)}
  .btn-primary:hover{box-shadow:0 10px 24px -4px rgba(10,157,85,.45),0 4px 10px -2px rgba(10,157,85,.25)}
  .btn-ghost{background:var(--surface);color:var(--ink);border-color:var(--line);box-shadow:var(--sh-sm)}
  .btn-ghost:hover{border-color:var(--line-2);background:var(--surface-2)}
  .btn-sm{height:32px;padding:0 12px;font-size:12.5px;border-radius:10px}
  .btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}

  /* MAIN */
  main{max-width:1280px;margin:0 auto;padding:32px}

  /* AUTH CARD */
  .auth-wrap{min-height:calc(100vh - 160px);display:flex;align-items:center;justify-content:center;padding:40px 20px}
  .auth-card{width:100%;max-width:400px;background:var(--surface);border-radius:var(--r-xl);padding:36px;box-shadow:var(--sh-lg);border:1px solid var(--line)}

  /* CARDS */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);padding:26px;box-shadow:var(--sh);transition:all .22s var(--ease)}
  .card-tight{padding:20px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}
  .proj-card{cursor:pointer}
  .proj-card:hover{transform:translateY(-2px);box-shadow:var(--sh-lg);border-color:var(--line-2)}
  .proj-card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
  .proj-card h3{font-family:var(--serif);font-weight:700;font-size:17px;color:var(--ink);letter-spacing:-.01em}
  .proj-card .sub{font-size:12.5px;color:var(--ink-3);margin-top:2px}
  .proj-card .kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
  .kpi .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.10em;text-transform:uppercase;color:var(--ink-3)}
  .kpi .v{font-family:var(--serif);font-weight:700;font-size:20px;color:var(--ink);letter-spacing:-.01em;margin-top:2px}
  .kpi .v small{font-family:var(--sans);font-size:12px;font-weight:500;color:var(--ink-3);letter-spacing:0}
  .progress{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-top:14px}
  .progress span{display:block;height:100%;background:linear-gradient(90deg,var(--accent) 0%,#12c26b 100%);transition:width .5s var(--ease);border-radius:99px}
  .badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:99px;font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:500;border:1px solid transparent}
  .badge.setup{background:var(--amber-soft);color:var(--amber);border-color:rgba(196,139,4,.20)}
  .badge.ativo{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-ring)}
  .badge.pausado{background:var(--surface-2);color:var(--ink-3);border-color:var(--line-2)}
  .badge.concluido{background:rgba(10,157,85,.14);color:var(--accent-2);border-color:var(--accent-ring)}

  /* EMPTY */
  .empty{text-align:center;padding:80px 20px;background:var(--surface);border-radius:var(--r-xl);border:1px dashed var(--line-2);box-shadow:var(--sh-sm)}
  .empty h2{font-family:var(--serif);font-weight:700;font-size:22px;letter-spacing:-.01em;color:var(--ink);margin-bottom:8px}
  .empty p{color:var(--ink-3);margin-bottom:22px;max-width:400px;margin-left:auto;margin-right:auto}

  /* FORM */
  .fld{display:flex;flex-direction:column;gap:6px}
  .fld > .lbl{margin-bottom:1px}
  .fld small{color:var(--ink-3);font-size:11.5px;margin-top:1px}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .form-full{grid-column:1 / -1}

  /* NEW project layout */
  .new-layout{display:grid;grid-template-columns:1fr 380px;gap:28px;align-items:start}
  @media(max-width:960px){.new-layout{grid-template-columns:1fr}}
  .calc-sticky{position:sticky;top:88px}
  .calc-row{display:flex;justify-content:space-between;align-items:baseline;padding:11px 0;border-bottom:1px dashed var(--line)}
  .calc-row:last-child{border-bottom:none}
  .calc-lbl{font-size:13px;color:var(--ink-2)}
  .calc-val{font-family:var(--serif);font-weight:700;font-size:16px;color:var(--ink);letter-spacing:-.01em}
  .calc-val.big{font-size:22px;color:var(--accent)}
  .calc-hint{font-family:var(--mono);font-size:10px;color:var(--ink-4);letter-spacing:.05em;text-transform:uppercase;margin-top:1px}
  .calc-highlight{background:linear-gradient(135deg,rgba(10,157,85,.06),rgba(10,157,85,.02));border:1px solid var(--accent-ring);border-radius:var(--r);padding:14px 16px;margin:10px 0}

  /* PROJECT layout */
  .proj-layout{display:grid;grid-template-columns:262px 1fr;gap:28px;align-items:start}
  @media(max-width:900px){.proj-layout{grid-template-columns:1fr}}
  .trail{position:sticky;top:88px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);padding:20px 18px;box-shadow:var(--sh)}
  .trail-title{font-family:var(--serif);font-weight:700;font-size:14px;color:var(--ink);margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--line);letter-spacing:-.005em}
  .steps{position:relative;padding-left:22px}
  .steps::before{content:'';position:absolute;left:8px;top:6px;bottom:6px;width:1.5px;background:linear-gradient(180deg,var(--line-2) 0%,var(--line) 100%);border-radius:99px}
  .step{position:relative;display:flex;flex-direction:column;padding:9px 8px 9px 8px;margin-left:-4px;border-radius:10px;cursor:pointer;transition:all .22s var(--ease)}
  .step:hover{background:var(--surface-2)}
  .step.active{background:var(--accent-soft)}
  .step .bul{position:absolute;left:-22px;top:12px;width:15px;height:15px;border-radius:50%;background:var(--surface);border:2px solid var(--line-2);z-index:2;display:flex;align-items:center;justify-content:center;transition:all .22s var(--ease)}
  .step.ok .bul{background:var(--accent);border-color:var(--accent);color:#fff}
  .step.ok .bul::after{content:'✓';font-size:10px;font-weight:700}
  .step.now .bul{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 4px var(--accent-soft)}
  .step .tit{font-family:var(--sans);font-weight:600;font-size:12.5px;color:var(--ink);line-height:1.35;letter-spacing:-.005em}
  .step.ok .tit{color:var(--ink-3);text-decoration:line-through;text-decoration-thickness:1px;text-decoration-color:var(--ink-4)}
  .step .meta{font-family:var(--mono);font-size:9.5px;color:var(--ink-4);letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
  .step .meta.cliente{color:var(--amber)}

  .stage{min-height:60vh}
  .stage-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:22px}
  .stage-head h2{font-family:var(--serif);font-weight:700;font-size:26px;letter-spacing:-.015em;color:var(--ink)}
  .stage-head .meta{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-top:4px;letter-spacing:.05em;text-transform:uppercase}

  /* KICKOFF */
  .k-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);padding:24px;box-shadow:var(--sh);margin-bottom:18px}
  .k-card .lbl{margin-bottom:10px}
  .k-card h3{font-family:var(--serif);font-weight:700;font-size:18px;color:var(--ink);letter-spacing:-.01em;margin-bottom:6px}
  .k-card .motivo{color:var(--ink-3);font-size:13px;margin-bottom:12px}
  .k-quest{padding:16px 0;border-bottom:1px solid var(--line)}
  .k-quest:last-child{border-bottom:none;padding-bottom:0}
  .k-quest:first-child{padding-top:0}
  .k-quest .q{font-family:var(--serif);font-weight:700;font-size:15px;color:var(--ink);margin-bottom:5px;letter-spacing:-.005em}
  .k-quest .por{color:var(--ink-3);font-size:12.5px;margin-bottom:10px}
  .k-block{margin-bottom:16px}
  .k-block:last-child{margin-bottom:0}
  .k-block h4{font-family:var(--serif);font-weight:700;font-size:14px;color:var(--ink);margin-bottom:8px;display:flex;align-items:center;gap:8px}
  .k-check{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px;color:var(--ink-2);cursor:pointer;user-select:none}
  .k-check input{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;padding:0;margin:0}
  .k-checks{margin-bottom:10px}
  .aviso{background:var(--amber-soft);border:1px solid rgba(196,139,4,.25);border-radius:var(--r);padding:14px 16px;color:var(--amber);font-size:13px;line-height:1.55;margin-top:14px}
  .aviso strong{font-weight:700}

  /* TOAST */
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 20px;border-radius:99px;font-size:13px;font-weight:500;box-shadow:0 12px 28px -8px rgba(11,44,25,.35);opacity:0;transition:all .28s var(--ease);pointer-events:none;z-index:100}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.err{background:var(--danger)}
  .toast.ok{background:var(--accent-2)}

  /* SIGILO CARDS */
  .sig-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:6px 0 14px}
  @media(max-width:720px){.sig-grid{grid-template-columns:1fr}}
  .sig-card{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:16px 16px 14px;cursor:pointer;transition:all .22s var(--ease);text-align:left}
  .sig-card:hover{border-color:var(--line-2);transform:translateY(-1px);box-shadow:var(--sh)}
  .sig-card.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:var(--sh-accent)}
  .sig-card .nm{font-family:var(--serif);font-weight:700;font-size:15px;color:var(--ink);letter-spacing:-.005em;text-transform:capitalize}
  .sig-card .ds{font-size:12.5px;color:var(--ink-3);margin-top:6px;line-height:1.45}
  .sig-card.on .nm{color:var(--accent-2)}
  .sig-card .tag{display:inline-block;font-family:var(--mono);font-size:9.5px;color:var(--ink-4);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
  .sig-card.on .tag{color:var(--accent)}

  /* BLACKLIST */
  .bl-form{display:grid;grid-template-columns:1.5fr 1fr 1fr 1.5fr auto;gap:8px;align-items:end;margin-bottom:14px}
  @media(max-width:800px){.bl-form{grid-template-columns:1fr 1fr}}
  .bl-form input{padding:9px 12px;font-size:13px}
  .bl-list{display:flex;flex-direction:column;gap:8px;margin-top:14px}
  .bl-item{background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:11px 14px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
  .bl-item-info{display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;font-size:13px}
  .bl-item-info .n{font-weight:600;color:var(--ink)}
  .bl-item-info .m{font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
  .bl-item-info .mot{color:var(--ink-2);font-style:italic;font-size:12.5px}
  .bl-empty{padding:16px;border:1px dashed var(--line-2);border-radius:var(--r);text-align:center;color:var(--ink-3);font-size:13px;font-style:italic}
  .aviso-red{background:rgba(194,43,63,.06);border:1px solid rgba(194,43,63,.25);color:var(--danger);border-radius:var(--r);padding:12px 16px;font-size:12.5px;line-height:1.5;margin-top:14px}
  .aviso-red strong{font-weight:700}

  /* LAUDO */
  .laudo-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
  @media(max-width:700px){.laudo-grid{grid-template-columns:1fr}}
  .laudo-central{border-color:var(--accent);background:var(--accent-soft)}
  .faixa-box{background:linear-gradient(135deg,rgba(10,157,85,.08),rgba(10,157,85,.02));border:1px solid var(--accent-ring);border-radius:var(--r-lg);padding:22px 24px;margin-top:18px;text-align:center}
  .faixa-lbl{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600}
  .faixa-val{font-family:var(--serif);font-weight:800;font-size:28px;color:var(--ink);margin-top:8px;letter-spacing:-.015em}
  .faixa-central{color:var(--accent-2);font-size:32px}
  .faixa-sep{color:var(--ink-4);font-weight:400;margin:0 8px;font-size:22px}

  /* ARQUÉTIPOS */
  .arq-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
  .arq-card{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:14px 16px 12px;cursor:pointer;transition:all .22s var(--ease);position:relative;overflow:hidden;text-align:left;display:flex;flex-direction:column;gap:6px}
  .arq-card:hover{border-color:var(--line-2);transform:translateY(-1px);box-shadow:var(--sh)}
  .arq-card.on{border-color:var(--accent);background:var(--accent-soft)}
  .arq-card .cd{font-family:var(--mono);font-size:10px;color:var(--ink-4);letter-spacing:.10em}
  .arq-card.on .cd{color:var(--accent)}
  .arq-card .nm{font-family:var(--serif);font-weight:700;font-size:14.5px;color:var(--ink);letter-spacing:-.005em;line-height:1.25}
  .arq-card .bs{font-size:12px;color:var(--ink-3);line-height:1.45}
  .arq-selo{position:absolute;top:12px;right:12px;font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:99px;font-weight:600}
  .arq-selo.scrapper{background:var(--accent-soft);color:var(--accent-2);border:1px solid var(--accent-ring)}
  .arq-selo.midia{background:rgba(60,140,255,.10);color:#2b6cb0;border:1px solid rgba(60,140,255,.25)}
  .arq-selo.rede{background:var(--surface-2);color:var(--ink-3);border:1px solid var(--line-2)}

  .arq-linha{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:12px}
  .arq-linha-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:10px;flex-wrap:wrap}
  .arq-linha-nm{font-family:var(--serif);font-weight:700;font-size:15px;color:var(--ink)}
  .arq-linha-cd{font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.06em}
  .arq-linha-grid{display:grid;grid-template-columns:100px 140px 1fr;gap:12px;margin-bottom:10px}
  @media(max-width:700px){.arq-linha-grid{grid-template-columns:1fr}}
  .arq-linha-grid input,.arq-linha-grid textarea{padding:8px 10px;font-size:12.5px}
  .arq-orient{background:var(--surface-2);border-radius:10px;padding:10px 14px;font-size:12px;color:var(--ink-2);line-height:1.55;margin-top:8px}
  .arq-orient dl{display:grid;grid-template-columns:110px 1fr;gap:4px 12px;margin:0}
  .arq-orient dt{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-4);align-self:center}
  .arq-orient dd{color:var(--ink-2);font-size:12px;margin:0}
  .arq-toggle{background:none;border:none;color:var(--accent-2);font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;padding:4px 0}

  /* ANEXOS */
  .anx-form-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr auto;gap:10px;align-items:end;margin-bottom:16px}
  @media(max-width:800px){.anx-form-grid{grid-template-columns:1fr 1fr}}
  .anx-tab{display:flex;gap:6px;margin-bottom:10px}
  .anx-tab button{padding:6px 14px;border-radius:99px;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:var(--ink-3);background:var(--surface-2);border:1px solid transparent;transition:all .22s var(--ease)}

  .aprov-toggle{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-2);cursor:pointer}

  .vis-legend b{font-family:var(--mono);font-size:10px;color:var(--ink-2);letter-spacing:.06em;text-transform:uppercase;font-weight:600;margin-right:4px}

  /* TEASER */
  .ts-layout{display:grid;grid-template-columns:1fr 320px;gap:20px;align-items:start}
  @media(max-width:900px){.ts-layout{grid-template-columns:1fr}}
  .ts-versoes{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .ts-versao-chip{padding:5px 12px;border-radius:99px;font-family:var(--mono);font-size:11px;letter-spacing:.04em;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink-3);transition:all .22s var(--ease);display:inline-flex;align-items:center;gap:6px}
  .ts-versao-chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}

  .st-rascunho{background:var(--ink-4)}

  .ts-editor textarea{min-height:280px;font-family:var(--sans);font-size:14px;line-height:1.6}

  .ts-ctx{position:sticky;top:88px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);padding:18px;box-shadow:var(--sh);font-size:12.5px;max-height:calc(100vh - 120px);overflow-y:auto}

  /* TRILHA · grupos */
  .trail-sep{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
  .trail-grupo{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-4);font-weight:600;margin-bottom:10px;padding-left:22px}
  .step.gestao .bul{background:transparent;border:none;color:var(--ink-3);width:15px;height:15px;font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center;top:11px}

  /* ORÇAMENTO · resumo */
  .orc-resumo{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:14px}

  .orc-kpi .v{font-family:var(--serif);font-weight:700;font-size:22px;color:var(--ink);letter-spacing:-.01em;margin-top:4px}
  .orc-kpi.destaque{background:linear-gradient(135deg,rgba(10,157,85,.08),rgba(10,157,85,.02));border-color:var(--accent-ring)}
  .orc-kpi.destaque .v{color:var(--accent-2)}
  .orc-apropriacao{margin-top:12px;display:flex;flex-wrap:wrap;gap:14px;padding:10px 14px;background:var(--surface-2);border-radius:10px;font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
  .orc-apropriacao b{color:var(--ink-2);font-weight:600}
  .orc-apropriacao .warn{color:var(--amber);font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;margin-left:auto}

  /* ORÇAMENTO · ritmo */
  .ritmo-bar{position:relative;height:14px;background:var(--surface-2);border:1px solid var(--line);border-radius:99px;overflow:hidden;margin-top:12px}
  .ritmo-cons{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--accent) 0%,#12c26b 100%);border-radius:99px;transition:width .5s var(--ease)}
  .ritmo-cons.at{background:linear-gradient(90deg,var(--amber) 0%,#e0a010 100%)}
  .ritmo-cons.at2{background:linear-gradient(90deg,var(--danger) 0%,#e03a4f 100%)}
  .ritmo-marker{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
  .ritmo-labels{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;color:var(--ink-3);margin-top:6px}
  .ritmo-status{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:99px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;margin-top:12px}
  .ritmo-status.ok{background:var(--accent-soft);color:var(--accent-2);border:1px solid var(--accent-ring)}
  .ritmo-status.at{background:var(--amber-soft);color:var(--amber);border:1px solid rgba(196,139,4,.25)}
  .ritmo-status.at2{background:rgba(194,43,63,.08);color:var(--danger);border:1px solid rgba(194,43,63,.25)}

  /* ORÇAMENTO · plano/razão/parcelas · tabela genérica */
  .orc-tab{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:10px}
  .orc-tab thead th{text-align:left;padding:8px 10px;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);border-bottom:1px solid var(--line);font-weight:600;background:var(--surface-2)}
  .orc-tab tbody td{padding:10px;border-bottom:1px solid var(--line);color:var(--ink-2);vertical-align:middle}
  .orc-tab tbody tr:last-child td{border-bottom:none}
  .orc-tab .num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
  .orc-tab tfoot td{padding:10px;font-family:var(--mono);font-weight:600;color:var(--ink);background:var(--surface-2);border-top:1.5px solid var(--line-2)}
  .orc-tab input,.orc-tab select{padding:6px 10px;font-size:12px;border-radius:9px}
  .orc-plano-prog{display:flex;align-items:center;gap:8px}
  .orc-plano-prog-bar{flex:1;height:5px;background:var(--surface-2);border-radius:99px;overflow:hidden;min-width:60px}
  .orc-plano-prog-bar span{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .35s var(--ease)}
  .orc-plano-prog-bar span.stopa{background:var(--danger)}
  .orc-plano-prog-pct{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);min-width:38px;text-align:right}
  tr.tipo-estourado td{background:rgba(194,43,63,.06)}
  .orc-adicionar-linha{display:grid;grid-template-columns:1.5fr 130px 90px 100px auto;gap:8px;align-items:end;margin-top:14px}
  @media(max-width:800px){.orc-adicionar-linha{grid-template-columns:1fr 1fr}}
  .orc-nota{font-family:var(--mono);font-size:11px;color:var(--ink-3);padding:10px 14px;background:var(--surface-2);border-radius:10px;margin-top:12px;line-height:1.55}
  .orc-precos-toggle{background:none;border:none;font-family:var(--serif);font-weight:700;font-size:16px;color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:6px 0}
  .orc-precos-toggle .chev{font-size:10px;color:var(--ink-3);transition:transform .22s var(--ease)}
  .orc-precos-toggle.aberto .chev{transform:rotate(180deg)}
  .preco-a-definir{color:var(--amber);font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
  .preco-repasse{color:var(--ink-3);font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}

  /* MODAL */

  .modal-card{background:var(--surface);border-radius:var(--r-xl);box-shadow:var(--sh-lg);border:1px solid var(--line);padding:30px;max-width:480px;width:100%}
  .modal-card h3{font-family:var(--serif);font-weight:700;font-size:20px;margin-bottom:14px;color:var(--ink);letter-spacing:-.01em}

  /* PREÇO */
  .desvio-box{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-top:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .desvio-val{font-family:var(--serif);font-weight:700;font-size:20px;letter-spacing:-.01em}
  .desvio-pos{color:var(--amber)}
  .desvio-neg{color:var(--ink-2)}
  .desvio-neutro{color:var(--accent-2)}

  /* utilities */
  .hidden{display:none!important}
  .space{margin-top:20px}
  .space-sm{margin-top:12px}
  .err-box{background:rgba(194,43,63,.08);border:1px solid rgba(194,43,63,.25);color:var(--danger);padding:14px 16px;border-radius:var(--r);font-size:13px}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <span class="dot"></span>
    <span>1Negócio <small>· Venda Assessorada</small></span>
  </div>
  <div class="row">
    <span id="conn" class="conn">conectando…</span>
    <button id="new-btn" class="btn btn-primary hidden" onclick="rota('#/novo')">
      <span>+</span> Novo projeto
    </button>
    <button id="logout-btn" class="btn btn-ghost btn-sm hidden" onclick="logout()">sair</button>
  </div>
</header>

<main id="app">
  <div class="empty"><h2>Carregando…</h2></div>
</main>

<div id="toast" class="toast"></div>

<div id="modal-back" class="modal-back" onclick="fecharModal(event)"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
<script>
'use strict';

// ─── config ────────────────────────────────────────────────────────
const SB_URL = 'https://dbijmgqlcrgjlcfrastg.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRiaWptZ3FsY3JnamxjZnJhc3RnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMwNzYxNjMsImV4cCI6MjA4ODY1MjE2M30.mV2rANZ8Nb_AbifTmkEvdfX_nsm8zeT6Al_bPrCzNAA';
const sb = window.supabase.createClient(SB_URL, SB_KEY);
const app = document.getElementById('app');
const conn = document.getElementById('conn');
const newBtn = document.getElementById('new-btn');
const logoutBtn = document.getElementById('logout-btn');

// ─── util ──────────────────────────────────────────────────────────
const esc = s => (s ?? '').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl = n => (Number(n)||0).toLocaleString('pt-BR', {style:'currency', currency:'BRL', maximumFractionDigits:0});
const brlNice = n => 'R$ ' + (Number(n)||0).toLocaleString('pt-BR', {maximumFractionDigits:0});
const dataBR = d => { if(!d) return '—'; const dt = new Date(d+'T00:00:00'); return dt.toLocaleDateString('pt-BR', {day:'2-digit', month:'short'}).replace('.',''); };
function toast(msg, kind){ const t = document.getElementById('toast'); t.className = 'toast show ' + (kind||''); t.textContent = msg; clearTimeout(toast._t); toast._t = setTimeout(()=>{ t.className='toast'; }, 2200); }
function setConn(state, msg){ conn.className = 'conn ' + state; conn.textContent = msg; }

// debounce por chave (usada em auto-save de campo específico)
const _debTimers = {};
function debounce(key, fn, ms=350){ clearTimeout(_debTimers[key]); _debTimers[key] = setTimeout(fn, ms); }

// ─── ping health check ────────────────────────────────────────────
async function ping(){
  try {
    const { error } = await sb.from('va_projetos_resumo').select('id', {count:'exact', head:true});
    if (error) {
      if ((error.message||'').match(/does not exist|not found|schema/i)) {
        setConn('err', 'schema faltando');
        return { ok:false, kind:'schema', msg: error.message };
      }
      setConn('err', 'erro conexão');
      return { ok:false, kind:'db', msg: error.message };
    }
    setConn('on', 'conectado');
    return { ok:true };
  } catch (e) {
    setConn('err', 'sem rede');
    return { ok:false, kind:'net', msg: e.message };
  }
}

// ─── auth ─────────────────────────────────────────────────────────
let _session = null;
async function initAuth(){
  const { data: { session } } = await sb.auth.getSession();
  _session = session;
  sb.auth.onAuthStateChange((_e, s) => { _session = s; router(); });
  return session;
}
async function logout(){ await sb.auth.signOut(); location.hash = '#/'; }

function renderLogin(errMsg){
  newBtn.classList.add('hidden');
  logoutBtn.classList.add('hidden');
  app.innerHTML = `
    <div class="auth-wrap">
      <div class="auth-card">
        <div class="lbl" style="margin-bottom:8px">acesso</div>
        <h1 class="h2" style="margin-bottom:6px">Entrar</h1>
        <p class="muted" style="margin-bottom:22px;font-size:13px">Use as credenciais do painel admin do 1Negócio.</p>
        ${errMsg ? `<div class="err-box" style="margin-bottom:14px">${esc(errMsg)}</div>` : ''}
        <form id="login-form" class="col" style="gap:14px">
          <div class="fld"><span class="lbl">e-mail</span><input type="email" id="lg-email" required autocomplete="email" placeholder="voce@1negocio.com.br"></div>
          <div class="fld"><span class="lbl">senha</span><input type="password" id="lg-pw" required autocomplete="current-password" placeholder="••••••••"></div>
          <button class="btn btn-primary" type="submit" style="width:100%;margin-top:8px">Entrar</button>
        </form>
      </div>
    </div>`;
  document.getElementById('login-form').onsubmit = async (ev) => {
    ev.preventDefault();
    const email = document.getElementById('lg-email').value.trim();
    const pw = document.getElementById('lg-pw').value;
    const btn = ev.target.querySelector('button');
    btn.disabled = true; btn.textContent = 'Entrando…';
    const { error } = await sb.auth.signInWithPassword({ email, password: pw });
    if (error) { renderLogin(error.message || 'Falha no login'); return; }
    location.hash = '#/'; router();
  };
}

// ─── router ────────────────────────────────────────────────────────
function rota(h){ location.hash = h; }
window.addEventListener('hashchange', router);

async function router(){
  const health = await ping();
  if (!_session) { renderLogin(); return; }
  newBtn.classList.remove('hidden');
  logoutBtn.classList.remove('hidden');
  if (!health.ok && health.kind === 'schema') { renderSchemaMissing(); return; }
  if (!health.ok) { renderErr(health.msg); return; }

  const h = location.hash || '#/';
  if (h === '#/novo') return renderNovo();
  const m = h.match(/^#\/p\/([\w-]+)$/);
  if (m) return renderProjeto(m[1]);
  return renderLista();
}

function renderErr(msg){
  app.innerHTML = `<div class="empty"><h2>Erro de conexão</h2><p class="muted">${esc(msg)}</p></div>`;
}
function renderSchemaMissing(){
  app.innerHTML = `
    <div class="empty">
      <h2>Schema Venda Assessorada não encontrado</h2>
      <p>As tabelas <code>va_projetos</code> ainda não existem no banco. Aplique a migration <code>001_venda_assessorada.sql</code> antes de continuar.</p>
    </div>`;
}

// ─── VIEW: LISTA ──────────────────────────────────────────────────
async function renderLista(){
  app.innerHTML = `<div class="empty"><h2>Carregando projetos…</h2></div>`;
  const { data, error } = await sb.from('va_projetos_resumo').select('*').order('criado_em', {ascending:false});
  if (error) { renderErr(error.message); return; }
  if (!data.length) {
    app.innerHTML = `
      <div class="empty">
        <h2>Nenhum projeto ainda</h2>
        <p>Comece criando o primeiro mandato de venda assessorada. A trilha e as parcelas são geradas automaticamente.</p>
        <button class="btn btn-primary" onclick="rota('#/novo')">+ Criar primeiro projeto</button>
      </div>`;
    return;
  }
  app.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:24px">
      <div>
        <div class="lbl" style="margin-bottom:6px">carteira</div>
        <h1 class="h1">Projetos</h1>
        <p class="muted" style="margin-top:6px">${data.length} mandato${data.length===1?'':'s'} em curso.</p>
      </div>
    </div>
    <div class="grid">${data.map(cardProjeto).join('')}</div>`;
}

function cardProjeto(p){
  const pct = p.etapas_total ? Math.round(p.etapas_ok * 100 / p.etapas_total) : 0;
  const mensal = Number(p.valor_mensal||0), fid = p.fidelidade_meses||3;
  const dia = p.dia_atual||0;
  return `
    <div class="card proj-card" onclick="rota('#/p/${p.id}')">
      <div class="top">
        <div>
          <h3>${esc(p.cliente_nome)}</h3>
          <div class="sub">${esc(p.negocio_titulo || p.setor || 'Negócio sem título')}${p.cidade ? ' · ' + esc(p.cidade) : ''}</div>
        </div>
        <span class="badge ${esc(p.status)}">${esc(p.status)}</span>
      </div>
      <div class="kpis">
        <div class="kpi"><div class="k">Mensalidade × fidelidade</div><div class="v">${brlNice(mensal)}<small> × ${fid}m</small></div></div>
        <div class="kpi"><div class="k">Dia atual</div><div class="v">${dia >= 0 ? dia : 0}<small> / ${fid*30}</small></div></div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px">
        <div class="lbl">Etapas concluídas</div>
        <div class="mono" style="font-size:12px;color:var(--ink-2);font-weight:600">${p.etapas_ok}/${p.etapas_total} · ${pct}%</div>
      </div>
      <div class="progress"><span style="width:${pct}%"></span></div>
    </div>`;
}

// ─── VIEW: NOVO ───────────────────────────────────────────────────
function renderNovo(){
  const hoje = new Date().toISOString().slice(0,10);
  app.innerHTML = `
    <div style="margin-bottom:22px">
      <a onclick="rota('#/')" style="font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer">← voltar</a>
      <h1 class="h1" style="margin-top:10px">Novo projeto</h1>
      <p class="muted" style="margin-top:6px">Contrato, parcelas e trilha de 15 etapas são geradas automaticamente ao salvar.</p>
    </div>
    <div class="new-layout">
      <div class="card">
        <form id="new-form" class="col" style="gap:20px">

let _pj = null; // { projeto, etapas, kickoff }
let _abaChave = 'kickoff';

async function renderProjeto(id){
  app.innerHTML = `<div class="empty"><h2>Carregando projeto…</h2></div>`;
  const [proj, etapas, kickoff, blk, arqCat, arqProj, anx, teas, fin, plano, razao, parcelas, precos] = await Promise.all([
    sb.from('va_projetos_resumo').select('*').eq('id', id).maybeSingle(),
    sb.from('va_projeto_etapas').select('*').eq('projeto_id', id).order('ordem'),
    sb.from('va_projeto_kickoff').select('*').eq('projeto_id', id).maybeSingle(),
    sb.from('va_projeto_blacklist').select('*').eq('projeto_id', id).order('criado_em', {ascending:false}),
    (window._catalogoArq ? Promise.resolve({data: window._catalogoArq}) : sb.from('va_arquetipos_catalogo').select('*').order('ordem')),
    sb.from('va_projeto_arquetipos').select('*').eq('projeto_id', id).order('prioridade', {ascending:true, nullsFirst:false}),
    sb.from('va_projeto_anexos').select('*').eq('projeto_id', id).order('criado_em', {ascending:false}),
    sb.from('va_projeto_teaser').select('*').eq('projeto_id', id).order('versao', {ascending:false}),
    sb.from('va_projeto_financeiro').select('*').eq('projeto_id', id).maybeSingle(),
    sb.from('va_projeto_plano').select('*').eq('projeto_id', id).order('criado_em'),
    sb.from('va_projeto_razao').select('*').eq('projeto_id', id).order('data', {ascending:false}).order('criado_em', {ascending:false}),
    sb.from('va_projeto_parcelas').select('*').eq('projeto_id', id).order('numero'),
    sb.from('va_precos').select('*').order('ordem'),
  ]);
  if (proj.error || !proj.data) { renderErr(proj.error?.message || 'Projeto não encontrado'); return; }
  if (arqCat.data) window._catalogoArq = arqCat.data;
  _pj = {
    projeto: proj.data,
    etapas: etapas.data || [],
    kickoff: kickoff.data || null,
    blacklist: blk.data || [],
    catalogo: window._catalogoArq || [],
    arquetipos: arqProj.data || [],
    anexos: anx.data || [],
    teasers: teas.data || [],
    teaserSel: null,
    financeiro: fin.data || null,
    plano: plano.data || [],
    razao: razao.data || [],
    parcelas: parcelas.data || [],
    precos: precos.data || [],
    razaoFiltroCiclo: null,
    precosAberto: false,
  };
  if (!_pj.kickoff) _pj.kickoff = { projeto_id: id, itens: {} };
  desenhaProjeto();
}

// checa auto-conclusão de uma etapa após mudança
async function checarAutoConclusao(chave){
  const et = _pj.etapas.find(x => x.chave === chave);
  if (!et || et.status === 'concluida') return;
  const p = _pj.projeto;
  let condMet = false;
  if (chave === 'laudo') {
    condMet = p.valor_avaliacao != null && p.valor_avaliacao_min != null && p.valor_avaliacao_max != null;
  } else if (chave === 'preco') {
    condMet = p.valor_venda != null && !!p.valor_venda_decidido_por && !!(p.valor_venda_justificativa||'').trim();
  } else if (chave === 'arquetipos') {
    const sel = _pj.arquetipos || [];
    condMet = sel.length >= 3 && sel.every(a => Array.isArray(a.queries_busca) && a.queries_busca.length > 0);
  } else if (chave === 'teaser') {
    condMet = (_pj.teasers||[]).some(v => v.status === 'aprovado');
  } else if (chave === 'regras') {
    return;
  }
  if (condMet) {
    const hoje = new Date().toISOString().slice(0,10);
    const { error } = await sb.from('va_projeto_etapas').update({ status:'concluida', data_real: hoje }).eq('id', et.id);
    if (error) return;
    et.status = 'concluida'; et.data_real = hoje;
    _pj.projeto.etapas_ok = (_pj.projeto.etapas_ok || 0) + 1;
    toast('Etapa concluída automaticamente', 'ok');
    desenhaProjeto();
  }
}

function desenhaStep(e){
  const isActive = e.chave === _abaChave;
  const ok = e.status === 'concluida';
  const now = e.status === 'em_andamento';
  const respCls = e.responsavel === 'cliente' ? 'cliente' : '';
  return `
    <div class="step ${ok?'ok':''} ${now?'now':''} ${isActive?'active':''}" onclick="trocarAba('${e.chave}')">

      <span class="tit">${esc(e.titulo)}</span>

function trocarAba(chave){ _abaChave = chave; desenhaProjeto(); }

function desenhaAba(){
  const stage = document.getElementById('stage');

  if (_abaChave === 'gestao_orcamento')  { stage.innerHTML = htmlOrcamento();  vincularOrcamento(); return; }
  if (_abaChave === 'gestao_kanban')     { stage.innerHTML = htmlGestaoPlaceholder('Kanban','Movimentação por interessado, entrega semanal, follow-ups.'); return; }
  if (_abaChave === 'gestao_relatorios') { stage.innerHTML = htmlGestaoPlaceholder('Relatórios','Consumo, ROI da onda, exportáveis pro cliente.'); return; }
  // SETUP
  const e = _pj.etapas.find(x => x.chave === _abaChave) || _pj.etapas[0];
  if (!e) { stage.innerHTML = '<div class="empty"><h2>Etapa não encontrada</h2></div>'; return; }
  if (e.chave === 'kickoff')    { stage.innerHTML = htmlKickoff(e);    vincularKickoff();    return; }
  if (e.chave === 'regras')     { stage.innerHTML = htmlRegras(e);     vincularRegras();     return; }
  if (e.chave === 'laudo')      { stage.innerHTML = htmlLaudo(e);      vincularLaudo();      return; }
  if (e.chave === 'preco')      { stage.innerHTML = htmlPreco(e);      vincularPreco();      return; }
  if (e.chave === 'arquetipos') { stage.innerHTML = htmlArquetipos(e); vincularArquetipos(); return; }
  if (e.chave === 'anexos')     { stage.innerHTML = htmlAnexos(e);     vincularAnexos();     return; }
  if (e.chave === 'teaser')     { stage.innerHTML = htmlTeaser(e);     vincularTeaser();     return; }
  stage.innerHTML = htmlEtapaGenerica(e);
}

function vincularKickoff(){
  // textareas -> onblur salva o campo
  document.querySelectorAll('#stage textarea[data-field]').forEach(el => {
    el.addEventListener('blur', () => salvarKickoffCampo(el.dataset.field, el.value));
  });
  // checkboxes -> salva itens jsonb consolidado
  document.querySelectorAll('#stage input[type="checkbox"][data-cat]').forEach(el => {
    el.addEventListener('change', () => salvarKickoffItens());
  });
}

async function salvarKickoffCampo(field, valor){
  const id = _pj.projeto.id;
  const antes = _pj.kickoff[field] || '';
  if ((valor||'') === antes) return;
  const patch = {}; patch[field] = valor;
  const { error } = await sb.from('va_projeto_kickoff').upsert({ projeto_id: id, ...patch }, { onConflict: 'projeto_id' });
  if (error) { toast('Falhou: ' + error.message, 'err'); return; }
  _pj.kickoff[field] = valor;
  toast('Salvo', 'ok');
}

async function salvarKickoffItens(){
  const id = _pj.projeto.id;
  const itens = {};
  document.querySelectorAll('#stage input[type="checkbox"][data-cat]').forEach(el => {
    const c = el.dataset.cat, i = el.dataset.item;
    itens[c] = itens[c] || {};
    if (el.checked) itens[c][i] = true;
  });
  const { error } = await sb.from('va_projeto_kickoff').upsert({ projeto_id: id, itens }, { onConflict: 'projeto_id' });
  if (error) { toast('Falhou: ' + error.message, 'err'); return; }
  _pj.kickoff.itens = itens;
  toast('Checklist salvo', 'ok');
}

async function toggleEtapa(id, atualmenteOk){
  const patch = atualmenteOk
    ? { status: 'pendente', data_real: null }
    : { status: 'concluida', data_real: new Date().toISOString().slice(0,10) };
  const { error } = await sb.from('va_projeto_etapas').update(patch).eq('id', id);
  if (error) { toast('Falhou: ' + error.message, 'err'); return; }
  toast(atualmenteOk ? 'Reaberta' : 'Concluída', 'ok');
  renderProjeto(_pj.projeto.id);
}

function vincularRegras(){
  document.querySelectorAll('#stage .sig-card').forEach(el => {
    el.addEventListener('click', () => salvarSigilo(el.dataset.sig));
  });
  const btn = document.getElementById('bl-add');
  if (btn) btn.addEventListener('click', adicionarBlacklist);
}

async function salvarSigilo(chave){
  const id = _pj.projeto.id;
  if (_pj.projeto.nivel_sigilo === chave) return;
  const { error } = await sb.from('va_projetos').update({ nivel_sigilo: chave }).eq('id', id);
  if (error) { toast('Falhou: ' + error.message, 'err'); return; }
  patchProjetoLocal({ nivel_sigilo: chave });
  toast('Sigilo salvo', 'ok');
  desenhaAba();
}

async function adicionarBlacklist(){
  const id = _pj.projeto.id;
  const nome = document.getElementById('bl-nome').value.trim();
  const cnpj = document.getElementById('bl-cnpj').value.trim();
  const tel  = document.getElementById('bl-tel').value.replace(/\D/g,'');
  const mot  = document.getElementById('bl-mot').value.trim();
  if (!nome && !cnpj && !tel) { toast('Preencha nome, CNPJ ou telefone', 'err'); return; }
  const payload = { projeto_id: id, nome: nome||null, cnpj: cnpj||null, telefone: tel||null, motivo: mot||null };
  const { data, error } = await sb.from('va_projeto_blacklist').insert(payload).select('*').single();
  if (error) { toast('Falhou: ' + error.message, 'err'); return; }
  _pj.blacklist.unshift(data);
  toast('Bloqueio adicionado', 'ok');
  desenhaAba();
}

async function removerBlacklist(id){
  if (!confirm('Remover este bloqueio?')) return;
  const { error } = await sb.from('va_projeto_blacklist').delete().eq('id', id);
  if (error) { toast('Falhou: ' + error.message, 'err'); return; }
  _pj.blacklist = _pj.blacklist.filter(b => b.id !== id);
  toast('Removido', 'ok');
  desenhaAba();
}

// ─── ETAPA: LAUDO ────────────────────────────────────────────────

  const p = _pj.projeto;
  const ok = e.status === 'concluida';
  const vc = p.valor_avaliacao, vmin = p.valor_avaliacao_min, vmax = p.valor_avaliacao_max;

  const faixa = completo ? `

  return `
    <div class="stage-head">
      <div>
        <div class="meta">Etapa ${e.ordem}/15 · ${esc(e.responsavel||'—')}</div>

        <div class="muted" style="margin-top:6px;font-size:13.5px">Prevista para <strong style="color:var(--ink-2)">${dataBR(e.data_prevista)}</strong>${e.data_real ? ' · concluída em '+dataBR(e.data_real) : ''}</div>
      </div>

        ${ok ? '↻ Reabrir' : '✓ Concluir etapa'}

      <div class="lbl">avaliação</div>
      <h3>Faixa de valor do negócio</h3>
      <p class="motivo">A faixa é o que sustenta a negociação. Valor único vira posição; faixa vira argumento.</p>

      <div class="laudo-grid" style="margin-top:14px">
        <div class="fld"><span class="lbl">mínima (R$)</span><input type="number" min="0" step="1000" id="la-min" value="${vmin ?? ''}" placeholder="ex: 400000"></div>
        <div class="fld"><span class="lbl">central (R$) · destaque</span><input type="number" min="0" step="1000" id="la-central" value="${vc ?? ''}" placeholder="ex: 500000" class="laudo-central"></div>

function vincularLaudo(){
  const map = { 'la-min':'valor_avaliacao_min', 'la-central':'valor_avaliacao', 'la-max':'valor_avaliacao_max' };
  Object.keys(map).forEach(id => {

    el.addEventListener('blur', () => salvarLaudoCampo(map[id], el.value));
  });
}

async function salvarLaudoCampo(campo, raw){
  const val = (raw==='' || raw==null) ? null : Number(raw);
  if (val != null && !isFinite(val)) { toast('Valor inválido', 'err'); return; }
  if (_pj.projeto[campo] === val) return;
  const id = _pj.projeto.id;
  const patch = {}; patch[campo] = val;
  const { error } = await sb.from('va_projetos').update(patch).eq('id', id);
  if (error) { toast('Falhou: ' + error.message, 'err'); return; }
  patchProjetoLocal(patch);
  toast('Salvo', 'ok');
  await checarAutoConclusao('laudo');
  // se ainda não auto-completou mas os 3 estão preenchidos → mostra faixa
  if (_pj.projeto.valor_avaliacao != null && _pj.projeto.valor_avaliacao_min != null && _pj.projeto.valor_avaliacao_max != null) {
    if (_abaChave === 'laudo') desenhaAba();
  }
}

// ─── ETAPA: PREÇO ────────────────────────────────────────────────
const DECIDIDO_OPCOES = [
  { v:'cliente_conforme',  l:'cliente, de acordo com a recomendação' },
  { v:'cliente_contra',    l:'cliente, contra a recomendação' },
  { v:'em_conjunto',       l:'definido em conjunto' },
];

function htmlPreco(e){
  const p = _pj.projeto;
  const ok = e.status === 'concluida';

  if (p.valor_avaliacao == null) {
    return `
      <div class="stage-head">
        <div>
          <div class="meta">Etapa ${e.ordem}/15 · ${esc(e.responsavel||'—')}</div>
          <h2>${esc(e.titulo)}</h2>
          <div class="muted" style="margin-top:6px;font-size:13.5px">Prevista para <strong style="color:var(--ink-2)">${dataBR(e.data_prevista)}</strong></div>
        </div>
      </div>
      <div class="k-card" style="text-align:center;padding:44px 30px">
        <div class="lbl" style="margin-bottom:12px">bloqueado</div>
        <h3>Defina a faixa de avaliação primeiro</h3>
        <p class="motivo" style="margin:10px auto 20px;max-width:440px">Sem valor de referência não há como decidir preço nem calcular desvio.</p>
        <button class="btn btn-primary" onclick="trocarAba('laudo')">Ir para etapa laudo →</button>
      </div>`;
  }

  const vv  = p.valor_venda;
  const vd  = p.valor_venda_decidido_por || '';
  const vj  = p.valor_venda_justificativa || '';
  const vc  = Number(p.valor_avaliacao) || 0;
  const cpc = Number(p.comissao_percent) || 0;

  const completo = vv != null && !!vd && !!vj.trim();

  let desvioHtml = '';
  if (vv != null && vc > 0) {
    const desvio = ((vv - vc) / vc) * 100;
    const cls = Math.abs(desvio) < 1 ? 'desvio-neutro' : (desvio > 0 ? 'desvio-pos' : 'desvio-neg');
    const sinal = desvio > 0 ? '+' : (desvio < 0 ? '' : '');
    desvioHtml = `
      <div class="desvio-box">
        <div>
          <div class="lbl">Desvio vs central</div>
          <div class="muted" style="margin-top:2px;font-size:12px">Central era ${brlNice(vc)}</div>
        </div>
        <div class="desvio-val ${cls}">${sinal}${desvio.toFixed(1).replace('.',',')}%</div>
      </div>
      ${desvio > 10 ? `<div class="aviso">Preço <strong>acima da faixa</strong>. Registre a justificativa — é o que transforma a conversa do dia 60 em replanejamento em vez de discussão.</div>` : ''}`;
  }

  const comissaoProj = vv != null ? vv * (cpc/100) : null;

  return `
    <div class="stage-head">
      <div>
        <div class="meta">Etapa ${e.ordem}/15 · ${esc(e.responsavel||'—')}</div>
        <h2>${esc(e.titulo)}</h2>
        <div class="muted" style="margin-top:6px;font-size:13.5px">Prevista para <strong style="color:var(--ink-2)">${dataBR(e.data_prevista)}</strong>${e.data_real ? ' · concluída em '+dataBR(e.data_real) : ''}</div>
      </div>
      <button class="btn ${ok?'btn-ghost':'btn-primary'}" ${completo||ok?'':'disabled title="Preencha valor, decisor e justificativa"'} onclick="toggleEtapa('${e.id}',${ok?'true':'false'})">
        ${ok ? '↻ Reabrir' : '✓ Concluir etapa'}
      </button>
    </div>

    <div class="k-card">
      <div class="lbl">01 · valor</div>
      <h3>Preço de venda decidido</h3>
      <p class="motivo">A recomendação está em ${brlNice(vc)}. Você pode ficar dentro, acima ou abaixo — o que importa é registrar por quê.</p>

      <div class="form-grid" style="margin-top:14px">
        <div class="fld"><span class="lbl">valor de venda (R$)</span><input type="number" min="0" step="1000" id="pr-valor" value="${vv ?? ''}" placeholder="ex: 550000"></div>
        <div class="fld"><span class="lbl">decisão</span>
          <select id="pr-decidido">
            <option value="">— escolher —</option>
            ${DECIDIDO_OPCOES.map(o => `<option value="${o.v}" ${vd===o.v?'selected':''}>${esc(o.l)}</option>`).join('')}
          </select>
        </div>
      </div>

      ${desvioHtml}
    </div>

    <div class="k-card">
      <div class="lbl">02 · justificativa</div>
      <h3>Por que esse valor</h3>
      <p class="motivo">O que sustenta esse preço no mercado — comparativos, urgência, ativos, potencial. É esse texto que o cliente relê no dia 60.</p>
      <textarea id="pr-just" rows="5" placeholder="Ex: preço 10% acima da faixa por conta de ponto comercial em rota crescente + contrato de aluguel prorrogado por 5 anos…">${esc(vj)}</textarea>
    </div>

    ${comissaoProj != null ? `
      <div class="k-card" style="background:linear-gradient(135deg,rgba(10,157,85,.05),transparent)">
        <div class="lbl">projeção</div>
        <div class="row" style="justify-content:space-between;margin-top:6px">
          <div>
            <div class="h3">Comissão projetada</div>
            <div class="muted" style="margin-top:4px;font-size:12.5px">${brlNice(vv)} × ${String(cpc).replace('.',',')}%</div>
          </div>
          <div class="calc-val big">${brlNice(comissaoProj)}</div>
        </div>
      </div>` : ''}`;
}

function vincularPreco(){
  const v = document.getElementById('pr-valor');
  const d = document.getElementById('pr-decidido');
  const j = document.getElementById('pr-just');
  if (v) v.addEventListener('blur', () => salvarPrecoCampo('valor_venda', v.value));
  if (d) d.addEventListener('change', () => salvarPrecoCampo('valor_venda_decidido_por', d.value));
  if (j) j.addEventListener('blur', () => salvarPrecoCampo('valor_venda_justificativa', j.value));
}

async function salvarPrecoCampo(campo, raw){
  let val;
  if (campo === 'valor_venda') {
    val = (raw==='' || raw==null) ? null : Number(raw);
    if (val != null && !isFinite(val)) { toast('Valor inválido', 'err'); return; }
  } else {
    val = (raw||'').trim() || null;
  }
  if (_pj.projeto[campo] === val) return;
  const id = _pj.projeto.id;
  const patch = {}; patch[campo] = val;
  const { error } = await sb.from('va_projetos').update(patch).eq('id', id);
  if (error) { toast('Falhou: ' + error.message, 'err'); return; }
  patchProjetoLocal(patch);
  toast('Salvo', 'ok');
  await checarAutoConclusao('preco');
  if (_abaChave === 'preco') desenhaAba();
}

const _arqExpanded = new Set(); // codigos com orientação expandida

function htmlArquetipos(e){
  const ok = e.status === 'concluida';
  const catalogo = _pj.catalogo || [];
  const selecionados = _pj.arquetipos || [];
  const selMap = new Map(selecionados.map(a => [a.codigo, a]));
  const qtd = selecionados.length;
  const avisoDemais = qtd > 5 ? `<div class="aviso" style="margin-top:12px">Matriz com muitos alvos é matriz sem alvo. Recomendado 3 a 5.</div>` : '';

  const cards = catalogo.map(c => {
    const on = selMap.has(c.codigo);
    return `
      <button type="button" class="arq-card ${on?'on':''}" data-arq="${esc(c.codigo)}">
        <span class="arq-selo ${esc(c.captavel_por||'')}">${esc(c.captavel_por||'—')}</span>

    const expanded = _arqExpanded.has(a.codigo);
    return `
      <div class="arq-linha">
        <div class="arq-linha-head">
          <div><span class="arq-linha-cd">${esc(a.codigo)}</span> <span class="arq-linha-nm">${esc(c.nome||a.codigo)}</span></div>
          <span class="arq-selo ${esc(c.captavel_por||'')}" style="position:static">${esc(c.captavel_por||'—')}</span>

          <div class="fld"><span class="lbl">meta/onda</span><input type="number" min="0" step="10" data-arqid="${esc(a.id)}" data-campo="meta_contatos_onda" value="${a.meta_contatos_onda ?? ''}"></div>
          <div class="fld"><span class="lbl">queries de busca (separadas por vírgula)</span><input type="text" data-arqid="${esc(a.id)}" data-campo="queries_busca" value="${esc(qStr)}" placeholder="ex: clínica odontológica florianópolis, consultório dentista sc"></div>
        </div>
        <div class="fld"><span class="lbl">observação</span><textarea rows="2" data-arqid="${esc(a.id)}" data-campo="observacao" placeholder="notas específicas deste arquétipo neste projeto">${esc(a.observacao||'')}</textarea></div>
        <button class="arq-toggle" data-toggle-arq="${esc(a.codigo)}">${expanded?'esconder':'mostrar'} orientação do catálogo ${expanded?'▲':'▼'}</button>
        ${expanded ? `
          <div class="arq-orient">
            <dl>
              <dt>onde achar</dt><dd>${esc(c.onde_achar||'—')}</dd>
              <dt>mensagem</dt><dd>${esc(c.mensagem||'—')}</dd>
              <dt>múltiplo</dt><dd>${esc(c.multiplo||'—')}</dd>
              <dt>conversão</dt><dd>${esc(c.conversao||'—')}</dd>
              <dt>risco</dt><dd>${esc(c.risco||'—')}</dd>
            </dl>

  return `

      <div>
        <div class="meta">Etapa ${e.ordem}/15 · ${esc(e.responsavel||'—')}</div>
        <h2>${esc(e.titulo)}</h2>
        <div class="muted" style="margin-top:6px;font-size:13.5px">Prevista para <strong style="color:var(--ink-2)">${dataBR(e.data_prevista)}</strong>${e.data_real ? ' · concluída em '+dataBR(e.data_real) : ''}</div>
      </div>
      <button class="btn ${ok?'btn-ghost':'btn-primary'}" onclick="toggleEtapa('${e.id}',${ok?'true':'false'})">
        ${ok ? '↻ Reabrir' : '✓ Concluir etapa'}
      </button>
    </div>

    <div class="k-card">

      <h3>Quem pode comprar esse negócio</h3>
      <p class="motivo">Clique nos arquétipos que fazem sentido pra este projeto. Cada seleção vira uma frente de captação.</p>
      <div class="arq-grid" style="margin-top:14px">${cards}</div>
      ${avisoDemais}

    <div class="k-card">
      <div class="lbl">02 · calibragem</div>
      <h3>Prioridade, meta e queries por arquétipo</h3>

      ${avisoSemQuery}

function vincularArquetipos(){
  document.querySelectorAll('#stage .arq-card').forEach(el => {
    el.addEventListener('click', () => toggleArquetipo(el.dataset.arq));
  });
  document.querySelectorAll('#stage input[data-arqid], #stage textarea[data-arqid]').forEach(el => {
    el.addEventListener('blur', () => salvarCampoArq(el.dataset.arqid, el.dataset.campo, el.value));
  });
  document.querySelectorAll('#stage [data-toggle-arq]').forEach(el => {
    el.addEventListener('click', () => {
      const c = el.dataset.toggleArq;
      if (_arqExpanded.has(c)) _arqExpanded.delete(c); else _arqExpanded.add(c);
      desenhaAba();
    });
  });
}

async function toggleArquetipo(codigo){
  const id = _pj.projeto.id;
  const existente = _pj.arquetipos.find(a => a.codigo === codigo);
  if (existente) {
    const { error } = await sb.from('va_projeto_arquetipos').delete().eq('id', existente.id);
    if (error) { toast('Falhou: ' + error.message, 'err'); return; }
    _pj.arquetipos = _pj.arquetipos.filter(a => a.id !== existente.id);
    toast('Removido', 'ok');
  } else {
    const { data, error } = await sb.from('va_projeto_arquetipos')
      .insert({ projeto_id: id, codigo, ativo: true })
      .select('*').single();
    if (error) { toast('Falhou: ' + error.message, 'err'); return; }
    _pj.arquetipos.push(data);
    toast('Adicionado', 'ok');
  }
  await checarAutoConclusao('arquetipos');
  desenhaAba();
}

async function salvarCampoArq(arqId, campo, raw){
  const a = _pj.arquetipos.find(x => x.id === arqId);
  if (!a) return;
  let val;
  if (campo === 'queries_busca') {
    val = (raw||'').split(',').map(s => s.trim()).filter(Boolean);
    if (val.length === 0) val = null;
  } else if (campo === 'prioridade' || campo === 'meta_contatos_onda') {
    val = raw === '' ? null : Number(raw);
    if (val != null && !isFinite(val)) { toast('Valor inválido', 'err'); return; }
  } else {
    val = (raw||'').trim() || null;
  }
  const atual = a[campo];
  const igual = Array.isArray(atual) && Array.isArray(val)
    ? atual.length === val.length && atual.every((x,i) => x === val[i])
    : atual === val || (atual == null && val == null);
  if (igual) return;
  const patch = {}; patch[campo] = val;
  const { error } = await sb.from('va_projeto_arquetipos').update(patch).eq('id', arqId);
  if (error) { toast('Falhou: ' + error.message, 'err'); return; }
  a[campo] = val;
  toast('Salvo', 'ok');
  await checarAutoConclusao('arquetipos');
  if (campo === 'queries_busca') desenhaAba(); // atualiza aviso vermelho
}

      <div>

function itemAnx(a){
  const tam = a.tipo === 'arquivo' ? fmtTam(a.tamanho_bytes) : '—';
  const link = a.tipo === 'link'
    ? `<a href="${esc(a.url_externa)}" target="_blank" rel="noopener" title="abrir">↗</a>`
    : '';
  const badgeLink = a.tipo === 'link' ? '<span class="badge-link">link</span>' : '';
  const optionsVis = Object.entries(VIS_LBL).map(([v,l]) => `<option value="${v}" ${a.visibilidade===v?'selected':''}>${l}</option>`).join('');
  const aprovAlerta = a.visibilidade === 'publico' && !a.aprovado_admin
    ? '<span class="aprov-alert">aguardando sua aprovação</span>'
    : '';
  const aprovToggle = a.visibilidade === 'publico'
    ? `<label class="aprov-toggle"><input type="checkbox" ${a.aprovado_admin?'checked':''} data-anx-aprov="${esc(a.id)}"> aprovado</label>`
    : '';
  return `
    <div class="anx-item">
      <div class="anx-nome" title="${esc(a.nome)}">${esc(a.nome)}${badgeLink} ${link}</div>
      <div class="anx-tam">${tam}</div>
      <div>
        <select class="anx-vis" data-anx-vis="${esc(a.id)}">${optionsVis}</select>
        ${aprovAlerta} ${aprovToggle}
      </div>
      <button class="btn btn-ghost btn-sm" onclick="removerAnexo('${a.id}')">remover</button>
    </div>`;
}

function fmtTam(bytes){
  if (!bytes) return '—';
  const kb = bytes/1024;
  if (kb < 1024) return kb.toFixed(0)+' KB';
  return (kb/1024).toFixed(1).replace('.',',')+' MB';
}

function vincularAnexos(){
  document.querySelectorAll('#stage .anx-tab button').forEach(el => {
    el.addEventListener('click', () => { _anxTipo = el.dataset.tipo; desenhaAba(); });
  });
  const bf = document.getElementById('anx-add-file');
  if (bf) bf.addEventListener('click', enviarAnexoArquivo);
  const bl = document.getElementById('anx-add-link');
  if (bl) bl.addEventListener('click', adicionarAnexoLink);

  document.querySelectorAll('#stage [data-anx-vis]').forEach(el => {
    el.addEventListener('change', () => atualizarAnexo(el.dataset.anxVis, { visibilidade: el.value, aprovado_admin: false }));
  });
  document.querySelectorAll('#stage [data-anx-aprov]').forEach(el => {
    el.addEventListener('change', () => atualizarAnexo(el.dataset.anxAprov, { aprovado_admin: el.checked }));
  });
}

async function enviarAnexoArquivo(){
  const fileInput = document.getElementById('anx-file');
  const cat = document.getElementById('anx-cat').value;
  const vis = document.getElementById('anx-vis').value;
  if (!fileInput.files.length) { toast('Escolha um arquivo', 'err'); return; }
  const f = fileInput.files[0];
  const id = _pj.projeto.id;
  const uid = (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36));
  const safeName = f.name.replace(/[^\w.-]+/g,'_');
  const path = `${id}/${uid}-${safeName}`;

  const btn = document.getElementById('anx-add-file');
  btn.disabled = true; btn.textContent = 'enviando…';

  const { error: upErr } = await sb.storage.from('projeto-anexos').upload(path, f, { upsert: false });
  if (upErr) { toast('Upload falhou: ' + upErr.message, 'err'); btn.disabled = false; btn.textContent = 'enviar'; return; }

  const { data, error } = await sb.from('va_projeto_anexos').insert({
    projeto_id: id, categoria: cat, nome: f.name, tipo: 'arquivo',
    storage_path: path, visibilidade: vis, tamanho_bytes: f.size,
  }).select('*').single();
  btn.disabled = false; btn.textContent = 'enviar';
  if (error) { toast('Registro falhou: ' + error.message, 'err'); return; }
  _pj.anexos.unshift(data);
  toast('Anexo enviado', 'ok');
  desenhaAba();
}

async function adicionarAnexoLink(){
  const url = document.getElementById('anx-url').value.trim();
  const nome = document.getElementById('anx-nome').value.trim();
  const cat = document.getElementById('anx-cat-l').value;
  const vis = document.getElementById('anx-vis-l').value;
  if (!url || !nome) { toast('URL e nome obrigatórios', 'err'); return; }
  const id = _pj.projeto.id;
  const { data, error } = await sb.from('va_projeto_anexos').insert({
    projeto_id: id, categoria: cat, nome, tipo: 'link',
    url_externa: url, visibilidade: vis,
  }).select('*').single();
  if (error) { toast('Falhou: ' + error.message, 'err'); return; }
  _pj.anexos.unshift(data);
  toast('Link adicionado', 'ok');
  desenhaAba();
}

async function atualizarAnexo(id, patch){
  const { error } = await sb.from('va_projeto_anexos').update(patch).eq('id', id);
  if (error) { toast('Falhou: ' + error.message, 'err'); return; }
  const a = _pj.anexos.find(x => x.id === id);
  if (a) Object.assign(a, patch);
  toast('Salvo', 'ok');
  desenhaAba();
}

async function removerAnexo(id){
  if (!confirm('Remover este anexo?')) return;
  const a = _pj.anexos.find(x => x.id === id);
  if (a && a.tipo === 'arquivo' && a.storage_path) {
    const { error: sErr } = await sb.storage.from('projeto-anexos').remove([a.storage_path]);
    if (sErr) { toast('Storage: ' + sErr.message, 'err'); /* segue mesmo assim */ }
  }
  const { error } = await sb.from('va_projeto_anexos').delete().eq('id', id);
  if (error) { toast('Falhou: ' + error.message, 'err'); return; }
  _pj.anexos = _pj.anexos.filter(x => x.id !== id);
  toast('Removido', 'ok');
  desenhaAba();
}

const TS_STATUS_LBL = { rascunho:'rascunho', aguardando_aprovacao:'aguardando aprovação', aprovado:'aprovado', recusado:'recusado' };

function selecionarTeaser(){
  const teasers = _pj.teasers || [];
  if (_pj.teaserSel && teasers.find(v => v.id === _pj.teaserSel)) return teasers.find(v => v.id === _pj.teaserSel);
  const naoAprov = teasers.find(v => v.status !== 'aprovado');
  if (naoAprov) { _pj.teaserSel = naoAprov.id; return naoAprov; }
  if (teasers[0]) { _pj.teaserSel = teasers[0].id; return teasers[0]; }
  return null;
}

function vincularTeaser(){
  document.querySelectorAll('#stage [data-ts-sel]').forEach(el => {
    el.addEventListener('click', () => { _pj.teaserSel = el.dataset.tsSel; desenhaAba(); });
  });
  const bn = document.getElementById('ts-nova');
  if (bn) bn.addEventListener('click', novaVersaoTeaser);
  const bs = document.getElementById('ts-salvar');
  if (bs) bs.addEventListener('click', salvarTeaserTexto);
  const bag = document.getElementById('ts-aguardando');
  if (bag) bag.addEventListener('click', () => mudarStatusTeaser('aguardando_aprovacao'));
  const bap = document.getElementById('ts-aprovar');
  if (bap) bap.addEventListener('click', () => mudarStatusTeaser('aprovado'));
  const brc = document.getElementById('ts-recusar');
  if (brc) brc.addEventListener('click', () => mudarStatusTeaser('recusado'));
}

async function novaVersaoTeaser(){
  const id = _pj.projeto.id;
  const teasers = _pj.teasers || [];
  const proximaVersao = teasers.length ? Math.max(...teasers.map(v => v.versao)) + 1 : 1;
  const { data, error } = await sb.from('va_projeto_teaser')
    .insert({ projeto_id: id, versao: proximaVersao, texto: '', status: 'rascunho' })
    .select('*').single();
  if (error) { toast('Falhou: ' + error.message, 'err'); return; }
  _pj.teasers.unshift(data);
  _pj.teaserSel = data.id;
  toast('Versão ' + proximaVersao + ' criada', 'ok');
  desenhaAba();
}

async function salvarTeaserTexto(){
  const sel = _pj.teasers.find(v => v.id === _pj.teaserSel);
  if (!sel) return;
  const el = document.getElementById('ts-texto');
  if (!el) return;
  const novo = el.value;
  if (novo === (sel.texto||'')) { toast('Sem alterações', 'ok'); return; }
  const { error } = await sb.from('va_projeto_teaser').update({ texto: novo }).eq('id', sel.id);
  if (error) { toast('Falhou: ' + error.message, 'err'); return; }
  sel.texto = novo;
  toast('Salvo', 'ok');
}

async function mudarStatusTeaser(novo){
  const sel = _pj.teasers.find(v => v.id === _pj.teaserSel);
  if (!sel) return;
  // salva texto atual junto se mudou
  const el = document.getElementById('ts-texto');
  const textoAtual = el ? el.value : sel.texto;
  const patch = { status: novo, texto: textoAtual };
  if (novo === 'aprovado') patch.aprovado_em = new Date().toISOString();
  const { error } = await sb.from('va_projeto_teaser').update(patch).eq('id', sel.id);
  if (error) { toast('Falhou: ' + error.message, 'err'); return; }
  Object.assign(sel, patch);
  toast('Status: ' + (TS_STATUS_LBL[novo]||novo), 'ok');
  await checarAutoConclusao('teaser');
  desenhaAba();
}

      <h3>Números da onda</h3>
      <div class="orc-resumo">
        <div class="orc-kpi"><div class="k">Contrato</div><div class="v">${brlNice(f.contrato_total)}</div></div>
        <div class="orc-kpi"><div class="k">Total pago</div><div class="v">${brlNice(f.total_pago)}</div></div>
        <div class="orc-kpi destaque"><div class="k">Crédito liberado</div><div class="v">${brlNice(f.credito_liberado)}</div></div>
        <div class="orc-kpi"><div class="k">Consumido</div><div class="v">${brlNice(f.consumido)}</div></div>
        <div class="orc-kpi"><div class="k">Saldo</div><div class="v" style="color:${Number(f.saldo)>=0?'var(--ink)':'var(--danger)'}">${brlNice(f.saldo)}</div></div>
      </div>
      <div class="orc-apropriacao">
        <span><b>Impostos 20%:</b> ${brlNice(f.apropriacao_impostos)}</span>
        <span><b>Gestão 30%:</b> ${brlNice(f.apropriacao_gestao)}</span>
        <span class="warn">apropriação · não visível ao cliente</span>
      </div>
    </div>`;
}

// ─── CARD 2 · RITMO ──────────────────────────────────────────────
function cardRitmo(f){
  const credito = Number(f.credito_liberado) || 0;
  const consumido = Number(f.consumido) || 0;
  const esperado = Number(f.consumo_esperado) || 0;
  const desvio = Number(f.desvio_ritmo) || 0; // positivo = atrasado
  const atrasoPct = credito > 0 ? (desvio / credito) * 100 : 0;
  let cls = 'ok', label = 'no ritmo';
  if (atrasoPct > 30)      { cls = 'at2'; label = 'consumo muito atrasado'; }
  else if (atrasoPct > 15) { cls = 'at';  label = 'consumo atrasado'; }
  const consPct = credito > 0 ? Math.min((consumido/credito)*100, 100) : 0;
  const espPct  = credito > 0 ? Math.min((esperado /credito)*100, 100) : 0;
  return `
    <div class="k-card">
      <div class="lbl">02 · ritmo de consumo</div>
      <h3>Consumir o crédito é obrigação nossa</h3>
      <p class="motivo">Saldo acumulado não é folga — é entrega devendo. Alerta é por sub-consumo.</p>
      <div class="ritmo-bar">
        <div class="ritmo-cons ${cls==='ok'?'':cls}" style="width:${consPct.toFixed(1)}%"></div>
        <div class="ritmo-marker" style="left:${espPct.toFixed(1)}%" title="esperado ${brlNice(esperado)}"></div>
      </div>
      <div class="ritmo-labels">
        <span>consumido ${brlNice(consumido)}</span>
        <span>esperado hoje ${brlNice(esperado)}</span>
        <span>crédito ${brlNice(credito)}</span>
      </div>
      <div class="row" style="justify-content:space-between;margin-top:12px;flex-wrap:wrap;gap:10px">
        <span class="ritmo-status ${cls}">${label} · desvio ${brlNice(Math.abs(desvio))}</span>
        <span class="mono" style="font-size:11.5px;color:var(--ink-3)">ritmo alvo · <strong style="color:var(--ink)">${brlNice(f.ritmo_alvo_diario)}/dia</strong> · ${f.dias_decorridos} de ${f.dias_onda} dias</span>
      </div>
    </div>`;
}

// ─── CARD 3 · PLANO ──────────────────────────────────────────────
function realizadoPorTipo(){
  const m = {};
  (_pj.razao || []).forEach(r => {
    if (!m[r.tipo]) m[r.tipo] = { qtd:0, valor:0 };
    m[r.tipo].qtd += Number(r.quantidade)||0;
    m[r.tipo].valor += Number(r.valor_total)||0;
  });
  return m;
}

function cardPlano(f){
  const plano = _pj.plano || [];
  const precos = (_pj.precos || []).filter(p => p.ativo);
  const p = _pj.projeto;
  const creditoOnda = (Number(p.valor_mensal)||0) * (Number(p.fidelidade_meses)||0) * 0.5;
  const previsto = Number(f.previsto_onda) || 0;
  const realiz = realizadoPorTipo();

  let aviso = '';
  if (creditoOnda > 0) {
    if (previsto > creditoOnda) aviso = '<div class="aviso">Plano excede o crédito da onda · orça mais do que temos pra executar.</div>';
    else if (previsto > 0 && previsto < creditoOnda * 0.9) aviso = '<div class="aviso">Onda com crédito sem destino definido · falta ~' + brlNice(creditoOnda - previsto) + '.</div>';
  }

  const linhasPlano = plano.length ? plano.map(pl => {
    const pi = precoInfo(pl.tipo) || {};
    const r = realiz[pl.tipo] || { qtd:0, valor:0 };
    const meta = Number(pl.meta_quantidade) || 0;
    const pct = meta > 0 ? Math.min((r.qtd/meta)*100, 200) : 0;
    const estourou = meta > 0 && r.qtd > meta;
    return `
      <tr class="${estourou?'tipo-estourado':''}">
        <td>${esc(pi.rotulo || pl.tipo)} <div class="muted mono" style="font-size:10px;margin-top:2px">${esc(pl.natureza)}</div></td>
        <td class="num">${Number(meta).toLocaleString('pt-BR')}</td>
        <td class="num">${brlNice(pl.preco_unitario_previsto)}</td>
        <td class="num">${brlNice(pl.valor_previsto)}</td>
        <td>
          <div class="orc-plano-prog">
            <span class="mono" style="font-size:10.5px;color:var(--ink-2);min-width:70px">${Number(r.qtd).toLocaleString('pt-BR')}${meta>0?' / '+Number(meta).toLocaleString('pt-BR'):''}</span>
            <div class="orc-plano-prog-bar"><span class="${estourou?'stopa':''}" style="width:${Math.min(pct,100).toFixed(0)}%"></span></div>
            <span class="orc-plano-prog-pct">${meta>0?pct.toFixed(0)+'%':'—'}</span>
          </div>
        </td>
        <td><button class="btn btn-ghost btn-sm" onclick="removerLinhaPlano('${pl.id}')">×</button></td>
      </tr>`;
  }).join('') : '<tr><td colspan="6" style="text-align:center;color:var(--ink-3);font-style:italic;padding:16px">Nenhuma linha no plano ainda. Adicione abaixo.</td></tr>';

  const opts = precos.map(pi => `<option value="${esc(pi.tipo)}" data-preco="${pi.preco}">${esc(pi.rotulo)}${Number(pi.preco)===0?' (a definir)':''}</option>`).join('');

  return `
    <div class="k-card">
      <div class="lbl">03 · plano da onda</div>
      <h3>Meta prevista de execução</h3>
      <p class="motivo">Preço é congelado ao adicionar. Recorrente multiplica por ${p.fidelidade_meses} meses.</p>

      <table class="orc-tab">
        <thead><tr>
          <th>tipo</th><th class="num">meta</th><th class="num">preço</th><th class="num">previsto</th><th>realizado</th><th></th>
        </tr></thead>
        <tbody>${linhasPlano}</tbody>
        <tfoot><tr>
          <td colspan="3">Total previsto na onda</td>
          <td class="num">${brlNice(previsto)}</td>
          <td colspan="2" class="num">crédito da onda ${brlNice(creditoOnda)}</td>
        </tr></tfoot>
      </table>

      ${aviso}

      <div class="orc-adicionar-linha">
        <div class="fld"><span class="lbl">tipo</span><select id="pl-tipo">${opts}</select></div>
        <div class="fld"><span class="lbl">natureza</span><select id="pl-natureza">${NATUREZAS.map(n=>`<option value="${n.v}">${esc(n.l)}</option>`).join('')}</select></div>
        <div class="fld"><span class="lbl">meta qtd</span><input type="number" min="0" step="1" id="pl-meta" value="0"></div>
        <div class="fld"><span class="lbl">observação</span><input type="text" id="pl-obs" placeholder="opcional"></div>
        <button class="btn btn-primary btn-sm" id="pl-add">+ linha</button>
      </div>
    </div>`;
}

// ─── CARD 4 · RAZÃO ──────────────────────────────────────────────
function cardRazao(f){
  const razao = _pj.razao || [];
  const ciclos = Array.from(new Set(razao.map(r => r.ciclo_numero).filter(x => x != null))).sort((a,b)=>a-b);
  const filtro = _pj.razaoFiltroCiclo;
  const filtrada = filtro == null ? razao : razao.filter(r => r.ciclo_numero === filtro);

  const cicloAtual = calcularCicloAtual();
  const jaTemGestao = razao.some(r => r.tipo === 'gestao_mensal' && r.ciclo_numero === cicloAtual);

  const chips = ['todos', ...ciclos].map(c => {
    const isTodos = c === 'todos';
    const on = (isTodos && filtro == null) || (!isTodos && filtro === c);
    return `<button class="ts-versao-chip ${on?'on':''}" onclick="filtrarRazao(${isTodos?'null':c})">${isTodos?'todos':'ciclo '+c}</button>`;
  }).join('');

  const rows = filtrada.length ? filtrada.map(r => {
    const pi = precoInfo(r.tipo) || {};
    return `<tr>
      <td class="mono" style="font-size:11.5px;color:var(--ink-3);white-space:nowrap">${dataBR(r.data)}</td>
      <td>${esc(pi.rotulo || r.tipo)}</td>
      <td>${esc(r.referencia || '—')}</td>
      <td class="num">${Number(r.quantidade).toLocaleString('pt-BR')}</td>
      <td class="num">${brlNice(r.preco_unitario_aplicado)}</td>
      <td class="num" style="font-weight:600">${brlNice(r.valor_total)}</td>
      <td class="num mono" style="color:var(--ink-3)">${r.ciclo_numero ?? '—'}</td>
    </tr>`;
  }).join('') : '<tr><td colspan="7" style="text-align:center;color:var(--ink-3);font-style:italic;padding:16px">Nenhum débito registrado neste filtro.</td></tr>';

  const totalFiltro = filtrada.reduce((s,r) => s + Number(r.valor_total||0), 0);

  return `
    <div class="k-card">
      <div class="lbl">04 · razão</div>
      <h3>Histórico de débitos</h3>
      <div class="row" style="justify-content:space-between;margin-top:10px;flex-wrap:wrap;gap:10px">
        <div class="ts-versoes" style="margin:0">${chips}</div>
        <div class="row" style="gap:8px">
          <button class="btn btn-primary btn-sm" onclick="abrirModalDebito()">+ lançar débito</button>
          <button class="btn btn-ghost btn-sm" ${jaTemGestao?'disabled':''} onclick="lancarGestaoAtual(${cicloAtual})">
            ${jaTemGestao?'gestão do ciclo '+cicloAtual+' lançada':'lançar gestão do ciclo '+cicloAtual}
          </button>
        </div>
      </div>
      <table class="orc-tab">
        <thead><tr>
          <th>data</th><th>tipo</th><th>referência</th><th class="num">qtd</th><th class="num">preço aplicado</th><th class="num">total</th><th class="num">ciclo</th>
        </tr></thead>
        <tbody>${rows}</tbody>
        <tfoot><tr>
          <td colspan="5">Total do filtro</td>
          <td class="num">${brlNice(totalFiltro)}</td><td></td>
        </tr></tfoot>
      </table>
      <div class="orc-nota">Cada linha grava o preço vigente no momento do lançamento. Alterar a tabela de preços não reescreve o histórico.</div>
    </div>`;
}

// ─── CARD 5 · PARCELAS ──────────────────────────────────────────
function cardParcelas(f){
  const parcelas = _pj.parcelas || [];
  const rows = parcelas.map(pa => {
    const cred = Number(pa.valor||0) * 0.5;
    const pago = pa.status === 'pago';
    return `<tr>
      <td class="mono" style="font-weight:600">#${pa.numero}</td>
      <td class="mono" style="color:var(--ink-3)">${dataBR(pa.vencimento)}</td>
      <td class="num">${brlNice(pa.valor)}</td>
      <td class="num" style="color:var(--accent-2);font-weight:600">${brlNice(cred)}</td>
      <td>
        <input type="text" data-parc-obs="${esc(pa.id)}" value="${esc(pa.observacao||'')}" placeholder="observação">
      </td>
      <td>
        <input type="text" data-parc-asaas="${esc(pa.id)}" value="${esc(pa.asaas_cobranca_id||'')}" placeholder="asaas id">
      </td>
      <td>
        <span class="badge ${pago?'ativo':(pa.status==='atrasado'?'setup':'pausado')}">${esc(PARC_STATUS_LBL[pa.status]||pa.status)}</span>
      </td>
      <td>
        ${pago
          ? `<button class="btn btn-ghost btn-sm" onclick="voltarParcela('${pa.id}')">↺ desmarcar</button>`

  }).join('');

  return `

      <div class="lbl">05 · parcelas</div>
      <h3>${parcelas.length} parcela${parcelas.length===1?'':'s'} da onda</h3>
      <p class="motivo">Cada parcela paga libera 50% do valor em crédito executável.</p>
      <table class="orc-tab">
        <thead><tr>
          <th>#</th><th>vencimento</th><th class="num">valor</th><th class="num">crédito liberado</th>
          <th>observação</th><th>asaas cobrança</th><th>status</th><th></th>
        </tr></thead>
        <tbody>${rows || '<tr><td colspan="8" style="text-align:center;color:var(--ink-3);font-style:italic;padding:16px">Sem parcelas.</td></tr>'}</tbody>
      </table>
