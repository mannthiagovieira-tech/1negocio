async function loteGerarAgora(){
  toast('Gerando lote…', 'ok');
  const sess = (await sb.auth.getSession()).data.session;
  const r = await fetch('/api/lote-semanal', {
    method:'POST', headers:{ 'Content-Type':'application/json', Authorization:'Bearer '+(sess?.access_token||'') },
    body: JSON.stringify({ projeto_id: _pj.projeto.id }),
  });
  const d = await r.json();
  if (!r.ok) { toast(d.erro || 'erro', 'err'); return; }
  toast('Lote gerado', 'ok');
  htmlCadencia();
}

async function loteAcao(loteId, acao){
  if (acao === 'aprovar') {
    await sb.from('va_projeto_lote_semanal').update({ status: 'aprovado' }).eq('id', loteId);
    toast('Lote aprovado', 'ok');
  } else if (acao === 'cancelar') {
    if (!confirm('Cancelar este lote?')) return;
    await sb.from('va_projeto_lote_semanal').update({ status: 'cancelado' }).eq('id', loteId);
    toast('Cancelado', 'ok');
  } else if (acao === 'editar') {
    const nova = Number(prompt('Nova quantidade:'));
    if (!nova || nova < 0) return;
    await sb.from('va_projeto_lote_semanal').update({ meta_quantidade: nova }).eq('id', loteId);
    toast('Quantidade atualizada', 'ok');
  } else if (acao === 'regerar') {
    if (!confirm('Regerar lote (recalcula e busca novos leads)?')) return;
    await loteGerarAgora(); return;
  }
  htmlCadencia();
}

async function loteSalvarAviso(loteId){
  const txt = document.getElementById('lote-aviso-'+loteId).value;
  await sb.from('va_projeto_lote_semanal').update({ aviso_texto: txt }).eq('id', loteId);
  toast('Aviso salvo', 'ok');
}

function cardCadEstado(){
  const cad = _pj.cadencia;
  const fila = _pj.fila || [];
  const razao = _pj.razao || [];
  const p = _pj.projeto;

  const hoje = new Date().toISOString().slice(0,10);
  const enviadosHoje = fila.filter(f => f.status==='entregue' && (f.enviado_em||'').slice(0,10) === hoje).length;
  const agendados = fila.filter(f => f.status==='agendado').length;

  // ciclo atual
  const cicloAtual = calcularCicloAtual();
  const disparosCiclo = razao.filter(r => r.tipo === 'disparo_whatsapp' && r.ciclo_numero === cicloAtual).length;
  const meta = cad?.meta_ciclo || 0;
  const restante = Math.max(0, meta - disparosCiclo);
  const porDia = cad?.mensagens_por_dia || 0;
  const diasProjetados = porDia > 0 ? Math.ceil(restante / porDia) : null;
  const dtProj = diasProjetados != null
    ? new Date(Date.now() + diasProjetados*86400000).toLocaleDateString('pt-BR', {day:'2-digit',month:'2-digit'})
    : '—';

  const ativa = !!cad?.ativa;

  return `
    <div class="k-card">
      <div class="lbl" style="display:flex;justify-content:space-between;align-items:center">
        <span>01 · estado</span>
        <label style="display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-family:var(--sans);font-size:13px;color:var(--ink);text-transform:none;letter-spacing:0;font-weight:600">
          <input type="checkbox" id="cad-ativa" ${ativa?'checked':''} style="width:18px;height:18px;accent-color:var(--accent);margin:0">
          cadência ${ativa?'ativa':'inativa'}
        </label>
      </div>
      <div class="orc-resumo" style="margin-top:14px">
        <div class="orc-kpi"><div class="k">enviados hoje</div><div class="v">${enviadosHoje}<span style="font-family:var(--sans);font-size:14px;color:var(--ink-3);font-weight:500"> / ${porDia}</span></div></div>
        <div class="orc-kpi"><div class="k">na fila</div><div class="v">${agendados}</div></div>
        <div class="orc-kpi ${disparosCiclo>=meta?'destaque':''}"><div class="k">ciclo ${cicloAtual}</div><div class="v">${disparosCiclo}<span style="font-family:var(--sans);font-size:14px;color:var(--ink-3);font-weight:500"> / ${meta}</span></div></div>
        <div class="orc-kpi"><div class="k">projeção meta</div><div class="v" style="font-size:16px">${dtProj}</div></div>
      </div>
    </div>`;

function cardCadConfig(){
  const cad = _pj.cadencia || {};
  const DIAS = [['1','seg'],['2','ter'],['3','qua'],['4','qui'],['5','sex'],['6','sáb'],['7','dom']];
  const setDias = new Set((cad.dias_semana || [1,2,3,4,5]).map(String));
  const diasHtml = DIAS.map(([n,l]) => `
    <label class="k-check" style="padding:4px 10px;background:${setDias.has(n)?'var(--accent-soft)':'var(--surface-2)'};border-radius:8px;border:1px solid ${setDias.has(n)?'var(--accent-ring)':'var(--line)'}">
      <input type="checkbox" data-dia="${n}" ${setDias.has(n)?'checked':''}> ${l}
    </label>`).join('');

  const tpls = (_pj.templates || []).filter(t => t.status === 'aprovado');
  const opts = tpls.map(t => `<option value="${esc(t.id)}" ${cad.template_id===t.id?'selected':''}>${esc(t.nome)} · v${t.versao}</option>`).join('');

  // aviso de meta
  const porDia = cad.mensagens_por_dia || 4;
  const meta = cad.meta_ciclo || 50;
  const p = _pj.projeto;
  const fimOnda = new Date(new Date(p.data_inicio).getTime() + (p.fidelidade_meses||3)*30*86400000);
  const hoje = new Date();
  const cicloDiasRestantes = Math.max(0, Math.round((fimOnda - hoje)/86400000));
  const diasUteis = Math.round(cicloDiasRestantes * (setDias.size/7));
  const capacidade = porDia * diasUteis;
  const disparosCiclo = (_pj.razao||[]).filter(r => r.tipo==='disparo_whatsapp' && r.ciclo_numero === calcularCicloAtual()).length;
  const faltamMeta = meta - disparosCiclo;
  let avisoMeta = '';
  if (capacidade < faltamMeta) {
    avisoMeta = `<div class="aviso" style="margin-top:12px">Com ${porDia}/dia em ${diasUteis} dias úteis restantes você entrega ${capacidade}. Faltam ${faltamMeta - capacidade} pra bater a meta.</div>`;
  } else if (capacidade > faltamMeta && faltamMeta > 0) {
    const diasNec = Math.ceil(faltamMeta / porDia);
    const dtMeta = new Date(Date.now() + diasNec*86400000).toLocaleDateString('pt-BR', {day:'2-digit',month:'2-digit'});
    avisoMeta = `<div class="orc-nota" style="margin-top:12px;color:var(--accent-2)">No ritmo atual, meta esgota em <strong>${dtMeta}</strong> (${diasNec} dias).</div>`;
  }

  return `
    <div class="k-card">
      <div class="lbl">02 · configuração</div>
      <h3>Janela e volume</h3>
      <div class="form-grid" style="margin-top:14px">
        <div class="fld"><span class="lbl">mensagens por dia</span><input type="number" min="1" max="200" id="cad-msg" value="${porDia}"></div>
        <div class="fld"><span class="lbl">intervalo mínimo (min)</span><input type="number" min="1" max="1440" id="cad-int" value="${cad.intervalo_minimo_min||60}"></div>
        <div class="fld"><span class="lbl">hora início</span><input type="time" id="cad-ini" value="${(cad.hora_inicio||'09:00:00').slice(0,5)}"></div>
        <div class="fld"><span class="lbl">hora fim</span><input type="time" id="cad-fim" value="${(cad.hora_fim||'18:00:00').slice(0,5)}"></div>
        <div class="fld"><span class="lbl">ordem da fila</span>
          <select id="cad-ordem">
            <option value="fifo" ${cad.ordem_fila==='fifo'?'selected':''}>FIFO (mais antigo primeiro)</option>
            <option value="manual_primeiro" ${cad.ordem_fila==='manual_primeiro'?'selected':''}>Manual primeiro</option>
          </select>
        </div>
        <div class="fld"><span class="lbl">meta do ciclo</span><input type="number" min="1" id="cad-meta" value="${meta}"></div>
        <div class="fld form-full"><span class="lbl">dias da semana</span>
          <div style="display:flex;gap:6px;flex-wrap:wrap">${diasHtml}</div>
        </div>
        <div class="fld form-full"><span class="lbl">template ativo (só aprovados aparecem)</span>
          <select id="cad-tpl">
            <option value="">— nenhum —</option>
            ${opts}
          </select>
        </div>
      </div>
      <div class="row" style="justify-content:flex-end;gap:8px;margin-top:14px">
        <button class="btn btn-primary btn-sm" onclick="salvarCadencia()">💾 salvar</button>
      </div>
      ${avisoMeta}
    </div>`;
}

function vincularCadencia(){
  const ativa = document.getElementById('cad-ativa');
  if (ativa) ativa.addEventListener('change', () => salvarCadenciaCampo('ativa', ativa.checked));
}

async function salvarCadenciaCampo(campo, valor){
  const id = _pj.projeto.id;
  const cad = _pj.cadencia;
  if (campo === 'ativa' && valor && (!cad || !cad.template_id)) {
    toast('Selecione um template aprovado antes de ativar', 'err');
    document.getElementById('cad-ativa').checked = false;
    return;
  }
  if (campo === 'ativa' && valor) {
    // valida que template é aprovado
    const tpl = (_pj.templates||[]).find(t => t.id === cad.template_id);
    if (!tpl || tpl.status !== 'aprovado') {
      toast('Template selecionado não está aprovado', 'err');
      document.getElementById('cad-ativa').checked = false;
      return;
    }
  }
  const patch = {}; patch[campo] = valor;
  patch.atualizado_em = new Date().toISOString();
  const { error } = cad
    ? await sb.from('va_disparo_cadencia').update(patch).eq('projeto_id', id)
    : await sb.from('va_disparo_cadencia').upsert({ projeto_id: id, ...patch });
  if (error) { toast('Falhou: ' + error.message, 'err'); return; }
  toast('Salvo', 'ok');
  await htmlCadencia();
}

async function salvarCadencia(){
  const id = _pj.projeto.id;
  const dias = Array.from(document.querySelectorAll('#stage input[data-dia]:checked')).map(el => Number(el.dataset.dia)).sort();
  const tpl_id = document.getElementById('cad-tpl').value || null;
  // gate: se template escolhido não é aprovado, avisa
  if (tpl_id) {
    const t = (_pj.templates||[]).find(x => x.id === tpl_id);
    if (t && t.status !== 'aprovado') {
      toast('Escolha um template aprovado', 'err');
      return;
    }
  }
  const payload = {
    projeto_id: id,
    ativa: document.getElementById('cad-ativa')?.checked || false,
    mensagens_por_dia: Number(document.getElementById('cad-msg').value)||4,
    intervalo_minimo_min: Number(document.getElementById('cad-int').value)||60,
    hora_inicio: document.getElementById('cad-ini').value + ':00',
    hora_fim:    document.getElementById('cad-fim').value + ':00',
    dias_semana: dias.length ? dias : [1,2,3,4,5],
    ordem_fila: document.getElementById('cad-ordem').value,
    meta_ciclo: Number(document.getElementById('cad-meta').value)||50,
    template_id: tpl_id,
    atualizado_em: new Date().toISOString(),
  };
  const { error } = await sb.from('va_disparo_cadencia').upsert(payload);
  if (error) { toast('Falhou: ' + error.message, 'err'); return; }
  toast('Cadência salva', 'ok');
  await htmlCadencia();
}

async function enfileirar(){

  if (error) { toast('Falhou: ' + error.message, 'err'); return; }
  const r = data || {};
  if (r.status === 'inativa')          { toast('Cadência inativa', 'err'); return; }
  if (r.status === 'sem_saldo')        { toast('Sem saldo de mídia', 'err'); return; }
  if (r.status === 'meta_atingida')    { toast(`Meta do ciclo já atingida (${r.atingido}/${r.meta})`, 'err'); return; }
  if (r.status === 'template_invalido'){ toast('Template não aprovado', 'err'); return; }
  toast(`${r.enfileirados} enfileirados · ${r.bloqueados_blacklist} bloqueados por blacklist`, 'ok');
  await htmlCadencia();
}

// PROCESSAR FILA · chama a edge disparador-rodar-campanha com o JWT
// do admin logado. Credencial Z-API vive só no secret da edge.
async function processarFila(){
  const agora = new Date().toISOString();
  const vencidos = (_pj.fila||[]).filter(f => f.status === 'agendado' && f.agendado_para && f.agendado_para <= agora);
  if (!vencidos.length) { toast('Nenhum item vencido na fila', 'ok'); return; }
  if (!confirm(`Processar ${vencidos.length} disparos agora?`)) return;
  const btn = document.querySelector('#stage button[onclick="processarFila()"]');
  if (btn) { btn.disabled = true; btn.textContent = 'processando…'; }
  const { data, error } = await sb.functions.invoke('disparador-rodar-campanha', {
    body: { action: 'processar_va', projeto_id: _pj.projeto.id }
  });
  if (btn) { btn.disabled = false; btn.textContent = '▶ processar fila agora'; }
  if (error) { toast('Falha ao chamar edge: ' + error.message, 'err'); return; }
  if (data && data.ok === false) { toast('Edge: ' + (data.erro || 'falhou'), 'err'); return; }
  const s = data?.sucessos ?? 0, f = data?.falhas ?? 0, p = data?.processados ?? 0;
  toast(`${p} processados · ${s} sucessos · ${f} falhas`, s>0?'ok':'err');
  await htmlCadencia();
}

      <div class="col" style="gap:10px">

async function salvarAtendimento(){
  const canal = document.getElementById('at-canal').value || null;
  const nome  = document.getElementById('at-nome').value.trim();
  const tel   = document.getElementById('at-tel').value.trim();
  const msg   = document.getElementById('at-msg').value.trim();
  if (!tel) { toast('Telefone obrigatório', 'err'); return; }
  // 1. Cria/vincula contato
  const detalhe = canal ? `atendimento canal ${canal}` : 'atendimento';
  const { data: reg, error: e1 } = await sb.rpc('va_registrar_contato', {
    p_projeto: _pj.projeto.id, p_nome: nome || null, p_telefone: tel,
    p_empresa: null, p_cidade: null, p_origem: 'anuncio',
    p_origem_detalhe: detalhe, p_arquetipo: null, p_debitar: false,
  });
  if (e1) { toast('Falhou: ' + e1.message, 'err'); return; }
  const contatoId = reg?.contato_id;
  // 2. Cria atendimento
  const { error: e2 } = await sb.from('va_atendimentos').insert({
    projeto_id: _pj.projeto.id, contato_id: contatoId,
    canal_sufixo: canal, primeira_mensagem: msg || null,
  });
  if (e2) { toast('Contato ok mas atendimento falhou: ' + e2.message, 'err'); return; }
  fecharModal();
  toast(reg?.status === 'duplicado' ? 'Atendimento registrado (contato já existia)' : 'Atendimento registrado', 'ok');
  await htmlAtendimento();
}

async function gerarNda(){
  const cid = document.getElementById('nda-contato').value;
  if (!cid) { toast('Escolha um contato', 'err'); return; }
  const { data, error } = await sb.rpc('va_gerar_nda', { p_contato: cid });
  if (error) { toast('Falhou: ' + error.message, 'err'); return; }
  toast('NDA gerado', 'ok');
  await htmlAtendimento();
  // copia link automaticamente
  if (data?.link) { try { await navigator.clipboard.writeText(data.link); toast('Link copiado pro clipboard', 'ok'); } catch(_){} }
}

async function liberarCompleto(){
  const cid = document.getElementById('doss-contato').value;
  if (!cid) { toast('Escolha um contato', 'err'); return; }
  const { error } = await sb.rpc('va_liberar_dossie', { p_contato: cid, p_nivel: 'completo' });
  if (error) { toast('Falhou: ' + error.message, 'err'); return; }
  toast('Dossiê completo liberado', 'ok');
  await htmlAtendimento();
}

async function htmlCampanhas(){
  const stage = document.getElementById('stage');
  const id = _pj.projeto.id;
  stage.innerHTML = '<div class="empty"><h2>Carregando campanhas…</h2></div>';
  const [criativos, camps, camp_cri, metricas, desemp, canais] = await Promise.all([
    sb.from('va_criativos').select('*').eq('projeto_id', id).order('criado_em', {ascending:false}),
    sb.from('va_campanhas').select('*').eq('projeto_id', id).order('criado_em', {ascending:false}),
    sb.from('va_campanha_criativos').select('*'),
    sb.from('va_campanha_metricas').select('*').order('data', {ascending:false}).limit(200),
    sb.from('va_projeto_canal_desempenho').select('*').eq('projeto_id', id).order('canal_sufixo'),
    sb.from('va_canais_origem').select('*').eq('projeto_id', id).order('sufixo'),
  ]);
  _pj.criativos = criativos.data || [];
  _pj.campanhas = camps.data || [];
  _pj.campCri = camp_cri.data || [];
  _pj.metricas = metricas.data || [];
  _pj.desempCanal = desemp.data || [];
  _pj.canais = canais.data || _pj.canais || [];
  desenharCampanhas();
}

function cardDesempCanal(){
  const rows = _pj.desempCanal || [];
  if (!rows.length) {
    return `<div class="k-card"><div class="lbl">04 · desempenho por canal</div><h3 class="h3">Sem dados ainda</h3><p class="muted" style="margin-top:8px;font-size:13px">Assim que houver canais + atendimentos + métricas, o custo por interessado aparece aqui.</p></div>`;
  }
  const validos = rows.filter(r => r.custo_por_interessado != null);
  const min = validos.length ? Math.min(...validos.map(r => Number(r.custo_por_interessado))) : null;
  const max = validos.length ? Math.max(...validos.map(r => Number(r.custo_por_interessado))) : null;

  const tr = rows.map(r => {
    const cpi = r.custo_por_interessado != null ? Number(r.custo_por_interessado) : null;
    let cls = '';
    if (cpi != null && validos.length > 1) {
      if (cpi === min) cls = 'style="background:var(--accent-soft)"';
      else if (cpi === max) cls = 'style="background:var(--amber-soft)"';
    }
    return `<tr ${cls}>
      <td><strong>#${esc(r.canal_sufixo)}</strong><div class="muted mono" style="font-size:10px">${esc(r.rotulo)}</div></td>
      <td class="num">${brlNice(r.investido)}</td>
      <td class="num">${r.cliques||0}</td>
      <td class="num">${r.conversas||0}</td>
      <td class="num">${r.contatos_gerados||0}</td>
      <td class="num">${r.interessados||0}</td>
      <td class="num" style="font-family:var(--mono);font-size:12px">${r.custo_por_conversa != null ? brlNice(r.custo_por_conversa) : '—'}</td>
      <td class="num" style="font-family:var(--serif);font-weight:700;font-size:14px;${cpi != null && cpi === min ? 'color:var(--accent-2)' : (cpi != null && cpi === max ? 'color:var(--amber)' : '')}">${cpi != null ? brlNice(cpi) : '—'}</td>
    </tr>`;
  }).join('');

  return `
    <div class="k-card">
      <div class="lbl">04 · desempenho por canal</div>
      <h3>${rows.length} canal${rows.length===1?'':'is'}</h3>
      <table class="orc-tab" style="margin-top:12px">
        <thead><tr>
          <th>canal</th><th class="num">investido</th><th class="num">cliques</th>
          <th class="num">conversas</th><th class="num">contatos</th><th class="num">interessados</th>
          <th class="num">custo/conversa</th><th class="num">custo/interessado</th>
        </tr></thead>
        <tbody>${tr}</tbody>
      </table>
      <div class="orc-nota" style="margin-top:10px">O <strong>custo por interessado</strong> é o número que decide onde colocar a verba do próximo ciclo. Verde é o melhor · âmbar é o pior.</div>
    </div>`;
}

async function salvarCriativo(){
  const nome = document.getElementById('cri-nome').value.trim();
  const tipo = document.getElementById('cri-tipo').value;
  const arq  = document.getElementById('cri-arq').value || null;
  const canal = document.getElementById('cri-canal').value || null;
  if (!nome) { toast('Nome obrigatório', 'err'); return; }
  const { data, error } = await sb.from('va_criativos').insert({
    projeto_id: _pj.projeto.id, nome, tipo,
    arquetipo_codigo: arq, canal_sufixo: canal, status: 'rascunho',
  }).select('id').single();
  if (error) { toast('Falhou: ' + error.message, 'err'); return; }
  // Debita produção
  const tipoDebito = tipo === 'video' ? 'criativo_video' : 'criativo_estatico';
  const { error: eDb } = await sb.rpc('va_debitar', {
    p_projeto: _pj.projeto.id, p_tipo: tipoDebito, p_qtd: 1,
    p_referencia: `Criativo ${nome}`, p_ciclo: null,
  });
  if (eDb) console.warn('débito criativo falhou:', eDb.message);
  toast('Criativo criado (rascunho) · débito ' + tipoDebito, 'ok');
  await htmlCampanhas();
}

async function editarCampanhaCri(campId){
  const camp = (_pj.campanhas||[]).find(x => x.id === campId);
  const cri = _pj.criativos || [];
  const jaVinc = new Set((_pj.campCri||[]).filter(cc => cc.campanha_id === campId).map(cc => cc.criativo_id));
  const chks = cri.length ? cri.map(c => `
    <label class="k-check" style="display:flex;gap:8px;padding:6px 0"><input type="checkbox" data-cri="${esc(c.id)}" ${jaVinc.has(c.id)?'checked':''}> <strong>${esc(c.nome)}</strong> <span style="color:var(--ink-3);font-size:12px">· ${esc(c.status)}</span></label>`).join('') : '<div class="muted" style="font-size:12px;font-style:italic">Nenhum criativo criado ainda.</div>';
  const mb = document.getElementById('modal-back');
  mb.innerHTML = `
    <div class="modal-card" onclick="event.stopPropagation()" style="max-width:520px">
      <div class="lbl">criativos da campanha</div>
      <h3>${esc(camp.nome)}</h3>
      <div class="col" style="gap:4px;margin-top:14px">${chks}</div>
      <div class="row" style="justify-content:flex-end;gap:8px;margin-top:20px">
        <button class="btn btn-ghost btn-sm" onclick="fecharModal()">cancelar</button>
        <button class="btn btn-primary btn-sm" onclick="salvarCampanhaCri('${esc(campId)}')">salvar</button>
      </div>
    </div>`;
  mb.classList.add('on');
}

  const marcados = Array.from(document.querySelectorAll('.modal-card [data-cri]:checked')).map(el => el.dataset.cri);
  // Substitui tudo: delete existentes + insere novos
  await sb.from('va_campanha_criativos').delete().eq('campanha_id', campId);
  if (marcados.length) {
    await sb.from('va_campanha_criativos').insert(marcados.map(cid => ({ campanha_id: campId, criativo_id: cid })));
  }
  fecharModal();
  toast(`${marcados.length} criativo(s) vinculado(s)`, 'ok');
  await htmlCampanhas();
}

async function lancarMetrica(){
  const camp = document.getElementById('met-camp').value;
  const data = document.getElementById('met-data').value;
  const custo = Number(document.getElementById('met-custo').value) || 0;
  const imp = Number(document.getElementById('met-imp').value) || 0;
  const clk = Number(document.getElementById('met-clk').value) || 0;
  if (!camp || !data) { toast('Campanha e data obrigatórios', 'err'); return; }
  const { error } = await sb.rpc('va_lancar_gasto_midia', {

  });
  if (error) { toast('Falhou: ' + error.message, 'err'); return; }
  toast('Métrica lançada · razão debita só o delta', 'ok');
  await htmlCampanhas();
}

  const opts = camps.map(c => `<option value="${esc(c.id)}">${esc(c.nome)}</option>`).join('');

2026-07-29;1600;48;55.00
2026-07-30;900;22;30.00"></textarea>
      </div>
      <div class="row" style="justify-content:flex-end;gap:8px;margin-top:14px">
        <button class="btn btn-ghost btn-sm" onclick="fecharModal()">cancelar</button>
        <button class="btn btn-primary btn-sm" onclick="salvarBulkMetricas()">importar</button>

async function salvarBulkMetricas(){
  const camp = document.getElementById('bk-camp').value;
  const txt = document.getElementById('bk-txt').value.trim();
  if (!camp || !txt) { toast('Escolha campanha e cole linhas', 'err'); return; }
  const linhas = txt.split(/\n/).map(l => l.trim()).filter(Boolean);
  let ok = 0, erro = 0;
  for (const l of linhas) {
    const partes = l.split(/[;\t]/).map(s => s.trim());
    if (partes.length < 4) { erro++; continue; }
    const [data, imp, clk, custo] = partes;
    if (!/^\d{4}-\d{2}-\d{2}$/.test(data)) { erro++; continue; }
    const { error } = await sb.rpc('va_lancar_gasto_midia', {
      p_campanha: camp, p_data: data,
      p_custo: Number(String(custo).replace(',', '.')) || 0,
      p_impressoes: parseInt(imp, 10) || 0,
      p_cliques: parseInt(clk, 10) || 0,
    });
    if (error) erro++; else ok++;
  }
  fecharModal();
  toast(`${ok} lançado(s) · ${erro} erro(s)`, ok>0?'ok':'err');
  await htmlCampanhas();
}

async function cfgRenderEditor(body){
  body.innerHTML = '<div class="muted">carregando…</div>';
  const { data: versoes } = await sb.from('va_precos_versao_uso').select('*').order('numero',{ascending:false});
  if (!versoes || !versoes.length) { body.innerHTML = '<div class="muted">nenhuma versão</div>'; return; }
  if (!_cfgVersaoSel) _cfgVersaoSel = versoes.find(v=>v.vigente)?.id || versoes[0].id;
  const vSel = versoes.find(v => v.id === _cfgVersaoSel) || versoes[0];
  const readOnly = vSel.projetos_ativos > 0;

  const [{ data: cfg }, { data: precos }] = await Promise.all([
    sb.from('va_precos_versao_config').select('*').eq('versao_id', vSel.id).single(),
    sb.from('va_precos').select('*').eq('versao_id', vSel.id).order('ordem'),
  ]);

  const optsVersao = versoes.map(v => `<option value="${v.id}" ${v.id===vSel.id?'selected':''}>v${v.numero} · ${esc(v.nome)}${v.vigente?' · vigente':''}</option>`).join('');

  const linhaEditor = (p) => {
    const custo = Number(p.custo_real||0);
    const horas = Number(p.horas_estimadas||0);
    const custoHora = Number(cfg?.custo_hora_operador||0);
    // preço sugerido baseado no multiplicador padrão · UI mostra ao lado
    const mult = p.repassa_sem_margem ? Number(cfg?.margem_repasse_multiplicador||1.5) : Number(cfg?.margem_padrao_multiplicador||3);
    const precoSugerido = (custo + horas*custoHora) * mult;
    const margem = Number(p.preco||0) - (custo + horas*custoHora);
    const margemPct = p.preco>0 ? (margem/p.preco*100) : 0;
    return `<tr style="border-top:1px solid var(--line)">
      <td style="padding:6px 8px;font-family:var(--mono);font-size:11px">${esc(p.tipo)}</td>
      <td style="padding:6px 8px;font-size:12px">${esc(p.rotulo||'')}</td>
      <td style="padding:6px 8px"><input ${readOnly?'disabled':''} type="number" step="0.01" min="0" value="${custo}" data-tipo="${p.tipo}" data-campo="custo_real" style="width:80px;font-family:var(--mono);font-size:12px" onchange="cfgSalvarLinha(this)"></td>
      <td style="padding:6px 8px"><input ${readOnly?'disabled':''} type="number" step="0.5" min="0" value="${horas}" data-tipo="${p.tipo}" data-campo="horas_estimadas" style="width:60px;font-family:var(--mono);font-size:12px" onchange="cfgSalvarLinha(this)"></td>
      <td style="padding:6px 8px"><input ${readOnly?'disabled':''} type="number" step="0.01" min="0" value="${Number(p.preco||0)}" data-tipo="${p.tipo}" data-campo="preco" style="width:90px;font-family:var(--mono);font-size:12px" onchange="cfgSalvarLinha(this)"></td>
      <td style="padding:6px 8px;font-family:var(--mono);font-size:11px;color:var(--ink-3);text-align:right">sug ${precoSugerido.toFixed(2)}</td>
      <td style="padding:6px 8px;font-family:var(--mono);font-size:11px;text-align:right;color:${margemPct>0?'#0a7d3d':margemPct<0?'#c00':'var(--ink-3)'}">${margem.toFixed(2)} <span style="color:var(--ink-3)">(${margemPct.toFixed(0)}%)</span></td>
    </tr>`;
  };

  const cfgFld = (lbl, campo, valor, step='0.01') => `
    <div class="fld"><span class="lbl">${lbl}</span>
      <input ${readOnly?'disabled':''} type="number" step="${step}" value="${valor||0}" data-cfgcampo="${campo}" onchange="cfgSalvarConfig(this,'${vSel.id}')">
    </div>`;

  body.innerHTML = `
    <div class="card">
      <div class="row" style="gap:12px;align-items:center;margin-bottom:12px;flex-wrap:wrap">
        <select onchange="cfgSelecionarVersao(this.value)" style="padding:6px 10px;font-size:13px;border:1px solid var(--line);border-radius:6px">${optsVersao}</select>
        ${vSel.vigente?'<span class="pill" style="background:#e6f7ee;color:#0a7d3d;border-color:#8fd4ae">VIGENTE</span>':''}
        ${readOnly?'<span class="pill" style="background:#fff8e1;color:#c60;border-color:#f0c040">READ-ONLY · em uso por '+vSel.projetos_ativos+' projeto(s) ativo(s)</span>':''}
      </div>
      <div class="lbl" style="margin-top:10px">Parâmetros globais desta versão</div>
      <div class="form-grid" style="margin-top:8px">
        ${cfgFld('custo/hora operador (R$)', 'custo_hora_operador', cfg?.custo_hora_operador)}
        ${cfgFld('imposto (%)', 'percent_imposto', cfg?.percent_imposto, '0.1')}
        ${cfgFld('gestão (%)', 'percent_gestao', cfg?.percent_gestao, '0.1')}
        ${cfgFld('mult. padrão', 'margem_padrao_multiplicador', cfg?.margem_padrao_multiplicador, '0.1')}
        ${cfgFld('mult. repasse', 'margem_repasse_multiplicador', cfg?.margem_repasse_multiplicador, '0.1')}
      </div>
    </div>
    <div class="card" style="margin-top:14px">
      <div class="lbl" style="margin-bottom:8px">Preços · Preço = (custo real + horas × custo/hora) × multiplicador</div>
      <div style="overflow-x:auto">
      <table style="width:100%;border-collapse:collapse;font-size:12.5px;min-width:800px">
        <thead>
          <tr style="border-bottom:1px solid var(--line);font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)">
            <th style="text-align:left;padding:6px 8px">tipo</th>
            <th style="text-align:left;padding:6px 8px">rótulo</th>
            <th style="text-align:left;padding:6px 8px">custo real</th>
            <th style="text-align:left;padding:6px 8px">horas</th>

            <th style="text-align:right;padding:6px 8px">margem</th>
          </tr>
        </thead>
        <tbody>${(precos||[]).map(linhaEditor).join('')}</tbody>
      </table>
      </div>
    </div>`;
}

async function cfgRenderComparativo(body){
  const { data: versoes } = await sb.from('va_precos_versao_uso').select('*').order('numero',{ascending:false});
  if (!versoes || versoes.length < 2) { body.innerHTML = '<div class="card"><div class="muted">Precisa ter pelo menos 2 versões para comparar.</div></div>'; return; }
  if (!_cfgComparativoA) _cfgComparativoA = versoes[1].id;

  const optsA = versoes.map(v => `<option value="${v.id}" ${v.id===_cfgComparativoA?'selected':''}>v${v.numero} · ${esc(v.nome)}</option>`).join('');
  const optsB = versoes.map(v => `<option value="${v.id}" ${v.id===_cfgComparativoB?'selected':''}>v${v.numero} · ${esc(v.nome)}</option>`).join('');

  const { data: diff } = await sb.rpc('va_precos_comparar', { p_a: _cfgComparativoA, p_b: _cfgComparativoB });
  const brl = v => v==null ? '—' : 'R$ '+Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2});
  const rows = (diff||[]).filter(r => Number(r.delta||0) !== 0 || r.preco_a==null || r.preco_b==null).map(r => {
    const corDelta = r.delta > 0 ? '#c00' : r.delta < 0 ? '#0a7d3d' : 'var(--ink-3)';
    return `<tr style="border-top:1px solid var(--line)">
      <td style="padding:6px 8px;font-family:var(--mono);font-size:11px">${esc(r.tipo)}</td>
      <td style="padding:6px 8px;font-size:12px">${esc(r.rotulo||'')}</td>
      <td style="padding:6px 8px;font-family:var(--mono);text-align:right">${brl(r.preco_a)}</td>
      <td style="padding:6px 8px;font-family:var(--mono);text-align:right">${brl(r.preco_b)}</td>
      <td style="padding:6px 8px;font-family:var(--mono);text-align:right;color:${corDelta}">${r.delta>0?'+':''}${brl(r.delta)}</td>
      <td style="padding:6px 8px;font-family:var(--mono);text-align:right;color:${corDelta}">${r.delta_pct!=null?(r.delta_pct>0?'+':'')+r.delta_pct+'%':'—'}</td>
    </tr>`;
  }).join('');

  // Impacto numa onda padrão R$ 1.500 × 3
  const { data: simA } = await sb.rpc('va_simular_orcamento', { p_valor_mensal: 1500, p_meses: 3, p_projeto_id: null });
  // Trocar temporariamente vigente é caro · usa SQL direto pra estimar em vez disso:
  // Aqui só mostra o total_contrato e sobra da vigente. Alternativa: dois RPCs distintos por versão.
  const rowsHTML = rows || '<tr><td colspan="6" style="padding:20px;text-align:center" class="muted">Nenhuma diferença entre as duas versões.</td></tr>';
  body.innerHTML = `
    <div class="card">
      <div class="row" style="gap:12px;flex-wrap:wrap;align-items:end">
        <div class="fld"><span class="lbl">versão A</span><select onchange="_cfgComparativoA=this.value;cfgRenderAba()">${optsA}</select></div>
        <div class="fld"><span class="lbl">versão B</span><select onchange="_cfgComparativoB=this.value;cfgRenderAba()">${optsB}</select></div>
      </div>
      <table style="width:100%;border-collapse:collapse;font-size:12.5px;margin-top:14px">
        <thead>
          <tr style="border-bottom:1px solid var(--line);font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)">
            <th style="text-align:left;padding:6px 8px">tipo</th>
            <th style="text-align:left;padding:6px 8px">rótulo</th>
            <th style="text-align:right;padding:6px 8px">A</th>
            <th style="text-align:right;padding:6px 8px">B</th>
            <th style="text-align:right;padding:6px 8px">Δ</th>
            <th style="text-align:right;padding:6px 8px">Δ %</th>
          </tr>
        </thead>
        <tbody>${rowsHTML}</tbody>
      </table>
    </div>`;
}

async function cfgRenderScorecard(body){
  body.innerHTML = '<div class="muted">carregando scorecard…</div>';
  const dias = 30;
  const [
    { data: fin }, { data: linhas }, { data: projs }, { data: cap }
  ] = await Promise.all([
    sb.rpc('va_scorecard_financeiro', { p_dias: dias }),
    sb.rpc('va_scorecard_linha', { p_dias: dias, p_limite_desvio_pct: 20 }),
    sb.rpc('va_scorecard_por_projeto', { p_dias: dias }),
    sb.rpc('va_scorecard_capacidade', { p_dias: dias, p_capacidade_horas: 160 }),
  ]);
  const brl = v => 'R$ '+Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2});
  const pct = v => v==null?'—':Number(v).toFixed(1)+'%';

  const finCard = fin ? `
    <div class="card">
      <div class="lbl">Financeira · últimos ${dias} dias</div>
      <div class="orc-resumo" style="margin-top:10px">
        <div class="orc-kpi"><div class="k">receita bruta</div><div class="v">${brl(fin.receita_bruta)}</div><div class="calc-hint" style="font-size:10px">${fin.delta_receita_pct!=null?(fin.delta_receita_pct>0?'+':'')+fin.delta_receita_pct+'% vs período anterior':''}</div></div>
        <div class="orc-kpi"><div class="k">impostos est.</div><div class="v">${brl(fin.impostos_estimados)}</div></div>
        <div class="orc-kpi"><div class="k">receita líquida</div><div class="v">${brl(fin.receita_liquida)}</div></div>
        <div class="orc-kpi"><div class="k">custo real</div><div class="v">${brl(fin.custo_real_total)}</div></div>
        <div class="orc-kpi ${fin.margem_contribuicao_rs>0?'destaque':''}"><div class="k">margem contrib.</div><div class="v">${brl(fin.margem_contribuicao_rs)}</div><div class="calc-hint" style="font-size:10px">${pct(fin.margem_contribuicao_pct)}</div></div>
      </div>
    </div>` : '';

  const linhasRows = (linhas||[]).map(l => `
    <tr style="border-top:1px solid var(--line);${l.alerta?'background:#fff5f0':''}">
      <td style="padding:6px 8px;font-family:var(--mono);font-size:11px">${esc(l.tipo)}</td>
      <td style="padding:6px 8px;font-size:12px">${esc(l.rotulo||'')}</td>
      <td style="padding:6px 8px;font-family:var(--mono);text-align:right">${brl(l.receita_total)}</td>
      <td style="padding:6px 8px;font-family:var(--mono);text-align:right;color:var(--ink-3)">${brl(l.custo_realizado_total)}</td>
      <td style="padding:6px 8px;font-family:var(--mono);text-align:right">${brl(l.margem)} <span style="color:var(--ink-3)">${pct(l.margem_pct)}</span></td>
      <td style="padding:6px 8px;font-family:var(--mono);text-align:right;color:${l.alerta?'#c00':'var(--ink-3)'}">
        prev ${brl(l.custo_previsto_versao_vigente)}<br>
        real ${brl(l.custo_medio_realizado)}<br>
        ${l.desvio_pct!=null?`<b style="color:${l.alerta?'#c00':'var(--ink-3)'}">${l.desvio_pct>0?'+':''}${l.desvio_pct}%</b>`:''}
      </td>
    </tr>`).join('');
  const linhaCard = `
    <div class="card" style="margin-top:14px">
      <div class="lbl">Por linha de serviço · desvio custo realizado vs previsto</div>
      <div style="overflow-x:auto">
      <table style="width:100%;border-collapse:collapse;font-size:12px;margin-top:8px;min-width:700px">
        <thead>
          <tr style="border-bottom:1px solid var(--line);font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)">
            <th style="text-align:left;padding:6px 8px">tipo</th>
            <th style="text-align:left;padding:6px 8px">rótulo</th>
            <th style="text-align:right;padding:6px 8px">receita</th>
            <th style="text-align:right;padding:6px 8px">custo real</th>
            <th style="text-align:right;padding:6px 8px">margem</th>
            <th style="text-align:right;padding:6px 8px">desvio</th>
          </tr>
        </thead>
        <tbody>${linhasRows || '<tr><td colspan="6" style="padding:16px;text-align:center" class="muted">Nenhum lançamento em ${dias} dias</td></tr>'}</tbody>
      </table>
      </div>
      <div class="muted" style="font-size:11px;margin-top:8px;font-family:var(--mono);letter-spacing:.02em">Linha em vermelho = desvio > 20% vs versão vigente. Considerar reajuste de preço.</div>
    </div>`;

  const projsRows = (projs||[]).map(p => `
    <tr style="border-top:1px solid var(--line);${Number(p.margem_pct||0) < 30 ? 'background:#fff5f0' : ''}">
      <td style="padding:6px 8px">${esc(p.cliente_nome)}</td>
      <td style="padding:6px 8px;font-family:var(--mono);font-size:10.5px;color:var(--ink-3)">v${p.versao_numero||'?'}</td>
      <td style="padding:6px 8px;font-family:var(--mono);text-align:right">${brl(p.receita)}</td>
      <td style="padding:6px 8px;font-family:var(--mono);text-align:right;color:var(--ink-3)">${brl(p.custo_real)}</td>
      <td style="padding:6px 8px;font-family:var(--mono);text-align:right">${brl(p.margem)} · ${pct(p.margem_pct)}</td>
      <td style="padding:6px 8px;font-family:var(--mono);text-align:right;color:var(--ink-3)">${Number(p.horas_estimadas||0).toFixed(1)}h</td>
      <td style="padding:6px 8px;font-family:var(--mono);text-align:right">${p.margem_por_hora!=null?brl(p.margem_por_hora)+'/h':'—'}</td>
    </tr>`).join('');
  const projCard = `
    <div class="card" style="margin-top:14px">
      <div class="lbl">Por projeto · ordenado por menor margem</div>
      <div style="overflow-x:auto">
      <table style="width:100%;border-collapse:collapse;font-size:12px;margin-top:8px;min-width:700px">
        <thead>
          <tr style="border-bottom:1px solid var(--line);font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)">
            <th style="text-align:left;padding:6px 8px">projeto</th>
            <th style="text-align:left;padding:6px 8px">tabela</th>
            <th style="text-align:right;padding:6px 8px">receita</th>
            <th style="text-align:right;padding:6px 8px">custo real</th>
            <th style="text-align:right;padding:6px 8px">margem</th>
            <th style="text-align:right;padding:6px 8px">horas</th>
            <th style="text-align:right;padding:6px 8px">margem/h</th>
          </tr>
        </thead>
        <tbody>${projsRows || '<tr><td colspan="7" style="padding:16px;text-align:center" class="muted">Nenhum projeto com receita/custo em ${dias} dias</td></tr>'}</tbody>
      </table>
      </div>
      <div class="muted" style="font-size:11px;margin-top:8px;font-family:var(--mono);letter-spacing:.02em">Fundo vermelho = margem &lt; 30%. Mandato drenando.</div>
    </div>`;

  const capCard = cap ? `
    <div class="card" style="margin-top:14px">
      <div class="lbl">Capacidade</div>
      <div class="orc-resumo" style="margin-top:10px">
        <div class="orc-kpi"><div class="k">capacidade</div><div class="v">${cap.capacidade_horas}h</div></div>
        <div class="orc-kpi"><div class="k">comprometido</div><div class="v">${Number(cap.horas_comprometidas||0).toFixed(1)}h</div><div class="calc-hint" style="font-size:10px">${cap.utilizacao_pct}% utilização</div></div>
        <div class="orc-kpi"><div class="k">disponível</div><div class="v">${Number(cap.horas_disponiveis||0).toFixed(1)}h</div></div>
        <div class="orc-kpi"><div class="k">receita/hora</div><div class="v">${cap.receita_por_hora!=null?brl(cap.receita_por_hora):'—'}</div></div>
      </div>
    </div>` : '';

  body.innerHTML = finCard + linhaCard + projCard + capCard;
}
window.renderConfig = renderConfig;

(async function boot(){
  await initAuth();
  router();
})();
</script>
</body>
</html>
