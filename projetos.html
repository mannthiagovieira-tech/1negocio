<!DOCTYPE html>
<!-- TODO · ARQUITETURA DE NÚMEROS
     Hoje: 1 número para tudo.
     Alvo: 1 receptivo permanente (nunca banido, links apontam aqui)
           + N de prospecção rotacionáveis, 1 para cada X projetos.
     Migrar antes da primeira campanha real de cliente. -->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Projetos · Venda Assessorada · 1NEGÓCIO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#f7f8f6; --surface:#ffffff; --surface-2:#f2f4f0;
    --ink:#0d1a13; --ink-2:#38463e; --ink-3:#6b7a71; --ink-4:#9aa79f;
    --line:#e4e8e2; --line-2:#d4dccf;
    --accent:#0a9d55; --accent-2:#0c7842; --accent-soft:rgba(10,157,85,.08); --accent-ring:rgba(10,157,85,.20);
    --amber:#c48b04; --amber-soft:rgba(196,139,4,.08); --danger:#c22b3f;
    --sans:'Geist',system-ui,-apple-system,sans-serif;
    --serif:'Syne',serif;
    --mono:'JetBrains Mono',ui-monospace,monospace;
    --r-sm:9px; --r:13px; --r-lg:20px; --r-xl:22px;
    --sh-sm:0 1px 2px rgba(11,44,25,.04),0 1px 1px rgba(11,44,25,.03);
    --sh:0 4px 14px rgba(11,44,25,.06),0 1px 3px rgba(11,44,25,.04);
    --sh-lg:0 20px 40px -12px rgba(11,44,25,.10),0 8px 20px -8px rgba(11,44,25,.06),0 1px 2px rgba(11,44,25,.04);
    --sh-accent:0 6px 18px -4px rgba(10,157,85,.35),0 3px 8px -2px rgba(10,157,85,.20);
    --ease:cubic-bezier(.22,.9,.28,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;min-height:100vh}
  body{
    background:
      radial-gradient(1200px 700px at 50% -200px, rgba(10,157,85,.10), transparent 60%),
      radial-gradient(800px 500px at 90% -100px, rgba(10,157,85,.06), transparent 70%),
      #f7f8f6;
    background-attachment:fixed;
  }
  a{color:var(--accent);text-decoration:none;transition:opacity .22s var(--ease)}
  a:hover{opacity:.7}
  button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
  input,textarea,select{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 14px;width:100%;outline:none;transition:all .22s var(--ease)}
  input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
  textarea{resize:vertical;min-height:88px;line-height:1.55}
  .mono{font-family:var(--mono);letter-spacing:.02em}
  .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
  .h1{font-family:var(--serif);font-weight:800;font-size:34px;line-height:1.05;letter-spacing:-.02em;color:var(--ink)}
  .h2{font-family:var(--serif);font-weight:700;font-size:22px;line-height:1.2;letter-spacing:-.01em;color:var(--ink)}
  .h3{font-family:var(--serif);font-weight:700;font-size:16px;color:var(--ink)}
  .muted{color:var(--ink-3)}
  .row{display:flex;gap:12px;align-items:center}
  .col{display:flex;flex-direction:column;gap:12px}

  /* HEADER */
  header.top{position:sticky;top:0;z-index:20;backdrop-filter:blur(14px);background:rgba(247,248,246,.78);border-bottom:1px solid var(--line);padding:14px 32px;display:flex;align-items:center;justify-content:space-between;gap:20px}
  @media(max-width:640px){
    header.top{padding:12px 16px;gap:10px}
    header.top .btn{padding:0 12px;font-size:12.5px;height:36px}
    header.top .btn .btn-lbl{display:none}
    header.top .brand small{display:none}
  }
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-weight:800;font-size:17px;letter-spacing:-.02em;color:var(--ink)}
  .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
  .brand small{font-family:var(--mono);font-weight:500;font-size:10px;color:var(--ink-3);letter-spacing:.12em;text-transform:uppercase}
  .conn{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;color:var(--ink-3);padding:5px 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line)}
  .conn::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--ink-4)}
  .conn.on::before{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .conn.err::before{background:var(--danger)}

  /* BUTTONS */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 18px;border-radius:var(--r);font-family:var(--sans);font-weight:600;font-size:13.5px;letter-spacing:-.005em;transition:all .22s var(--ease);border:1px solid transparent;white-space:nowrap}
  .btn:hover{transform:translateY(-1px)}
  .btn:active{transform:translateY(0)}
  .btn-primary{background:linear-gradient(180deg,var(--accent) 0%,var(--accent-2) 100%);color:#fff;box-shadow:var(--sh-accent)}
  .btn-primary:hover{box-shadow:0 10px 24px -4px rgba(10,157,85,.45),0 4px 10px -2px rgba(10,157,85,.25)}
  .btn-ghost{background:var(--surface);color:var(--ink);border-color:var(--line);box-shadow:var(--sh-sm)}
  .btn-ghost:hover{border-color:var(--line-2);background:var(--surface-2)}
  .btn-sm{height:32px;padding:0 12px;font-size:12.5px;border-radius:10px}
  .btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}

  /* MAIN */
  main{max-width:1280px;margin:0 auto;padding:32px}

  /* AUTH CARD */
  .auth-wrap{min-height:calc(100vh - 160px);display:flex;align-items:center;justify-content:center;padding:40px 20px}
  .auth-card{width:100%;max-width:400px;background:var(--surface);border-radius:var(--r-xl);padding:36px;box-shadow:var(--sh-lg);border:1px solid var(--line)}

  /* CARDS */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);padding:26px;box-shadow:var(--sh);transition:all .22s var(--ease)}
  .card-tight{padding:20px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}
  .proj-card{cursor:pointer}
  .proj-card:hover{transform:translateY(-2px);box-shadow:var(--sh-lg);border-color:var(--line-2)}
  .proj-card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
  .proj-card h3{font-family:var(--serif);font-weight:700;font-size:17px;color:var(--ink);letter-spacing:-.01em}
  .proj-card .sub{font-size:12.5px;color:var(--ink-3);margin-top:2px}
  .proj-card .kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
  .kpi .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.10em;text-transform:uppercase;color:var(--ink-3)}
  .kpi .v{font-family:var(--serif);font-weight:700;font-size:20px;color:var(--ink);letter-spacing:-.01em;margin-top:2px}
  .kpi .v small{font-family:var(--sans);font-size:12px;font-weight:500;color:var(--ink-3);letter-spacing:0}
  .progress{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-top:14px}
  .progress span{display:block;height:100%;background:linear-gradient(90deg,var(--accent) 0%,#12c26b 100%);transition:width .5s var(--ease);border-radius:99px}
  .badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:99px;font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:500;border:1px solid transparent}
  .badge.setup{background:var(--amber-soft);color:var(--amber);border-color:rgba(196,139,4,.20)}
  .badge.ativo{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-ring)}
  .badge.pausado{background:var(--surface-2);color:var(--ink-3);border-color:var(--line-2)}
  .badge.concluido{background:rgba(10,157,85,.14);color:var(--accent-2);border-color:var(--accent-ring)}

  /* EMPTY */
  .empty{text-align:center;padding:80px 20px;background:var(--surface);border-radius:var(--r-xl);border:1px dashed var(--line-2);box-shadow:var(--sh-sm)}
  .empty h2{font-family:var(--serif);font-weight:700;font-size:22px;letter-spacing:-.01em;color:var(--ink);margin-bottom:8px}
  .empty p{color:var(--ink-3);margin-bottom:22px;max-width:400px;margin-left:auto;margin-right:auto}

  /* FORM */
  .fld{display:flex;flex-direction:column;gap:6px}
  .fld > .lbl{margin-bottom:1px}
  .fld small{color:var(--ink-3);font-size:11.5px;margin-top:1px}
  .fld.err input,.fld.err select,.fld.err textarea{border-color:var(--danger);box-shadow:0 0 0 4px rgba(194,43,63,.10)}
  .fld-err-msg{color:var(--danger);font-size:11.5px;font-family:var(--mono);letter-spacing:.02em;margin-top:2px;display:none}
  .fld.err .fld-err-msg{display:block}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:560px){.form-grid{grid-template-columns:1fr}}
  .form-full{grid-column:1 / -1}

  /* NEW project layout */
  .new-layout{display:grid;grid-template-columns:1fr 380px;gap:28px;align-items:start}
  @media(max-width:960px){.new-layout{grid-template-columns:1fr}.calc-sticky{position:static!important}}
  .calc-sticky{position:sticky;top:88px}
  .calc-row{display:flex;justify-content:space-between;align-items:baseline;padding:11px 0;border-bottom:1px dashed var(--line)}
  .calc-row:last-child{border-bottom:none}
  .calc-lbl{font-size:13px;color:var(--ink-2)}
  .calc-val{font-family:var(--serif);font-weight:700;font-size:16px;color:var(--ink);letter-spacing:-.01em}
  .calc-val.big{font-size:22px;color:var(--accent)}
  .calc-hint{font-family:var(--mono);font-size:10px;color:var(--ink-4);letter-spacing:.05em;text-transform:uppercase;margin-top:1px}
  .calc-highlight{background:linear-gradient(135deg,rgba(10,157,85,.06),rgba(10,157,85,.02));border:1px solid var(--accent-ring);border-radius:var(--r);padding:14px 16px;margin:10px 0}

  /* PROJECT layout */
  .proj-layout{display:grid;grid-template-columns:262px 1fr;gap:28px;align-items:start}
  .trail{position:sticky;top:88px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);padding:20px 18px;box-shadow:var(--sh);max-height:calc(100vh - 110px);overflow-y:auto}
  .trail-title{font-family:var(--serif);font-weight:700;font-size:14px;color:var(--ink);margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--line);letter-spacing:-.005em;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .trail-toggle{display:none;background:none;border:none;font:inherit;color:var(--accent-2);cursor:pointer;padding:0;align-items:center;gap:6px;font-size:12px;font-weight:600}
  .trail-toggle .chev{font-size:9px;transition:transform .22s var(--ease)}
  .trail.aberto .trail-toggle .chev{transform:rotate(180deg)}
  .trail-body{display:block}
  .steps{position:relative;padding-left:22px}
  .steps::before{content:'';position:absolute;left:8px;top:6px;bottom:6px;width:1.5px;background:linear-gradient(180deg,var(--line-2) 0%,var(--line) 100%);border-radius:99px}
  .step{position:relative;display:flex;flex-direction:column;padding:9px 8px 9px 8px;margin-left:-4px;border-radius:10px;cursor:pointer;transition:background .18s var(--ease),border-color .18s var(--ease)}
  .step:hover{background:var(--surface-2)}
  .step.active{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent);padding-left:11px}
  .step.active .tit{color:var(--accent-2);font-weight:700}
  .step.active:hover{background:var(--accent-soft)}
  .step .bul{position:absolute;left:-22px;top:12px;width:15px;height:15px;border-radius:50%;background:var(--surface);border:2px solid var(--line-2);z-index:2;display:flex;align-items:center;justify-content:center;transition:all .22s var(--ease)}
  .step.ok .bul{background:var(--accent);border-color:var(--accent);color:#fff}
  .step.ok .bul::after{content:'✓';font-size:10px;font-weight:700}
  .step.now .bul{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 4px var(--accent-soft)}
  .step.active .bul{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .step .tit{font-family:var(--sans);font-weight:600;font-size:12.5px;color:var(--ink);line-height:1.35;letter-spacing:-.005em}
  .step.ok .tit{color:var(--ink-3);text-decoration:line-through;text-decoration-thickness:1px;text-decoration-color:var(--ink-4)}
  .step .meta{font-family:var(--mono);font-size:9.5px;color:var(--ink-4);letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
  .step .meta.cliente{color:var(--amber)}

  /* Trilha responsiva · abaixo de 1024px vira accordion no topo */
  @media(max-width:1024px){
    .proj-layout{grid-template-columns:1fr}
    .trail{position:static;max-height:none;overflow:visible;padding:14px 16px;margin-bottom:6px}
    .trail-toggle{display:inline-flex}
    .trail-body{display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
    .trail.aberto .trail-body{display:block}
    .trail-title{margin-bottom:0;padding-bottom:0;border-bottom:none}
  }

  .stage{min-height:60vh}
  .stage-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:22px}
  .stage-head h2{font-family:var(--serif);font-weight:700;font-size:26px;letter-spacing:-.015em;color:var(--ink)}
  .stage-head .meta{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-top:4px;letter-spacing:.05em;text-transform:uppercase}

  /* KICKOFF */
  .k-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);padding:24px;box-shadow:var(--sh);margin-bottom:18px}
  /* slice 12f · chat, teses, triagem */
  .chat-container{display:flex;flex-direction:column;gap:8px;max-height:400px;overflow-y:auto;padding:10px;background:var(--surface-2);border-radius:8px}
  .chat-msg{padding:8px 12px;border-radius:10px;font-size:13.5px;line-height:1.4;max-width:85%}
  .chat-msg.msg-user{background:var(--accent-soft);color:var(--ink-2);align-self:flex-end;border:1px solid var(--accent-ring)}
  .chat-msg.msg-ia{background:var(--surface);color:var(--ink);align-self:flex-start;border:1px solid var(--line)}
  .tese-card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px}
  .chip{display:inline-block;padding:2px 8px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;font-size:11px;margin:2px 0}
  .pill{display:inline-block;padding:2px 8px;background:var(--surface-2);border:1px solid var(--line);border-radius:4px;font-size:11px;text-transform:uppercase;letter-spacing:.03em}
  .tri-row{border-bottom:1px solid var(--line)}
  .tri-row td{padding:8px 6px;vertical-align:middle}
  .tri-row:hover{background:var(--surface-2)}
  @media (max-width:768px){
    .chat-container{max-height:300px}
    .chat-msg{max-width:100%;font-size:13px}
    .tri-row td{padding:6px 4px;font-size:12px}
  }
  .k-card .lbl{margin-bottom:10px}
  .k-card h3{font-family:var(--serif);font-weight:700;font-size:18px;color:var(--ink);letter-spacing:-.01em;margin-bottom:6px}
  .k-card .motivo{color:var(--ink-3);font-size:13px;margin-bottom:12px}
  .k-quest{padding:16px 0;border-bottom:1px solid var(--line)}
  .k-quest:last-child{border-bottom:none;padding-bottom:0}
  .k-quest:first-child{padding-top:0}
  .k-quest .q{font-family:var(--serif);font-weight:700;font-size:15px;color:var(--ink);margin-bottom:5px;letter-spacing:-.005em}
  .k-quest .por{color:var(--ink-3);font-size:12.5px;margin-bottom:10px}
  .k-block{margin-bottom:16px}
  .k-block:last-child{margin-bottom:0}
  .k-block h4{font-family:var(--serif);font-weight:700;font-size:14px;color:var(--ink);margin-bottom:8px;display:flex;align-items:center;gap:8px}
  .k-check{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px;color:var(--ink-2);cursor:pointer;user-select:none}
  .k-check input{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;padding:0;margin:0}
  .k-checks{margin-bottom:10px}
  .aviso{background:var(--amber-soft);border:1px solid rgba(196,139,4,.25);border-radius:var(--r);padding:14px 16px;color:var(--amber);font-size:13px;line-height:1.55;margin-top:14px}
  .aviso strong{font-weight:700}

  /* TOAST */
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 20px;border-radius:99px;font-size:13px;font-weight:500;box-shadow:0 12px 28px -8px rgba(11,44,25,.35);opacity:0;transition:all .28s var(--ease);pointer-events:none;z-index:100}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.err{background:var(--danger)}
  .toast.ok{background:var(--accent-2)}

  /* SIGILO CARDS */
  .sig-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:6px 0 14px}
  @media(max-width:720px){.sig-grid{grid-template-columns:1fr}}
  .sig-card{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:16px 16px 14px;cursor:pointer;transition:all .22s var(--ease);text-align:left}
  .sig-card:hover{border-color:var(--line-2);transform:translateY(-1px);box-shadow:var(--sh)}
  .sig-card.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:var(--sh-accent)}
  .sig-card .nm{font-family:var(--serif);font-weight:700;font-size:15px;color:var(--ink);letter-spacing:-.005em;text-transform:capitalize}
  .sig-card .ds{font-size:12.5px;color:var(--ink-3);margin-top:6px;line-height:1.45}
  .sig-card.on .nm{color:var(--accent-2)}
  .sig-card .tag{display:inline-block;font-family:var(--mono);font-size:9.5px;color:var(--ink-4);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
  .sig-card.on .tag{color:var(--accent)}

  /* BLACKLIST */
  .bl-form{display:grid;grid-template-columns:1.5fr 1fr 1fr 1.5fr auto;gap:8px;align-items:end;margin-bottom:14px}
  @media(max-width:800px){.bl-form{grid-template-columns:1fr 1fr}}
  .bl-form input{padding:9px 12px;font-size:13px}
  .bl-list{display:flex;flex-direction:column;gap:8px;margin-top:14px}
  .bl-item{background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:11px 14px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
  .bl-item-info{display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;font-size:13px}
  .bl-item-info .n{font-weight:600;color:var(--ink)}
  .bl-item-info .m{font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
  .bl-item-info .mot{color:var(--ink-2);font-style:italic;font-size:12.5px}
  .bl-empty{padding:16px;border:1px dashed var(--line-2);border-radius:var(--r);text-align:center;color:var(--ink-3);font-size:13px;font-style:italic}
  .aviso-red{background:rgba(194,43,63,.06);border:1px solid rgba(194,43,63,.25);color:var(--danger);border-radius:var(--r);padding:12px 16px;font-size:12.5px;line-height:1.5;margin-top:14px}
  .aviso-red strong{font-weight:700}

  /* LAUDO */
  .laudo-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
  @media(max-width:700px){.laudo-grid{grid-template-columns:1fr}}
  .laudo-central{border-color:var(--accent);background:var(--accent-soft)}
  .faixa-box{background:linear-gradient(135deg,rgba(10,157,85,.08),rgba(10,157,85,.02));border:1px solid var(--accent-ring);border-radius:var(--r-lg);padding:22px 24px;margin-top:18px;text-align:center}
  .faixa-lbl{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600}
  .faixa-val{font-family:var(--serif);font-weight:800;font-size:28px;color:var(--ink);margin-top:8px;letter-spacing:-.015em}
  .faixa-central{color:var(--accent-2);font-size:32px}
  .faixa-sep{color:var(--ink-4);font-weight:400;margin:0 8px;font-size:22px}

  /* ARQUÉTIPOS */
  .arq-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
  .arq-card{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:14px 16px 12px;cursor:pointer;transition:all .22s var(--ease);position:relative;overflow:hidden;text-align:left;display:flex;flex-direction:column;gap:6px}
  .arq-card:hover{border-color:var(--line-2);transform:translateY(-1px);box-shadow:var(--sh)}
  .arq-card.on{border-color:var(--accent);background:var(--accent-soft)}
  .arq-card .cd{font-family:var(--mono);font-size:10px;color:var(--ink-4);letter-spacing:.10em}
  .arq-card.on .cd{color:var(--accent)}
  .arq-card .nm{font-family:var(--serif);font-weight:700;font-size:14.5px;color:var(--ink);letter-spacing:-.005em;line-height:1.25}
  .arq-card .bs{font-size:12px;color:var(--ink-3);line-height:1.45}
  .arq-selo{position:absolute;top:12px;right:12px;font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:99px;font-weight:600}
  .arq-selo.scrapper{background:var(--accent-soft);color:var(--accent-2);border:1px solid var(--accent-ring)}
  .arq-selo.midia{background:rgba(60,140,255,.10);color:#2b6cb0;border:1px solid rgba(60,140,255,.25)}
  .arq-selo.rede{background:var(--surface-2);color:var(--ink-3);border:1px solid var(--line-2)}

  .arq-linha{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:12px}
  .arq-linha-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:10px;flex-wrap:wrap}
  .arq-linha-nm{font-family:var(--serif);font-weight:700;font-size:15px;color:var(--ink)}
  .arq-linha-cd{font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.06em}
  .arq-linha-grid{display:grid;grid-template-columns:100px 140px 1fr;gap:12px;margin-bottom:10px}
  @media(max-width:700px){.arq-linha-grid{grid-template-columns:1fr}}
  .arq-linha-grid input,.arq-linha-grid textarea{padding:8px 10px;font-size:12.5px}
  .arq-orient{background:var(--surface-2);border-radius:10px;padding:10px 14px;font-size:12px;color:var(--ink-2);line-height:1.55;margin-top:8px}
  .arq-orient dl{display:grid;grid-template-columns:110px 1fr;gap:4px 12px;margin:0}
  .arq-orient dt{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-4);align-self:center}
  .arq-orient dd{color:var(--ink-2);font-size:12px;margin:0}
  .arq-toggle{background:none;border:none;color:var(--accent-2);font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;padding:4px 0}

  /* ANEXOS */
  .anx-form-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr auto;gap:10px;align-items:end;margin-bottom:16px}
  @media(max-width:800px){.anx-form-grid{grid-template-columns:1fr 1fr}}
  .anx-tab{display:flex;gap:6px;margin-bottom:10px}
  .anx-tab button{padding:6px 14px;border-radius:99px;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:var(--ink-3);background:var(--surface-2);border:1px solid transparent;transition:all .22s var(--ease)}
  .anx-tab button.on{background:var(--surface);color:var(--ink);border-color:var(--line);box-shadow:var(--sh-sm)}
  .anx-cat{margin-top:16px}
  .anx-cat-title{font-family:var(--serif);font-weight:700;font-size:14px;color:var(--ink);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;text-transform:capitalize}
  .anx-cat-title small{font-family:var(--mono);font-size:10px;color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase;font-weight:500}
  .anx-item{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:11px 14px;margin-bottom:8px}
  @media(max-width:700px){.anx-item{grid-template-columns:1fr auto}}
  .anx-nome{font-size:13px;color:var(--ink);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .anx-nome .badge-link{font-family:var(--mono);font-size:9px;color:var(--accent);background:var(--accent-soft);padding:1px 6px;border-radius:99px;margin-left:8px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
  .anx-tam{font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.02em}
  .anx-vis{padding:6px 10px;font-size:11.5px;font-family:var(--mono);border-radius:9px;background:var(--surface);border:1px solid var(--line)}
  .aprov-alert{background:rgba(194,43,63,.08);color:var(--danger);border:1px solid rgba(194,43,63,.25);padding:2px 8px;border-radius:99px;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
  .aprov-toggle{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-2);cursor:pointer}
  .vis-legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;padding:10px 14px;background:var(--surface-2);border-radius:10px;font-size:11.5px;color:var(--ink-3)}
  .vis-legend b{font-family:var(--mono);font-size:10px;color:var(--ink-2);letter-spacing:.06em;text-transform:uppercase;font-weight:600;margin-right:4px}

  /* TEASER */
  .ts-layout{display:grid;grid-template-columns:1fr 320px;gap:20px;align-items:start}
  @media(max-width:900px){.ts-layout{grid-template-columns:1fr}}
  .ts-versoes{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .ts-versao-chip{padding:5px 12px;border-radius:99px;font-family:var(--mono);font-size:11px;letter-spacing:.04em;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink-3);transition:all .22s var(--ease);display:inline-flex;align-items:center;gap:6px}
  .ts-versao-chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .ts-versao-chip .status-dot{width:6px;height:6px;border-radius:50%}
  .st-rascunho{background:var(--ink-4)}
  .st-aguardando_aprovacao{background:var(--amber)}
  .st-aprovado{background:var(--accent)}
  .st-recusado{background:var(--danger)}
  .ts-editor textarea{min-height:280px;font-family:var(--sans);font-size:14px;line-height:1.6}
  .ts-status-badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;border:1px solid var(--line);background:var(--surface)}
  .ts-ctx{position:sticky;top:88px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);padding:18px;box-shadow:var(--sh);font-size:12.5px;max-height:calc(100vh - 120px);overflow-y:auto}
  .ts-ctx h4{font-family:var(--serif);font-weight:700;font-size:13px;color:var(--ink);margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
  .ts-ctx-item{margin-bottom:12px}
  .ts-ctx-item:last-child{margin-bottom:0}
  .ts-ctx-item .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-4);margin-bottom:3px}
  .ts-ctx-item .v{color:var(--ink-2);line-height:1.5;font-size:12.5px;white-space:pre-wrap}
  .ts-ctx-vazio{color:var(--ink-4);font-style:italic;font-size:11.5px}

  /* TRILHA · grupos */
  .trail-sep{margin-top:20px;padding-top:18px;border-top:2px dashed var(--line-2)}
  .trail-grupo{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2);font-weight:700;margin-bottom:12px;padding-left:22px;display:flex;align-items:center;gap:8px}
  .trail-grupo::before{content:'';width:14px;height:1.5px;background:var(--accent);border-radius:99px}
  .step.gestao{padding-left:8px}
  .step.gestao .bul{background:transparent;border:none;color:var(--ink-3);width:15px;height:15px;font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center;top:11px}
  .step.gestao .bul::after{content:'§';font-family:var(--serif);font-weight:700}
  .step.gestao.active .bul{color:var(--accent)}
  .step.gestao.active{padding-left:11px}
  .step.gestao .tit{color:var(--ink-2)}
  .step.gestao .meta{color:var(--ink-4)}

  /* ORÇAMENTO · resumo */
  .orc-resumo{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:14px}
  @media(max-width:900px){.orc-resumo{grid-template-columns:repeat(2,1fr)}}
  .orc-kpi{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
  .orc-kpi .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.10em;text-transform:uppercase;color:var(--ink-3)}
  .orc-kpi .v{font-family:var(--serif);font-weight:700;font-size:22px;color:var(--ink);letter-spacing:-.01em;margin-top:4px}
  .orc-kpi.destaque{background:linear-gradient(135deg,rgba(10,157,85,.08),rgba(10,157,85,.02));border-color:var(--accent-ring)}
  .orc-kpi.destaque .v{color:var(--accent-2)}
  .orc-apropriacao{margin-top:12px;display:flex;flex-wrap:wrap;gap:14px;padding:10px 14px;background:var(--surface-2);border-radius:10px;font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
  .orc-apropriacao b{color:var(--ink-2);font-weight:600}
  .orc-apropriacao .warn{color:var(--amber);font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;margin-left:auto}

  /* ORÇAMENTO · ritmo */
  .ritmo-bar{position:relative;height:14px;background:var(--surface-2);border:1px solid var(--line);border-radius:99px;overflow:hidden;margin-top:12px}
  .ritmo-cons{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--accent) 0%,#12c26b 100%);border-radius:99px;transition:width .5s var(--ease)}
  .ritmo-cons.at{background:linear-gradient(90deg,var(--amber) 0%,#e0a010 100%)}
  .ritmo-cons.at2{background:linear-gradient(90deg,var(--danger) 0%,#e03a4f 100%)}
  .ritmo-marker{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
  .ritmo-labels{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;color:var(--ink-3);margin-top:6px}
  .ritmo-status{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:99px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;margin-top:12px}
  .ritmo-status.ok{background:var(--accent-soft);color:var(--accent-2);border:1px solid var(--accent-ring)}
  .ritmo-status.at{background:var(--amber-soft);color:var(--amber);border:1px solid rgba(196,139,4,.25)}
  .ritmo-status.at2{background:rgba(194,43,63,.08);color:var(--danger);border:1px solid rgba(194,43,63,.25)}

  /* ORÇAMENTO · plano/razão/parcelas · tabela genérica */
  .orc-tab{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:10px}
  .orc-tab thead th{text-align:left;padding:8px 10px;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);border-bottom:1px solid var(--line);font-weight:600;background:var(--surface-2)}
  .orc-tab tbody td{padding:10px;border-bottom:1px solid var(--line);color:var(--ink-2);vertical-align:middle}
  .orc-tab tbody tr:last-child td{border-bottom:none}
  .orc-tab .num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
  .orc-tab tfoot td{padding:10px;font-family:var(--mono);font-weight:600;color:var(--ink);background:var(--surface-2);border-top:1.5px solid var(--line-2)}
  .orc-tab input,.orc-tab select{padding:6px 10px;font-size:12px;border-radius:9px}
  .orc-plano-prog{display:flex;align-items:center;gap:8px}
  .orc-plano-prog-bar{flex:1;height:5px;background:var(--surface-2);border-radius:99px;overflow:hidden;min-width:60px}
  .orc-plano-prog-bar span{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .35s var(--ease)}
  .orc-plano-prog-bar span.stopa{background:var(--danger)}
  .orc-plano-prog-pct{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);min-width:38px;text-align:right}
  tr.tipo-estourado td{background:rgba(194,43,63,.06)}
  .orc-adicionar-linha{display:grid;grid-template-columns:1.5fr 130px 90px 100px auto;gap:8px;align-items:end;margin-top:14px}
  @media(max-width:800px){.orc-adicionar-linha{grid-template-columns:1fr 1fr}}
  .orc-nota{font-family:var(--mono);font-size:11px;color:var(--ink-3);padding:10px 14px;background:var(--surface-2);border-radius:10px;margin-top:12px;line-height:1.55}
  .orc-precos-toggle{background:none;border:none;font-family:var(--serif);font-weight:700;font-size:16px;color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:6px 0}
  .orc-precos-toggle .chev{font-size:10px;color:var(--ink-3);transition:transform .22s var(--ease)}
  .orc-precos-toggle.aberto .chev{transform:rotate(180deg)}
  .preco-a-definir{color:var(--amber);font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
  .preco-repasse{color:var(--ink-3);font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}

  /* KANBAN */
  .kb-header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
  .kb-kpis{display:flex;gap:16px;flex-wrap:wrap}
  .kb-kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-family:var(--mono);font-size:11px;color:var(--ink-3);display:inline-flex;gap:8px;align-items:baseline}
  .kb-kpi b{font-family:var(--serif);font-size:16px;color:var(--ink);font-weight:700;letter-spacing:-.01em}
  .kb-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .kb-trilha-tab{display:flex;background:var(--surface-2);border-radius:99px;padding:3px}
  .kb-trilha-tab button{background:none;border:none;padding:6px 14px;border-radius:99px;font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);cursor:pointer;font-weight:600;transition:all .22s var(--ease)}
  .kb-trilha-tab button.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh-sm)}
  .kb-busca{position:relative}
  .kb-busca input{width:230px;padding:8px 12px 8px 32px;border-radius:99px;font-size:12.5px}
  .kb-busca::before{content:'⌕';position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-3);font-size:14px;pointer-events:none}

  /* Legenda de trilhas */
  .kb-legenda{display:flex;flex-wrap:wrap;gap:14px;align-items:center;padding:8px 14px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;font-family:var(--mono);font-size:10.5px;color:var(--ink-3);margin:0 0 14px}
  .kb-legenda-item{display:inline-flex;align-items:center;gap:6px}
  .kb-legenda-swatch{width:14px;height:6px;border-radius:99px}
  .kb-swatch-fria  {background:#5f8bf5}
  .kb-swatch-quente{background:var(--accent)}

  /* Seções verticais accordion */
  .kb-lista{display:flex;flex-direction:column;gap:8px}
  .kb-secao{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:box-shadow .22s var(--ease)}
  .kb-secao.aberta{box-shadow:var(--sh-sm)}
  .kb-secao.vazia{opacity:.55}
  .kb-secao-head{width:100%;background:none;border:none;padding:12px 16px;display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;cursor:pointer;text-align:left;font:inherit;color:inherit;transition:background .18s var(--ease)}
  .kb-secao-head:hover{background:var(--surface-2)}
  .kb-secao-titulo{display:flex;align-items:center;gap:10px;min-width:0}
  .kb-secao-nome{font-family:var(--serif);font-weight:700;font-size:14px;color:var(--ink);text-transform:capitalize;letter-spacing:-.005em;white-space:nowrap}
  .kb-secao.vazia .kb-secao-nome{color:var(--ink-3);font-weight:600}
  .kb-secao-count{font-family:var(--mono);font-size:11px;color:var(--ink-3);background:var(--surface-2);padding:2px 10px;border-radius:99px;border:1px solid var(--line);font-weight:600}
  .kb-secao.aberta .kb-secao-count{background:var(--accent-soft);color:var(--accent-2);border-color:var(--accent-ring)}
  .kb-secao-barra{flex:1;min-width:60px;height:5px;background:var(--surface-2);border-radius:99px;overflow:hidden;max-width:240px}
  .kb-secao-barra span{display:block;height:100%;background:linear-gradient(90deg,var(--accent) 0%,#12c26b 100%);border-radius:99px;transition:width .5s var(--ease)}
  .kb-secao.vazia .kb-secao-barra span{background:var(--line-2)}
  .kb-secao-chev{font-size:11px;color:var(--ink-3);transition:transform .22s var(--ease)}
  .kb-secao.aberta .kb-secao-chev{transform:rotate(180deg)}
  .kb-secao-body{display:none;padding:0 4px 4px;border-top:1px solid var(--line)}
  .kb-secao.aberta .kb-secao-body{display:block}
  .kb-secao-empty{padding:20px 16px;text-align:center;color:var(--ink-4);font-size:12px;font-style:italic}

  /* Linhas de contato */
  .kb-linha{display:grid;grid-template-columns:4px minmax(180px,1.6fr) minmax(110px,.9fr) auto minmax(0,2fr) auto 160px;gap:12px;padding:10px 14px 10px 0;border-bottom:1px solid var(--line);align-items:center;transition:background .18s var(--ease);cursor:pointer}
  .kb-linha:last-child{border-bottom:none}
  .kb-linha:hover{background:var(--surface-2)}
  .kb-linha-trilha{align-self:stretch;border-radius:0 3px 3px 0;background:var(--line-2)}
  .kb-linha.fria .kb-linha-trilha{background:#5f8bf5}
  .kb-linha.quente .kb-linha-trilha{background:var(--accent)}
  .kb-linha-nome{min-width:0;overflow:hidden}
  .kb-linha-nome .n{font-family:var(--sans);font-weight:600;font-size:13.5px;color:var(--ink);letter-spacing:-.005em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .kb-linha-nome .e{font-family:var(--sans);font-weight:500;color:var(--ink-3);margin-left:6px;font-size:12.5px}
  .kb-linha-cidade{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .kb-linha-tags{display:flex;gap:4px;flex-wrap:nowrap;overflow:hidden}
  .kb-linha-feed{font-size:12px;color:var(--ink-2);font-style:italic;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .kb-linha-pp{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);white-space:nowrap;text-align:right;line-height:1.35}
  .kb-linha-pp .t{color:var(--ink-2)}
  .kb-linha-pp .d{font-weight:600;color:var(--ink)}
  .kb-linha-pp.vencido .d{color:var(--amber)}
  .kb-linha-pp.vencido .t{color:var(--amber)}
  .kb-linha-mover{position:relative}
  .kb-linha-mover select{padding:6px 24px 6px 10px;font-size:11.5px;font-family:var(--mono);border-radius:9px;background:var(--surface);border:1px solid var(--line);cursor:pointer;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 12px) 50%,calc(100% - 8px) 50%;background-size:4px 4px,4px 4px;background-repeat:no-repeat}
  .kb-linha-mover select:hover{border-color:var(--line-2)}

  /* Tag styling · reutilizado no drawer também */
  .kb-tag{font-family:var(--mono);font-size:9px;padding:1px 7px;border-radius:99px;letter-spacing:.05em;text-transform:uppercase;font-weight:600;border:1px solid transparent;white-space:nowrap}
  .kb-tag.origem{background:var(--surface-2);color:var(--ink-3);border-color:var(--line)}
  .kb-tag.arq{background:rgba(60,140,255,.10);color:#2b6cb0;border-color:rgba(60,140,255,.20)}
  .kb-tag.q-lixo   {background:var(--surface-2);color:var(--ink-4);border-color:var(--line)}
  .kb-tag.q-fraco  {background:rgba(196,139,4,.08);color:var(--amber);border-color:rgba(196,139,4,.20)}

const _debTimers = {};
function debounce(key, fn, ms=350){ clearTimeout(_debTimers[key]); _debTimers[key] = setTimeout(fn, ms); }

// ═══ MÁSCARAS DE INPUT ═════════════════════════════════════════════
// Filosofia: durante digitação o input fica LIVRE (só remove chars proibidos).
// Formatação pretty acontece no BLUR. dataset.raw sempre reflete o valor puro.
// Isso evita brigar com o cursor e frustar o usuário.

const somenteDigits = s => (s||'').replace(/\D+/g, '');

// ─ CNPJ · máscara viva 00.000.000/0000-00 (não briga com cursor pq só cresce)
function aplicaMascaraCNPJInput(el){
  const d = somenteDigits(el.value).slice(0,14);
  el.dataset.raw = d;
  el.value = d.replace(/(\d{2})(\d)/, '$1.$2').replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d)/, '$1/$2').replace(/(\d{4})(\d)/, '$1-$2');
}

// ─ WhatsApp · dataset.e164 sempre atualizado, display pretty no blur
function parseWpp(v){
  let d = somenteDigits(v);
  if (!d) return '';
  if (d.length >= 11 && d[0] === '0') d = d.slice(1); // remove 0 do DDD
  if ((d.length === 10 || d.length === 11) && !d.startsWith('55')) d = '55' + d; // prefixa 55
  return d.slice(0, 13);
}
function formatWppDisplay(e164){
  if (!e164 || !e164.startsWith('55') || e164.length < 12) return e164;
  const ddd = e164.slice(2,4);
  const resto = e164.slice(4);
  if (resto.length <= 4) return '(' + ddd + ') ' + resto;
  if (resto.length <= 8) return '(' + ddd + ') ' + resto.slice(0, resto.length-4) + '-' + resto.slice(resto.length-4);
  return '(' + ddd + ') ' + resto.slice(0,5) + '-' + resto.slice(5,9);
}
function aplicaMascaraWppInput(el){
  // Durante digitação: só limita a chars válidos, atualiza dataset.e164
  const e164 = parseWpp(el.value);
  el.dataset.e164 = e164;
  // Mantém o que o usuário digitou (menos chars não numéricos aleatórios não permitidos)
  el.value = el.value.replace(/[^\d\s()\-+]/g,'');
}
function aplicaMascaraWppBlur(el){
  const disp = formatWppDisplay(el.dataset.e164 || parseWpp(el.value));
  if (disp) el.value = disp;
}

// ─ Dinheiro · input livre (dígitos, pontos, vírgulas), pretty no blur
function parseDinheiro(v){
  // Aceita: "4500", "4.500", "4500,50", "4.500,50", "R$ 4.500,00"
  const s = (v||'').replace(/[^\d.,-]/g,'');
  if (!s) return 0;
  // Se tem vírgula, é o separador decimal · ponto é milhar
  if (s.includes(',')) return Number(s.replace(/\./g,'').replace(',','.')) || 0;
  // Sem vírgula · se tem ponto e último grupo tem 3+ dígitos → milhar. Se 1-2 → decimal.
  const parts = s.split('.');
  if (parts.length === 1) return Number(s) || 0;
  const ultimo = parts[parts.length-1];
  if (ultimo.length === 1 || ultimo.length === 2) return Number(parts.join('').slice(0,-ultimo.length) + '.' + ultimo) || 0;
  return Number(s.replace(/\./g,'')) || 0;
}
function aplicaMascaraDinheiroInput(el){
  // Só remove chars proibidos, mantém o resto pro usuário editar livre
  el.value = (el.value||'').replace(/[^\d.,-]/g,'');
  el.dataset.raw = String(parseDinheiro(el.value));
}
function aplicaMascaraDinheiroBlur(el){
  const num = parseDinheiro(el.value);
  el.dataset.raw = String(num);
  if (num > 0) el.value = 'R$ ' + num.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
  else el.value = '';
}
function lerValorDinheiro(el){ return Number(el?.dataset?.raw || 0); }

// ─ Percent · aceita "5" ou "5,5", exibe "5 %" ou "5,5 %" no blur
function parsePercent(v){
  const s = (v||'').replace(/[^\d.,-]/g,'').replace(',','.');
  return Number(s) || 0;
}
function aplicaMascaraPercentInput(el){
  el.value = (el.value||'').replace(/[^\d.,%\s-]/g,'').replace('%','').trim();
  el.dataset.raw = String(parsePercent(el.value));
}
function aplicaMascaraPercentBlur(el){
  const n = parsePercent(el.value);
  el.dataset.raw = String(n);
  if (n) el.value = n.toString().replace('.', ',') + ' %';
}
function lerValorPercent(el){ return Number(el?.dataset?.raw || 0); }

// ─── ping health check ────────────────────────────────────────────
async function ping(){
  try {
    const { error } = await sb.from('va_projetos_resumo').select('id', {count:'exact', head:true});
    if (error) {
      if ((error.message||'').match(/does not exist|not found|schema/i)) {
        setConn('err', 'schema faltando');
        return { ok:false, kind:'schema', msg: error.message };
      }
      setConn('err', 'erro conexão');
      return { ok:false, kind:'db', msg: error.message };
    }
    setConn('on', 'conectado');
    return { ok:true };
  } catch (e) {
    setConn('err', 'sem rede');
    return { ok:false, kind:'net', msg: e.message };
  }
}

// ─── auth ─────────────────────────────────────────────────────────
let _session = null;
async function initAuth(){
  const { data: { session } } = await sb.auth.getSession();
  _session = session;
  // Blindagem contra re-render espúrio: o SDK re-emite SIGNED_IN em vários
  // cenários (recover session no visibilitychange, getSession() interno,
  // token refresh, etc). Só re-rota se o user.id mudou de fato (login real
  // ou logout · null → id, id → null, ou id → id2).
  let _lastUserId = session?.user?.id || null;
  sb.auth.onAuthStateChange((event, s) => {
    _session = s;
    const newId = s?.user?.id || null;
    if (newId !== _lastUserId) {
      _lastUserId = newId;
      router();
    }
  });
  return session;
}

function cardProjeto(p){
  const pct = p.etapas_total ? Math.round(p.etapas_ok * 100 / p.etapas_total) : 0;
  const mensal = Number(p.valor_mensal||0), fid = p.fidelidade_meses||3;
  const dia = p.dia_atual||0;
  const o = p._onda;
  let tags = '';
  if (o) {
    if (o.status === 'aguardando_pagamento') tags = `<span class="chip" style="background:#fff8e1;border-color:#f0c040;color:#c60">aguardando pagamento</span>`;
    else if (o.status === 'pausada') tags = `<span class="chip" style="background:#fff8e1;border-color:#f0c040;color:#c60">pausado</span>`;
    else if (o.status === 'ativa') {
      const dias = Math.ceil((new Date(o.data_fim) - new Date()) / 86400000);
      if (dias <= 15 && dias >= 0) tags = `<span class="chip" style="background:#ffe8e0;border-color:#f08060;color:#c00">renova em ${dias}d</span>`;
    } else if (o.status === 'encerrada') tags = `<span class="chip" style="background:#eee;color:#666">encerrado</span>`;
  }
  return `
    <div class="card proj-card" onclick="rota('#/p/${p.id}')">
      <div class="top">
        <div>
          <h3>${esc(p.cliente_nome)}</h3>
          <div class="sub">${esc(p.negocio_titulo || p.setor || 'Negócio sem título')}${p.cidade ? ' · ' + esc(p.cidade) : ''}</div>
          ${tags?`<div style="margin-top:6px">${tags}</div>`:''}
        </div>
        <span class="badge ${esc(p.status)}">${esc(p.status)}</span>
      </div>
      <div class="kpis">
        <div class="kpi"><div class="k">Mensalidade × fidelidade</div><div class="v">${brlNice(mensal)}<small> × ${fid}m</small></div></div>
        <div class="kpi"><div class="k">Dia atual</div><div class="v">${dia >= 0 ? dia : 0}<small> / ${fid*30}</small></div></div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px">
        <div class="lbl">Etapas concluídas</div>
        <div class="mono" style="font-size:12px;color:var(--ink-2);font-weight:600">${p.etapas_ok}/${p.etapas_total} · ${pct}%</div>
      </div>
      <div class="progress"><span style="width:${pct}%"></span></div>
    </div>`;
}

        const r = await fetch('https://publica.cnpj.ws/cnpj/' + digitos);
        if (r.status === 404) { st.textContent = 'CNPJ não encontrado na Receita Federal · você pode preencher à mão e seguir'; st.style.color = '#c60'; return; }

        if (r.status === 429) { st.textContent = 'muitas consultas · aguarde 1 min ou preencha à mão'; st.style.color = '#c60'; return; }
        if (!r.ok) {
          let msg = null; try { const j = await r.json(); msg = j.titulo || j.detalhes || null; } catch {}
          st.textContent = `consulta falhou · HTTP ${r.status}${msg?' · '+msg:''} · você pode preencher à mão`; st.style.color = '#c60';

        const d = await r.json();
        const est = d.estabelecimento || {};
        const toTC = s => s ? s.toLowerCase().replace(/(?:^|\s|[-/])\S/g, c => c.toUpperCase()) : '';
        const razao = toTC(d.razao_social || '');
        const cidade = toTC(est.cidade?.nome || '');

        if (uf) document.getElementById('f-uf').value = uf;

        const preench = ['razão social','cidade','UF'].filter((_,i)=>[razao,cidade,uf][i]);
        st.textContent = `✓ ${razao || digitos} · preenchidos: ${preench.join(', ')}`;
        st.style.color = 'green';
      } catch (e) {
        st.textContent = 'não foi possível consultar agora, tente de novo · você pode preencher à mão e seguir'; st.style.color = '#c60';

    }, 250);
  };

    if (cnpjBruto.length !== 14) { invalidos.push('cnpj'); document.querySelector('[data-fld=cnpj]')?.classList.add('err'); }
    if (!cidade) { invalidos.push('cid'); document.querySelector('[data-fld=cid]')?.classList.add('err'); }
    if (!uf || uf.length !== 2) { invalidos.push('uf'); document.querySelector('[data-fld=uf]')?.classList.add('err'); }
    if (!dt) { invalidos.push('dt'); document.querySelector('[data-fld=dt]')?.classList.add('err'); }
    if (!isFinite(mens) || mens <= 0) { invalidos.push('mens'); document.querySelector('[data-fld=mens]')?.classList.add('err'); }
    if (!fid || fid < 3) { invalidos.push('fid'); document.querySelector('[data-fld=fid]')?.classList.add('err'); }
    if (invalidos.length) {
      err.textContent = 'Preencha os campos destacados em vermelho.';
      err.classList.remove('hidden');
      document.querySelector('[data-fld=' + invalidos[0] + '] input')?.focus();
      return;
    }

    btn.disabled = true; btn.textContent = 'Criando…';

      cliente_nome: nome,
      cliente_whatsapp: wpBruto,
      negocio_titulo: document.getElementById('f-tit').value.trim() || null,
      cnpj: cnpjBruto,
      cidade,
      uf,
      valor_mensal: mens,
      fidelidade_meses: Number(document.getElementById('f-fid').value) || 3,
      comissao_percent: lerValorPercent(document.getElementById('f-com')) || 5,
      data_inicio: dt,
      expectativa_valor: lerValorDinheiro(document.getElementById('f-exp')) || null,
    };
    const { data, error } = await sb.from('va_projetos').insert(payload).select('id').single();
    if (error) {
      err.textContent = error.message || 'Erro ao criar projeto';
      err.classList.remove('hidden');
      btn.disabled = false; btn.textContent = 'Salvar e abrir projeto';
      return;
    }
    toast('Projeto criado', 'ok');
    location.hash = '#/p/' + data.id;
  };
}

// checa auto-conclusão de uma etapa após mudança
async function checarAutoConclusao(chave){
  const et = _pj.etapas.find(x => x.chave === chave);
  if (!et || et.status === 'concluida') return;
  const p = _pj.projeto;
  let condMet = false;
  if (chave === 'laudo') {
    condMet = p.valor_avaliacao != null && p.valor_avaliacao_min != null && p.valor_avaliacao_max != null;
  } else if (chave === 'preco') {
    condMet = p.valor_venda != null && !!p.valor_venda_decidido_por && !!(p.valor_venda_justificativa||'').trim();
  } else if (chave === 'arquetipos') {
    const sel = _pj.arquetipos || [];
    condMet = sel.length >= 3 && sel.every(a => Array.isArray(a.queries_busca) && a.queries_busca.length > 0);
  } else if (chave === 'teaser') {
    condMet = (_pj.teasers||[]).some(v => v.status === 'aprovado');
  } else if (chave === 'regras') {
    return;
  }
  if (condMet) {
    const hoje = new Date().toISOString().slice(0,10);
    const { error } = await sb.from('va_projeto_etapas').update({ status:'concluida', data_real: hoje }).eq('id', et.id);
    if (error) return;
    et.status = 'concluida'; et.data_real = hoje;
    _pj.projeto.etapas_ok = (_pj.projeto.etapas_ok || 0) + 1;
    toast('Etapa concluída automaticamente', 'ok');
    desenhaProjeto();
  }
}

function desenhaStep(e){
  const isActive = e.chave === _abaChave;
  const ok = e.status === 'concluida';
  const now = e.status === 'em_andamento';
  const respCls = e.responsavel === 'cliente' ? 'cliente' : '';
  const mod = _pj.projeto.modalidade || 'assessorada';
  const etapaModal = (_pj.modEtapas||[]).find(x => x.etapa_chave === e.chave);
  const bloqueada = etapaModal && !etapaModal.ativa;
  const lockStyle = bloqueada ? 'opacity:.5;' : '';
  const lockIcon = bloqueada ? '🔒 ' : '';
  const tooltip = bloqueada ? ` title="${esc(etapaModal.observacao || 'disponível na Venda Assessorada')}"` : '';
  return `
    <div class="step ${ok?'ok':''} ${now?'now':''} ${isActive?'active':''}" onclick="trocarAba('${e.chave}')" style="${lockStyle}"${tooltip}>

function desenhaAba(){
  const stage = document.getElementById('stage');
  // GESTÃO
  if (_abaChave === 'gestao_orcamento')  { stage.innerHTML = htmlOrcamento();  vincularOrcamento(); return; }
  if (_abaChave === 'gestao_kanban')     { stage.innerHTML = htmlKanban();     vincularKanban();    return; }
  if (_abaChave === 'gestao_funil')      { stage.innerHTML = htmlFunil();                           return; }
  if (_abaChave === 'gestao_cadencia')    { htmlCadencia();                                          return; }
  if (_abaChave === 'gestao_atendimento') { htmlAtendimento();                                       return; }
  if (_abaChave === 'gestao_campanhas')   { htmlCampanhas();                                          return; }
  if (_abaChave === 'gestao_triagem')     { htmlTriagem();                                              return; }
  if (_abaChave === 'gestao_contrato')    { htmlContrato();                                             return; }
  if (_abaChave === 'gestao_relatorios')  { stage.innerHTML = htmlGestaoPlaceholder('Relatórios','Consumo, ROI da onda, exportáveis pro cliente.'); return; }
  // SETUP
  const e = _pj.etapas.find(x => x.chave === _abaChave) || _pj.etapas[0];
  if (!e) { stage.innerHTML = '<div class="empty"><h2>Etapa não encontrada</h2></div>'; return; }
  if (e.chave === 'kickoff')    { stage.innerHTML = htmlKickoff(e);    vincularKickoff();    return; }
  if (e.chave === 'regras')     { stage.innerHTML = htmlRegras(e);     vincularRegras();     return; }
  if (e.chave === 'laudo')      { stage.innerHTML = htmlLaudo(e);      vincularLaudo();      return; }
  if (e.chave === 'preco')      { stage.innerHTML = htmlPreco(e);      vincularPreco();      return; }
  if (e.chave === 'arquetipos') { stage.innerHTML = htmlArquetipos(e); vincularArquetipos(); return; }
  if (e.chave === 'publicacao') { stage.innerHTML = htmlPublicacao(e); return; }
  if (e.chave === 'anexos')     { stage.innerHTML = htmlAnexos(e);     vincularAnexos();     return; }
  if (e.chave === 'teaser')     { stage.innerHTML = htmlTeaser(e);     vincularTeaser();     return; }
  stage.innerHTML = htmlEtapaGenerica(e);
}

function vincularKickoff(){
  // textareas -> onblur salva o campo
  document.querySelectorAll('#stage textarea[data-field]').forEach(el => {
    el.addEventListener('blur', () => salvarKickoffCampo(el.dataset.field, el.value));
  });
  // checkboxes -> salva itens jsonb consolidado
  document.querySelectorAll('#stage input[type="checkbox"][data-cat]').forEach(el => {
    el.addEventListener('change', () => salvarKickoffItens());
  });
}

async function salvarKickoffCampo(field, valor){
  const id = _pj.projeto.id;
  const antes = _pj.kickoff[field] || '';
  if ((valor||'') === antes) return;
  const patch = {}; patch[field] = valor;
  const { error } = await sb.from('va_projeto_kickoff').upsert({ projeto_id: id, ...patch }, { onConflict: 'projeto_id' });
  if (error) { toast('Falhou: ' + error.message, 'err'); return; }
  _pj.kickoff[field] = valor;
  toast('Salvo', 'ok');
}

async function salvarKickoffItens(){
  const id = _pj.projeto.id;
  const itens = {};
  document.querySelectorAll('#stage input[type="checkbox"][data-cat]').forEach(el => {
    const c = el.dataset.cat, i = el.dataset.item;
    itens[c] = itens[c] || {};
    if (el.checked) itens[c][i] = true;
  });
  const { error } = await sb.from('va_projeto_kickoff').upsert({ projeto_id: id, itens }, { onConflict: 'projeto_id' });
  if (error) { toast('Falhou: ' + error.message, 'err'); return; }
  _pj.kickoff.itens = itens;
  toast('Checklist salvo', 'ok');
}

async function toggleEtapa(id, atualmenteOk){
  const patch = atualmenteOk
    ? { status: 'pendente', data_real: null }
    : { status: 'concluida', data_real: new Date().toISOString().slice(0,10) };
  const { error } = await sb.from('va_projeto_etapas').update(patch).eq('id', id);
  if (error) { toast('Falhou: ' + error.message, 'err'); return; }
  toast(atualmenteOk ? 'Reaberta' : 'Concluída', 'ok');
  renderProjeto(_pj.projeto.id);
}

async function adicionarBlacklist(){

function vincularPreco(){
  const v = document.getElementById('pr-valor');
  const d = document.getElementById('pr-decidido');
  const j = document.getElementById('pr-just');
  if (v) v.addEventListener('blur', () => salvarPrecoCampo('valor_venda', v.value));
  if (d) d.addEventListener('change', () => salvarPrecoCampo('valor_venda_decidido_por', d.value));
  if (j) j.addEventListener('blur', () => salvarPrecoCampo('valor_venda_justificativa', j.value));
  const flex = document.getElementById('pr-flex');
  const ent  = document.getElementById('pr-entmin');
  const parc = document.getElementById('pr-parc');
  const parcM= document.getElementById('pr-parcmax');
  const obsn = document.getElementById('pr-obsn');
  if (flex) flex.addEventListener('blur', () => salvarPrecoCampo('flexibilidade_percent', flex.value));
  if (ent) ent.addEventListener('blur',   () => salvarPrecoCampo('entrada_minima_percent', ent.value));
  if (parc) parc.addEventListener('change',() => { salvarPrecoCampo('aceita_parcelamento', parc.value==='true'); if(parcM) parcM.disabled = parc.value!=='true'; });
  if (parcM) parcM.addEventListener('blur',() => salvarPrecoCampo('parcelamento_max_meses', parcM.value));
  if (obsn) obsn.addEventListener('blur',  () => salvarPrecoCampo('observacoes_negociacao', obsn.value));
}

async function salvarPrecoCampo(campo, raw){
  let val;
  if (campo === 'valor_venda' || campo === 'flexibilidade_percent' || campo === 'entrada_minima_percent' || campo === 'parcelamento_max_meses') {
    val = (raw==='' || raw==null) ? null : Number(raw);
    if (val != null && !isFinite(val)) { toast('Valor inválido', 'err'); return; }
  } else if (campo === 'aceita_parcelamento') {
    val = !!raw;
  } else {
    val = (typeof raw === 'string' ? raw.trim() : raw) || null;
  }
  if (_pj.projeto[campo] === val) return;
  const id = _pj.projeto.id;
  const patch = {}; patch[campo] = val;
  const { error } = await sb.from('va_projetos').update(patch).eq('id', id);
  if (error) { toast('Falhou: ' + error.message, 'err'); return; }
  patchProjetoLocal(patch);
  toast('Salvo', 'ok');
  await checarAutoConclusao('preco');
  if (_abaChave === 'preco') desenhaAba();
}

function htmlArquetipos(e){
  const ok = e.status === 'concluida';
  const catalogo = _pj.catalogo || [];
  const selecionados = _pj.arquetipos || [];
  const selMap = new Map(selecionados.map(a => [a.codigo, a]));
  const qtd = selecionados.length;
  const avisoDemais = qtd > 5 ? `<div class="aviso" style="margin-top:12px">Matriz com muitos alvos é matriz sem alvo. Recomendado 3 a 5.</div>` : '';

  const cards = catalogo.map(c => {
    const on = selMap.has(c.codigo);
    return `
      <button type="button" class="arq-card ${on?'on':''}" data-arq="${esc(c.codigo)}">
        <span class="arq-selo ${esc(c.captavel_por||'')}">${esc(c.captavel_por||'—')}</span>
        <span class="cd">${esc(c.codigo)}</span>
        <span class="nm">${esc(c.nome)}</span>
        <span class="bs">${esc(c.busca)}</span>
      </button>`;
  }).join('');

  const semQuery = selecionados.filter(a => !Array.isArray(a.queries_busca) || a.queries_busca.length === 0);
  const avisoSemQuery = semQuery.length ? `<div class="aviso-red" style="margin-top:12px"><strong>Arquétipo sem query não produz contato.</strong> É o fio que liga a estratégia à prospecção. Falta em: ${semQuery.map(a=>esc(a.codigo)).join(', ')}.</div>` : '';

  const calibragem = selecionados.length ? selecionados.map(a => {

let _chatArqSessao = null;

function cardChatArquetipos(){
  const s = _pj.chatArq;
  if (!s) {
    return `<div class="k-card">
      <div class="lbl">01 · assistente IA</div>
      <h3>Definir teses de comprador com IA</h3>

      <div class="row" style="gap:8px;margin-top:12px">
        <button class="btn btn-primary" onclick="chatArqIniciar()">Definir arquétipos com IA</button>

      <div id="chat-arq-status" class="muted" style="font-size:12px;margin-top:6px"></div>
    </div>`;
  }
  const msgs = (s.mensagens||[]).map(m => {
    const cls = m.role === 'user' ? 'msg-user' : 'msg-ia';

    return `<div class="chat-msg ${cls}">${esc(txt).replace(/\n/g,'<br>')}</div>`;

  const teses = (s.teses_propostas||[]).map((t,i) => `

        <div><span class="mono" style="color:var(--ink-3);font-size:12px">${esc(t.codigo||('T'+(i+1)))}</span> <strong>${esc(t.nome||'—')}</strong></div>
        <button class="btn btn-ghost btn-sm" onclick="chatArqContar(${i})">contar universo</button>
      </div>
      <div class="muted" style="font-size:13px;margin-top:4px">${esc(t.raciocinio||'')}</div>
      <div style="margin-top:6px;font-size:12px">
        <b>queries:</b> ${(t.queries_busca||[]).map(q => `<span class="chip">${esc(q)}</span>`).join(' ')}
        &nbsp;·&nbsp; <b>porte:</b> ${t.faixa_porte_multiplo?.min||'?'}×–${t.faixa_porte_multiplo?.max||'?'}× semente
      </div>
      <div id="tese-universo-${i}" class="muted" style="font-size:12px;margin-top:4px"></div>
    </div>`).join('');
  const canais = (s.canaisPropostos||[]).length ? `
    <div style="margin-top:12px">
      <div class="lbl" style="margin-bottom:6px">canais sugeridos pela IA</div>
      ${s.canaisPropostos.map(c => `
        <div class="tese-card">
          <div><span class="chip">${esc(c.tipo)}</span> <strong>${esc(c.nome)}</strong></div>
          ${c.url?`<div style="font-size:12px"><a href="${esc(c.url)}" target="_blank">${esc(c.url)}</a></div>`:''}
          ${c.descricao?`<div class="muted" style="font-size:12px">${esc(c.descricao)}</div>`:''}
        </div>`).join('')}
    </div>` : '';
  const isAprovada = s.status !== 'aberta';
  return `<div class="k-card">
    <div class="lbl" style="display:flex;justify-content:space-between">
      <span>01 · assistente IA</span>
      <span class="mono" style="font-size:11px;color:var(--ink-3)">R$ ${Number(s.custo_ia_total||0).toFixed(2)} IA · R$ ${Number(s.custo_kipflow_contagem||0).toFixed(2)} Kipflow</span>

    <div class="chat-container" style="margin-top:10px">${msgs}</div>
    ${!isAprovada ? `
      <div class="row" style="gap:6px;margin-top:10px">
        <input id="chat-arq-input" placeholder="Contradiga, ajuste, peça mais teses…" style="flex:1" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();chatArqEnviar();}">
        <button class="btn btn-ghost btn-sm" onclick="chatArqEnviar()">enviar</button>

      </div>` : ''}

async function chatArqIniciar(){
  const st = document.getElementById('chat-arq-status');
  if (st) { st.textContent = 'iniciando…'; st.style.color=''; }
  const sess = (await sb.auth.getSession()).data.session;
  const r = await fetch('/api/chat-arquetipos', {
    method:'POST', headers:{'Content-Type':'application/json',Authorization:'Bearer '+(sess?.access_token||'')},
    body: JSON.stringify({ action:'iniciar', projeto_id: _pj.projeto.id }),
  });
  const d = await r.json();
  if (!r.ok || !d.ok) { toast(d.erro || 'erro', 'err'); return; }
  _pj.chatArq = {
    id: d.sessao_id, status:'aberta',
    mensagens: [{role:'assistant',content:d.resposta}],
    teses_propostas: d.teses || [], canaisPropostos: d.canais || [],
    custo_ia_total: d.custo_ia_real || 0, custo_kipflow_contagem: 0,
  };
  desenhaAba();
}
async function chatArqEnviar(){
  const input = document.getElementById('chat-arq-input'); if (!input) return;
  const txt = input.value.trim(); if (!txt) return;
  input.value = ''; const st = document.getElementById('chat-arq-status');
  if (st) st.textContent = 'pensando…';
  const sess = (await sb.auth.getSession()).data.session;
  const r = await fetch('/api/chat-arquetipos', {
    method:'POST', headers:{'Content-Type':'application/json',Authorization:'Bearer '+(sess?.access_token||'')},
    body: JSON.stringify({ action:'mensagem', sessao_id: _pj.chatArq.id, mensagem: txt }),
  });
  const d = await r.json();
  if (!r.ok || !d.ok) { toast(d.erro||'erro','err'); return; }
  _pj.chatArq.mensagens.push({role:'user',content:txt});
  _pj.chatArq.mensagens.push({role:'assistant',content:d.resposta});
  if (d.teses) _pj.chatArq.teses_propostas = d.teses;
  if (d.canais) _pj.chatArq.canaisPropostos = d.canais;
  _pj.chatArq.custo_ia_total = Number(_pj.chatArq.custo_ia_total||0) + Number(d.custo_ia_real||0);
  desenhaAba();
}
async function chatArqContar(idx){
  const tese = _pj.chatArq.teses_propostas[idx]; if (!tese) return;
  const el = document.getElementById('tese-universo-'+idx);

  const sess = (await sb.auth.getSession()).data.session;

    method:'POST', headers:{'Content-Type':'application/json',Authorization:'Bearer '+(sess?.access_token||'')},
    body: JSON.stringify({ action:'contagem', sessao_id: _pj.chatArq.id, tese }),
  });
  const d = await r.json();
  if (!r.ok || !d.ok) { if (el) el.textContent = 'erro: '+(d.erro||''); return; }
  _pj.chatArq.custo_kipflow_contagem = Number(_pj.chatArq.custo_kipflow_contagem||0) + Number(d.custo_kipflow||0);
  if (el) {
    const cor = d.universo >= 500 ? 'green' : d.universo >= 50 ? '#c60' : '#c00';
    el.style.color = cor;

  }
}

async function canalAdd(){

  const url = prompt('URL (opcional):') || null;
  const { data, error } = await sb.from('va_projeto_canais_manuais').insert({
    projeto_id: _pj.projeto.id, tipo, nome, url, origem: 'manual',

async function mapsBuscar(){
  const termo = document.getElementById('maps-termo').value.trim();
  const regiao = document.getElementById('maps-regiao').value.trim();
  const limite = Math.min(50, Number(document.getElementById('maps-limite').value)||10);
  if (!termo) { toast('termo obrigatório','err'); return; }
  const custoEstimado = (limite * 0.01).toFixed(2);
  if (!confirm(`Buscar até ${limite} lugares no Maps? Custo estimado: R$ ${custoEstimado}. Resultado cai na Triagem.`)) return;
  const st = document.getElementById('maps-status'); if (st) st.textContent = 'consultando Apify…';
  const sess = (await sb.auth.getSession()).data.session;
  const r = await fetch('/api/maps-busca', {
    method:'POST', headers:{'Content-Type':'application/json',Authorization:'Bearer '+(sess?.access_token||'')},
    body: JSON.stringify({ projeto_id: _pj.projeto.id, termo, regiao, limite }),
  });
  const d = await r.json();
  if (!r.ok || !d.ok) { toast(d.erro||'erro','err'); if (st) st.textContent=''; return; }
  const cont = Object.entries(d.contagem_por_status||{}).map(([s,n])=>`${s}:${n}`).join(' · ');
  if (st) st.textContent = `${d.raspados} raspados · ${d.inseridos} inseridos · ${cont} · R$ ${(d.debitado_lead_maps*0.01).toFixed(2)} debitado`;
  toast('busca concluída · ver Triagem','ok');
}

async function htmlTriagem(){
