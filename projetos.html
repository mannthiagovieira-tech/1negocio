}

// ─── CARD 6 · PREÇOS ─────────────────────────────────────────────
function cardPrecos(){
  const precos = _pj.precos || [];
  const aberto = _pj.precosAberto;
  return `
    <div class="k-card">
      <div class="lbl">06 · tabela de preços</div>
      <button class="orc-precos-toggle ${aberto?'aberto':''}" onclick="togglePrecos()">
        <span>Preços de execução</span>
        <span class="muted mono" style="font-size:11px;color:var(--ink-3);letter-spacing:.05em;margin-left:auto">${aberto?'esconder':'expandir'}</span>
        <span class="chev">▼</span>
      </button>
      ${aberto ? htmlPrecosBody(precos) : ''}
    </div>`;
}

function htmlPrecosBody(precos){
  const rows = precos.map(p => {
    const margem = Number(p.preco) > 0 ? ((Number(p.preco) - Number(p.custo_real||0)) / Number(p.preco)) * 100 : null;
    const badge = p.repassa_sem_margem
      ? '<span class="preco-repasse">repasse</span>'
      : (Number(p.preco) === 0 ? '<span class="preco-a-definir">a definir</span>' : '');
    return `<tr>
      <td>${esc(p.rotulo)} ${badge}<div class="muted mono" style="font-size:10px;margin-top:2px">${esc(p.tipo)} · ${esc(p.unidade)}</div></td>
      <td class="num"><input type="number" min="0" step="0.01" data-preco-campo="custo_real" data-preco-tipo="${esc(p.tipo)}" value="${p.custo_real ?? 0}" style="width:110px"></td>
      <td class="num"><input type="number" min="0" step="0.01" data-preco-campo="preco" data-preco-tipo="${esc(p.tipo)}" value="${p.preco ?? 0}" style="width:110px"></td>
      <td class="num" style="color:${margem==null?'var(--ink-4)':(margem<30?'var(--amber)':'var(--accent-2)')}">${margem==null?'—':margem.toFixed(0)+'%'}</td>
    </tr>`;
  }).join('');
  return `
    <table class="orc-tab" style="margin-top:14px">
      <thead><tr><th>item</th><th class="num">custo real</th><th class="num">preço</th><th class="num">margem</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="orc-nota">Mídia repassa a custo, sem margem — é o item auditável que sustenta a credibilidade do resto do extrato. Alterar preço aqui NÃO reescreve nada já lançado no razão.</div>`;
}

// ─── vinculadores ────────────────────────────────────────────────
function vincularOrcamento(){
  // Card plano
  const plTipo = document.getElementById('pl-tipo');
  const plAdd  = document.getElementById('pl-add');
  if (plAdd)   plAdd.addEventListener('click', adicionarLinhaPlano);

  // Card parcelas · onblur de observação e asaas
  document.querySelectorAll('#stage [data-parc-obs]').forEach(el =>
    el.addEventListener('blur', () => atualizarParcelaCampo(el.dataset.parcObs, { observacao: el.value.trim() || null })));
  document.querySelectorAll('#stage [data-parc-asaas]').forEach(el =>
    el.addEventListener('blur', () => atualizarParcelaCampo(el.dataset.parcAsaas, { asaas_cobranca_id: el.value.trim() || null })));

  // Card preços · onblur inline
  document.querySelectorAll('#stage [data-preco-tipo]').forEach(el =>
    el.addEventListener('blur', () => atualizarPreco(el.dataset.precoTipo, el.dataset.precoCampo, el.value)));
}

// ─── ciclo atual ─────────────────────────────────────────────────
function calcularCicloAtual(){
  const dInicio = _pj.projeto.data_inicio;
  if (!dInicio) return 1;
  const meses = Math.max((new Date() - new Date(dInicio+'T00:00:00')) / (30*86400000), 0);
  return Math.floor(meses) + 1;
}

// ─── PLANO ───────────────────────────────────────────────────────
async function adicionarLinhaPlano(){
  const tipo = document.getElementById('pl-tipo').value;
  const natureza = document.getElementById('pl-natureza').value;
  const meta = Number(document.getElementById('pl-meta').value) || 0;
  const obs = document.getElementById('pl-obs').value.trim() || null;
  const pi = precoInfo(tipo);
  if (!pi) { toast('Tipo inválido', 'err'); return; }
  const fid = Number(_pj.projeto.fidelidade_meses) || 1;
  const precoUnit = Number(pi.preco) || 0;
  const valorPrev = natureza === 'recorrente' ? meta * precoUnit * fid : meta * precoUnit;
  const { error } = await sb.from('va_projeto_plano').insert({
    projeto_id: _pj.projeto.id, tipo, natureza,
    meta_quantidade: meta, preco_unitario_previsto: precoUnit, valor_previsto: valorPrev, observacao: obs,
  });
  if (error) { toast('Falhou: ' + error.message, 'err'); return; }
  toast('Linha adicionada · preço congelado', 'ok');
  await recarregarFinanceiro();
}

async function removerLinhaPlano(id){
  if (!confirm('Remover esta linha do plano?')) return;
  const { error } = await sb.from('va_projeto_plano').delete().eq('id', id);
  if (error) { toast('Falhou: ' + error.message, 'err'); return; }
  toast('Removida', 'ok');
  await recarregarFinanceiro();
}

// ─── RAZÃO ────────────────────────────────────────────────────────
function filtrarRazao(c){ _pj.razaoFiltroCiclo = c; desenhaAba(); }

function abrirModalDebito(){
  const precos = (_pj.precos || []).filter(p => p.ativo);
  const opts = precos.map(pi => `<option value="${esc(pi.tipo)}">${esc(pi.rotulo)}${Number(pi.preco)===0?' (preço 0)':''}</option>`).join('');
  const mb = document.getElementById('modal-back');
  mb.innerHTML = `
    <div class="modal-card" onclick="event.stopPropagation()">
      <div class="lbl" style="margin-bottom:6px">novo débito</div>
      <h3>Lançar linha no razão</h3>
      <p class="muted" style="margin-top:-4px;margin-bottom:16px;font-size:12.5px">O preço é lido de va_precos e congelado na hora do lançamento.</p>
      <div class="col" style="gap:12px">
        <div class="fld"><span class="lbl">tipo</span><select id="md-tipo">${opts}</select></div>
        <div class="fld"><span class="lbl">quantidade</span><input type="number" min="0.01" step="0.01" id="md-qtd" value="1"></div>
        <div class="fld"><span class="lbl">referência</span><input type="text" id="md-ref" placeholder="ex: Onda 1 · A2 concorrente local"></div>
      </div>
      <div class="row" style="justify-content:flex-end;gap:8px;margin-top:20px">
        <button class="btn btn-ghost btn-sm" onclick="fecharModal()">cancelar</button>
        <button class="btn btn-primary btn-sm" id="md-salvar">lançar</button>
      </div>
    </div>`;
  mb.classList.add('on');
  document.getElementById('md-salvar').addEventListener('click', salvarDebito);
}

function fecharModal(ev){
  if (ev && ev.target.id !== 'modal-back') return;
  const mb = document.getElementById('modal-back');
  mb.classList.remove('on');
  mb.innerHTML = '';
}

async function salvarDebito(){
  const tipo = document.getElementById('md-tipo').value;
  const qtd  = Number(document.getElementById('md-qtd').value);
  const ref  = document.getElementById('md-ref').value.trim() || null;
  if (!tipo || !isFinite(qtd) || qtd <= 0) { toast('Preencha tipo e quantidade', 'err'); return; }
  const { error } = await sb.rpc('va_debitar', {
    p_projeto: _pj.projeto.id, p_tipo: tipo, p_qtd: qtd, p_referencia: ref, p_ciclo: null,
  });
  if (error) { toast('Falhou: ' + error.message, 'err'); return; }
  toast('Débito lançado', 'ok');
  fecharModal();
  await recarregarFinanceiro();
}

async function lancarGestaoAtual(ciclo){
  const { error } = await sb.rpc('va_lancar_gestao', { p_projeto: _pj.projeto.id, p_ciclo: ciclo });
  if (error) { toast('Falhou: ' + error.message, 'err'); return; }
  toast('Gestão do ciclo ' + ciclo + ' lançada', 'ok');
  await recarregarFinanceiro();
}

// ─── PARCELAS ────────────────────────────────────────────────────
async function pagarParcela(id){
  const { error } = await sb.from('va_projeto_parcelas').update({
    status: 'pago', pago_em: new Date().toISOString().slice(0,10),
  }).eq('id', id);
  if (error) { toast('Falhou: ' + error.message, 'err'); return; }
  toast('Parcela marcada como paga · crédito atualizado', 'ok');
  await recarregarFinanceiro();
}

async function voltarParcela(id){
  if (!confirm('Desmarcar pagamento? O crédito liberado será recalculado.')) return;
  const { error } = await sb.from('va_projeto_parcelas').update({
    status: 'pendente', pago_em: null,
  }).eq('id', id);
  if (error) { toast('Falhou: ' + error.message, 'err'); return; }
  toast('Parcela voltou pra pendente', 'ok');
  await recarregarFinanceiro();
}

async function atualizarParcelaCampo(id, patch){
  const { error } = await sb.from('va_projeto_parcelas').update(patch).eq('id', id);
  if (error) { toast('Falhou: ' + error.message, 'err'); return; }
  const pa = _pj.parcelas.find(x => x.id === id);
  if (pa) Object.assign(pa, patch);
  toast('Salvo', 'ok');
}

// ─── PREÇOS ──────────────────────────────────────────────────────
function togglePrecos(){ _pj.precosAberto = !_pj.precosAberto; desenhaAba(); }

async function atualizarPreco(tipo, campo, raw){
  const val = raw === '' ? 0 : Number(raw);
  if (!isFinite(val)) { toast('Valor inválido', 'err'); return; }
  const p = _pj.precos.find(x => x.tipo === tipo);
  if (!p || Number(p[campo]) === val) return;
  const patch = {}; patch[campo] = val;
  const { error } = await sb.from('va_precos').update(patch).eq('tipo', tipo);
  if (error) { toast('Falhou: ' + error.message, 'err'); return; }
  p[campo] = val;
  toast('Preço salvo · histórico intacto', 'ok');
  desenhaAba();
}

window.toggleEtapa = toggleEtapa;
window.trocarAba = trocarAba;
window.rota = rota;
window.logout = logout;
window.removerBlacklist = removerBlacklist;
window.removerAnexo = removerAnexo;
window.removerLinhaPlano = removerLinhaPlano;
window.filtrarRazao = filtrarRazao;
window.abrirModalDebito = abrirModalDebito;
window.fecharModal = fecharModal;
window.lancarGestaoAtual = lancarGestaoAtual;
window.pagarParcela = pagarParcela;
window.voltarParcela = voltarParcela;
window.togglePrecos = togglePrecos;

(async function boot(){
  await initAuth();
  router();
})();
</script>
